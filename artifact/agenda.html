n": 10, "date": "2026-10-12", "title": "Linear regression model (1)", "lectures": ["2026-10-12a-linear-regression-1.md", "2026-10-12b-case-cofounders.md"], "kind": "lesson", "status": "active"}, {"n": 11, "date": "2026-10-16", "title": "Linear regression model (2): logs, quadratics, interactions", "lectures": ["2026-10-16-linear-regression-2-stata.md"], "kind": "lesson", "status": "active"}, {"n": 12, "date": "2026-10-30", "title": "Hypothesis testing", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 13, "date": "2026-11-02", "title": "Further specification issues", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 14, "date": "2026-11-06", "title": "Binary dependent variables", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 15, "date": "2026-11-09", "title": "Data lab / Guest speaker", "lectures": [], "kind": "lab", "status": "active"}, {"n": 16, "date": "2026-11-13", "title": "Data lab / Guest speaker", "lectures": [], "kind": "lab", "status": "active"}, {"n": 17, "date": "2026-11-16", "title": "Data lab / Guest speaker", "lectures": [], "kind": "lab", "status": "active"}, {"n": 18, "date": "2026-11-23", "title": "Data lab / Guest speaker", "lectures": [], "kind": "lab", "status": "active"}, {"n": 19, "date": "2026-11-27", "title": "Final presentations", "lectures": [], "kind": "group", "status": "active"}, {"n": 20, "date": "2026-11-30", "title": "Final presentations", "lectures": [], "kind": "group", "status": "active"}, {"n": 21, "date": "2026-12-04", "title": "Final presentations", "lectures": [], "kind": "group", "status": "active"}, {"n": 0, "date": "2026-10-15", "title": "Progetto di gruppo: incontri con la TA", "lectures": ["2026-10-15-ta-meeting-project.md"], "kind": "project", "status": "active"}], "order": 3, "cfu": 8, "quiz": {"2026-10-09-descriptive-analysis.md": [{"type": "mc", "q": "In una distribuzione asimmetrica positiva (right-skewed) come i fondi raccolti dalle startup:", "options": ["Media > mediana", "Media < mediana", "Media = mediana", "La mediana non esiste"], "answer": [0], "explain": "Pochi valori molto alti spostano la media verso destra. Il gap media-mediana segnala outlier."}, {"type": "mc", "q": "Cosa fare con gli outlier?", "options": ["Eliminarli sempre", "Indagarli: possono essere errori, fenomeni rari reali o manipolazioni; ogni eliminazione/ricodifica è un'assunzione da giustificare", "Ignorarli", "Sostituirli con la media"], "answer": [1], "explain": "Eliminare le startup più finanziate distorce i risultati. Gli scatter plot li mostrano meglio degli istogrammi."}, {"type": "mc", "q": "Cosa segnala una distribuzione bimodale?", "options": ["Errore nei dati", "La presenza di sottogruppi", "Normalità", "Eteroschedasticità"], "answer": [1], "explain": "Altri tipi: normale, asimmetrica, uniforme."}, {"type": "open", "q": "Nel caso Etiopia, perché il genere del neonato è un 'esperimento naturale' e qual è il meccanismo trovato?", "answer": "Il genere del figlio è casuale (esogeno) rispetto alle caratteristiche della famiglia, quindi isola l'effetto causale. Famiglie con figli maschi erano ~3-3,5% più propense ad adottare nuove tecnologie: le figlie ci si aspetta che si sposino e si trasferiscano, quindi senza erede maschio le famiglie evitano investimenti di lungo periodo (es. water harvesting)."}, {"type": "open", "q": "Elenca almeno quattro errori comuni nell'analisi descrittiva.", "answer": "Assi troncati (fanno sembrare grandi differenze piccole), analisi trainate dagli outlier, grafici a torta che non sommano a 100, confondere correlazione con causalità, considerare correlazioni non statisticamente significative, troppe poche osservazioni (servono >100 per una regressione semplice), variabili senza variabilità."}], "2026-10-12a-linear-regression-1.md": [{"type": "mc", "q": "Cosa richiede l'assunzione di zero conditional mean (esogeneità)?", "options": ["Che x abbia media zero", "Che x sia incorrelata con il termine di errore", "Che gli errori abbiano varianza costante", "Che y sia normale"], "answer": [1], "explain": "Violazione classica: ability bias nella regressione del salario sull'istruzione. Varianza costante = omoschedasticità."}, {"type": "mc", "q": "p-value = 0,062. Con α = 5%:", "options": ["Si rifiuta H0", "Non si rifiuta H0 (fail to reject); è significativo solo al 10%", "Si accetta H0", "Il coefficiente è zero"], "answer": [1], "explain": "Non si dice mai 'accettare' H0."}, {"type": "mc", "q": "Food = 83,42 + 10,21 × income, con income in centinaia di dollari. Interpretazione corretta?", "options": ["+1$ di reddito → +10,21$ di spesa alimentare", "+100$ di reddito settimanale → +10,21$ di spesa alimentare", "+10,21% di spesa per ogni 1% di reddito", "Il reddito non influisce"], "answer": [1], "explain": "Trappola tipica d'esame: controllare l'unità di misura delle variabili."}, {"type": "mc", "q": "Come si riduce l'errore di II tipo?", "options": ["Abbassando α", "Aumentando le osservazioni e la potenza del test", "Usando errori standard robusti", "Non si può ridurre"], "answer": [1], "explain": "L'errore di I tipo è controllato da α."}, {"type": "open", "q": "Perché usare sempre gli errori standard robusti? Come ti accorgi del problema guardando i residui?", "answer": "Perché con eteroschedasticità (varianza dell'errore non costante, es. spesa alimentare più variabile ai redditi alti) gli SE classici sono sbagliati e quindi t-stat e p-value non sono affidabili; i robusti correggono. Si vede dal residual plot: la dispersione dei residui si allarga (forma a imbuto) al crescere di x."}], "2026-10-12b-case-cofounders.md": [{"type": "mc", "q": "Il coefficiente dei founder è significativo all'1% ma l'R² è 0,88%. Cosa significa?", "options": ["Il modello è sbagliato", "L'effetto è statisticamente significativo ma il numero di founder spiega pochissima variazione dei fondi raccolti", "L'effetto non esiste", "Bisogna eliminare l'intercetta"], "answer": [1], "explain": "Significatività e capacità esplicativa sono cose diverse."}, {"type": "mc", "q": "Perché il numero di dipendenti è un 'bad control' nella regressione dei fondi raccolti?", "options": ["Ha troppi missing", "Reverse causality: probabilmente misurato dopo il funding, quindi causato dai fondi", "È una dummy", "È collineare con l'anno"], "answer": [1], "explain": "Il numero di deal invece è determinato simultaneamente al totale raccolto: simultaneity bias."}, {"type": "open", "q": "Interpreta il coefficiente di 'years since 2012' (~ −4) e spiega perché il coefficiente dei founder resta stabile aggiungendolo.", "answer": "Ogni anno di fondazione più recente è associato a ~4 milioni in meno raccolti, a parità di founder: cattura la 'liability of youth' (le imprese più giovani hanno avuto meno tempo per raccogliere). Il coefficiente dei founder è stabile perché l'anno non è (molto) correlato col numero di founder, quindi non era un confondente rilevante."}], "2026-10-16-linear-regression-2-stata.md": [{"type": "mc", "q": "Modello log-level: ln(y) = β0 + 0,05·x. Interpretazione?", "options": ["+1 unità di x → +0,05 unità di y", "+1 unità di x → circa +5% di y", "+1% di x → +0,05% di y", "+1% di x → +0,05 unità di y"], "answer": [1], "explain": "Log-level: β×100 = variazione % di y per unità di x. Log-log = elasticità. Level-log: β/100 = variazione in unità di y per +1% di x."}, {"type": "mc", "q": "Level-log: food = β0 + 132·ln(income). Interpretazione?", "options": ["+1% di reddito → +1,32 di spesa alimentare", "+1% di reddito → +132 di spesa", "+1 di reddito → +132%", "Elasticità pari a 132"], "answer": [0], "explain": "β/100 = 1,32."}, {"type": "mc", "q": "Quando NON usare il logaritmo?", "options": ["Per variabili continue asimmetriche", "Per variabili con pochi valori, percentuali, valori negativi", "Per i fondi raccolti con zeri (usa ln(1+x))", "Per il reddito"], "answer": [1], "explain": "Con zeri significativi si usa log(1+x); si usa sempre il logaritmo naturale."}, {"type": "mc", "q": "In Stata, cosa fa `reg y c.educ##c.exper`?", "options": ["Include solo l'interazione", "Include educ, exper e la loro interazione", "Esegue due regressioni separate", "Calcola la correlazione"], "answer": [1], "explain": "`##` include interazione + termini base; `#` solo l'interazione. I termini base devono restare nel modello."}, {"type": "open", "q": "y = β0 + β1·x + β2·x². Con β1 = 4 e β2 = −0,1 che forma ha la relazione e dov'è il turning point? Perché il termine lineare va sempre incluso?", "answer": "β2 < 0 → U rovesciata. Turning point x* = −β1/(2β2) = −4/(2×−0,1) = 20. Il termine lineare va sempre incluso perché senza di esso si impone che il vertice sia a x = 0, vincolando arbitrariamente la forma."}, {"type": "open", "q": "Con un termine di interazione educ×exper, come si interpreta il coefficiente di educ da solo?", "answer": "È l'effetto dell'istruzione quando exper = 0 (non un effetto medio). L'effetto marginale dell'istruzione è β_educ + β_inter × exper: con interazione negativa, il rendimento dell'istruzione diminuisce al crescere dell'esperienza."}], "2026-10-15-ta-meeting-project.md": [{"type": "open", "q": "Riassumi la domanda di ricerca del tuo progetto, la definizione di failure scelta e le principali decisioni sul dataset.", "answer": "Tra le startup USA VC-backed, la dimensione del sindacato (numero di investitori) è legata al fallimento dopo i primi round? Failure = bankruptcy o out of business in ownership status o business status. Si confrontano i round per deal type stage (seed, early, later), non per numero cronologico. Si parte dal company file e si fa merge dei deal su company ID; si droppano round senza deal ID e deal senza data di finanziamento; non restringere il campione all'inizio. Syndication = variabile indipendente, failure = dipendente, altre variabili come controlli."}]}, "lectures": {"2026-10-09-descriptive-analysis.md": {"file": "2026-10-09-descriptive-analysis.md", "title": "Data Analysis 9-10 — Descriptive Analysis (caso Etiopia)", "date": "2026-10-09", "wispr": "https://notes.wisprflow.ai/shared/Msyom_F0qStmIgsomQ6uwMLNxPR-DlpcAJV7-r1Ufgg", "body": "Descriptive analysis for econometrics: distributions, central tendency, dispersion, outliers, correlation, and common pitfalls, illustrated with an Ethiopia technology-adoption study.\n\n### Course Format and Exam\n- **Exam questions will focus on theory covered in the first part of each session and on the slides.**\n- Second part of each session uses a continuing case developed across classes with different methodologies.\n- Project must show descriptive patterns and key variable distributions before any regression.\n\n### Distributions and Summary Metrics\n- Descriptive analysis summarizes central tendency, variability, and correlations; it is the first step of any analysis.\n- Distribution types: normal, skewed (e.g. funding is right skewed), uniform, and bimodal (signals subgroups).\n    - Mean below median in negative skew, above in positive skew; gap signals outliers\n- Rule of thumb: need more than 100 observations for a simple linear regression.\n- No variability means no information: regressions cannot uncover relationships without variation in X or Y.\n    - Highly skewed variables can be log-transformed to plot more readably\n\n### Outliers and Use of AI Tools\n- Outliers can be data errors (e.g. negative R&D), rare real phenomena, or data manipulation and fabrication.\n- Dropping or recoding outliers is an assumption that must be justified; dropping top-funded firms distorts results.\n- Scatter plots reveal outliers better than histograms.\n- Students must be able to verify and correct AI analysis; undeclared fabricated data is an ethical and legal issue.\n\n### Correlation and Common Mistakes\n- Correlation can be positive, negative, or none; only statistically significant correlations are credible.\n- Cross-tabulation example: most tech startups founded by males, with variation by industry.\n- Pitfalls: truncated axes, outlier-driven analysis, pie charts not summing to 100, and **confusing correlation with causality**.\n\n### Ethiopia Technology Adoption Case\n- UN-funded panel of about 1,000 rural households in Ethiopia, surveyed every two years from 2013 to 2021.\n- 65% adopted new technologies, but mostly crop changes; water harvesting adoption was below 5%.\n- Newborn gender acted as a natural experiment: families with sons were about 3 to 3.5% more likely to adopt.\n- Mechanism: daughters expected to marry and relocate, so families avoided long-term investments without a male heir."}, "2026-10-12a-linear-regression-1.md": {"file": "2026-10-12a-linear-regression-1.md", "title": "Data Analysis 12-10 — Linear regression model (1)", "date": "2026-10-12", "wispr": "https://notes.wisprflow.ai/shared/alhj5VyuHX4oLzAWRXD2PUfhr1o7rd6YtzsYtAFY198", "body": "Introduction to regression analysis: model structure, coefficient interpretation, key assumptions (exogeneity, homoskedasticity), reading regression tables and hypothesis testing.\n\n### Regression Fundamentals\n- Regression estimates the average of y conditional on x via an intercept and slope; individuals deviate by their error term\n- A good project question fits in two lines and names the dependent and main independent variable\n- Simple model assumes constant returns; non-linearities come next class\n    - Theory, not the regression, should drive what goes into the model\n- Intercept is average y when all x equal 0; slope is change in y from a unitary increase in x\n\n### Key Assumptions and Bias\n- **Zero conditional mean (exogeneity)**: x must be uncorrelated with the error term to make causal claims\n    - Ability bias in wage on education is the classic violation\n    - Omitted variables uncorrelated with x do not bias causal estimates\n- Sample selection can make estimates differ from the population; observations should be independent\n- Residual plot of food expenditure shows heteroskedasticity; **always run regressions with robust standard errors**\n\n### Reading Output and Hypothesis Testing\n- OLS minimizes the sum of squared residuals; tables report coefficient, standard error, t-statistic, p-value\n- Food example: 100 dollar increase in weekly income linked to 10.21 dollars more food spending; intercept 83.42\n    - **Check variable scale (hundreds of dollars), a typical exam trap**\n- Default test is H0: beta = 0; alpha conventionally 0.05; say 'reject' or 'fail to reject', never 'accept'\n    - p-value 0.062: significant at 10% not 5%; t-stat rule of thumb about 2 (2.06) at 5%\n- Type I error controlled by alpha; Type II reduced only through more observations and power\n\n### Multiple Regression\n- Adding regressors removes confounders from the error term; coefficients read holding other variables fixed (ceteris paribus)"}, "2026-10-12b-case-cofounders.md": {"file": "2026-10-12b-case-cofounders.md", "title": "Data Analysis 12-10 — Caso: numero di co-founder e fondi raccolti", "date": "2026-10-12", "wispr": "https://notes.wisprflow.ai/shared/nRA1rRcqfv760NHURKcKtzjnLIjPKRXJkADqVk6h5ME", "body": "Class review of the co-founder team-size case: the founders effect on total raised is significant but explains little variation, and employees and deals are bad regressors to exclude.\n\n### Case Goal and Sample\n- Question: recommend a formal team-size bonus, no formal role, or a weak secondary role for applicants with more founders\n- Co-founders lost significance once many other factors were added\n- Sample limited to accelerator startups; about 1,507 observations after missings\n\n### Theoretical Expectations\n- Expected positive effect: more founders bring heterogeneous skills and competencies\n- But theory is ambiguous: coordination, communication and conflict costs offset the benefits; data decides which dominates\n\n### Simple Regression Results\n- Intercept about 4.1 million: predicted funding for a startup with 0 founders\n- Each additional founder raises average total raised by about 7.04 million, p-value 0.001, significant at 1%\n- **R-squared is very low (about 0.88%)**: founders are significant but explain little of funding variation\n- Estimates must report robust standard errors\n\n### Multiple Regression and Controls\n- Adding years since 2012 leaves the founders coefficient stable; its own coefficient is about −4\n    - Likely captures liability of youth: younger firms had less time to raise money\n- Toggling regressors on/off is normally the golden rule, but here employees and deals are **bad controls**:\n    - Employees likely measured after funding: **reverse causality**\n    - Deals determined simultaneously with total raised: **simultaneity bias**"}, "2026-10-15-ta-meeting-project.md": {"file": "2026-10-15-ta-meeting-project.md", "title": "Data Analysis 15-10 — 2° TA meeting progetto (syndication e failure)", "date": "2026-10-15", "wispr": "https://notes.wisprflow.ai/shared/wLIahloStk6b0AoTuVOfpm5-aJfaXUuvJlI0sRoig8U", "body": "TA check-in on the group's VC syndication project: the research question was reframed around startup survival, and the TA gave guidance on round comparison, failure definition, missing data, and dataset construction.\n\n### Research Question\n- Question: among VC-backed US startups, is syndicate size (number of investors) related to failure after early rounds?\n- \"Risk perception\" is unmeasurable; reframe as startup survival or likelihood of going out of business.\n\n### Comparing Financing Rounds\n- Compare startups by deal type stage (Seed, early, later), not by chronological round number.\n    - PitchBook only records raises above about 10k, so earlier rounds may be missing\n- Syndication expected to matter more in early stages; later stages carry less risk.\n\n### Failure Definition and Missing Data\n- Business status date and ownership status date may not reflect actual failure dates, but no better option exists.\n- Open question: measure failure within a fixed window (24 or 36 months) via survival analysis.\n- About 18% of completed VC rounds lack a deal ID and cannot be merged across files; selection bias handled through controls.\n- 26% of deals lack investor info, 10% lack financing dates.\n\n### Dataset Construction and Regression\n- Start from the company file (founded year, industry, number of founders, HQ country), then merge deals on company ID.\n- Don't restrict the sample upfront: define non-negotiable variables, build a general dataset, and cut later.\n- Syndication is the independent variable, failure the dependent; other variables enter as controls.\n\n### Decisions Made\n- Failure = bankruptcy or out of business in either ownership status or business status.\n- Rounds without a deal ID are dropped; deals missing financing dates are excluded."}, "2026-10-16-linear-regression-2-stata.md": {"file": "2026-10-16-linear-regression-2-stata.md", "title": "Data Analysis 16-10 — Linear regression (2): log, quadratici, interazioni + Stata", "date": "2026-10-16", "wispr": "https://notes.wisprflow.ai/shared/QAs3R5fhN0wN5igojMSVKCv9y572wrtpP-b4XCjzSqM", "body": "Modeling nonlinearities (logs, quadratic terms) and interaction terms, followed by a Stata crash course on the PitchBook startup database.\n\n### Using AI Coding Tools\n- Don't fully outsource analysis to AI; use it alongside Stata for support and validation.\n- In a past exercise an AI tool silently cut about 300 observations, invalidating a student's regressions.\n    - Always check observation counts and be able to trace each step of the code\n\n### Logarithmic Transformations\n- Nonlinearities are added via variable transformations or extra terms, keeping the model linear in parameters.\n- **Interpretation: log-log = elasticity (% change in y for 1% change in x); log-level: multiply β by 100 (% change in y for a unit change in x); level-log: divide β by 100 (unit change in y for 1% change in x).**\n    - Example: level-log food model coefficient 132 means 1% more income adds about 1.32 in food spending\n- Use logs for skewed continuous or many-valued integer variables; avoid for few-value units, percentages, negatives.\n    - With meaningful zeros (e.g. total raised), use log(1 + x)\n- **Interpretation of transformed coefficients will be on the exam**; always use the natural log.\n\n### Quadratic and Interaction Terms\n- Quadratic terms test U-shaped or inverted U-shaped relations; the linear term must always be included.\n    - Turning point: x* = −β1 / (2·β2)\n- Housing price vs. square meters is usually U-shaped in data, driven by the luxury segment after the turning point.\n- Interaction terms test moderation by a third variable; baseline variables must stay in the regression.\n- With an interaction, each baseline coefficient is the effect when the other interacted variable equals zero.\n    - Wage example: education 9.4%, experience 0.6%, negative interaction term\n\n### Stata Crash Course (PitchBook Database)\n- Data checks: describe, count, list, codebook, duplicates, tabulate with missing; company ID has no missings or duplicates.\n    - Accelerator dummy missings recoded to 0, keeping about 57,000 firms instead of 22,000\n- Descriptives: summarize (detail), bysort, histograms, kernel density, box plots, scatter plots, encode, bar and pie charts.\n- Regressions: robust SE, estimates store, residual plots, test, log specs, quadratic turning point, margins.\n    - Use `##` to include interaction plus baseline terms automatically; `#` adds only the interaction"}}, "materials": [{"file": "syllabus-data-analysis.pdf", "kind": "reading", "topic": null, "size": 67137, "chars": 13539, "uploadedAt": "2026-11-04T18:17:27.054Z", "text": "[Pagina 1]\nSYLLABUS 2026/2027\n21072 DATA ANALYSIS MODULE I (DATA LAB FOR\nENTREPRENEURSHIP)\nClasse impartita in lingua inglese\nPrograms: INTENT (8 crediti - I sem. - OB | 8 cfu - ECON-04/A)\nClass: 27 (I sem.)\nDepartment: Management and Technology\nCourse director: STEFANO BRESCHI\nClasse 27\nRUJUTA SHIRISH BHAGWAT\nDepartment of Management and Technology\nUniversità Bocconi, Milan, Italy\nrujuta.bhagwat@unibocconi.it\nSTEFANO BRESCHI\nDepartment of Management and Technology\nUniversità Bocconi, Milan, Italy\nstefano.breschi@unibocconi.it\nLUISA GAGLIARDI\nDepartment of Management and Technology\nUniversità Bocconi, Milan, Italy\nluisa.gagliardi@unibocconi.it\nAttenzione! Il programma di seguito riportato è da considerarsi valido SOLO per l'anno accademico 2026/2027.\nMISSION\nThis course aims to provide students with a strong foundation in the principles and techniques\nof data analysis and econometric modeling. The first part will cover topics such as data\nmanipulation, data visualization, and statistical analysis using Python, one of the most popular\nprogramming languages. In this part of the course, students will learn how to write efficient and\neffective code to analyze and interpret data and will develop the ability to communicate their\nfindings in a clear and concise manner. The second part of the course will cover statistical\ninference and regression analysis. Students will learn how to apply these techniques to real-\nworld data sets and will develop the skills necessary to interpret and communicate their findings\neffectively. Throughout the course, a special emphasis will be put on the importance of critical\nthinking and problem-solving in the field of data analysis and econometrics. By the end of the\ncourse, students will be equipped with the knowledge and skills necessary to conduct rigorous\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 1/9\n\n[Pagina 2]\nSYLLABUS 2026/2027\ndata analysis and econometric modeling in a variety of contexts in their future academic or\nprofessional pursuits.\nCOURSE CONTENT DETAILED - SCHEDULE\n- INTENT cl. 27\nIn today’s data-driven landscape, understanding the dynamics of high-tech ventures requires\nmastery of complex, multi-source datasets and advanced analytical tools. This course\nempowers students to streamline and reshape raw startup ecosystem data—from fundraising\nrounds to performance metrics—into robust, analysis-ready formats. Through hands-on labs in\nPython and Stata, students will develop reproducible pipelines for data cleaning, integration,\nand visualization, then apply core econometric techniques (OLS, IV, panel models) to test\nhypotheses on growth, valuation, and investment trends. Throughout the lab, we emphasize\ncritical thinking and problem-solving as essential skills for navigating complex data workflows\nand econometric challenges. By the end of the course, students will be fully prepared to carry\nout robust data transformations and econometric analyses across a range of academic and\nprofessional settings.\nClass group 27 — INTENT — Breschi S. / Gagliardi L. — 10:15-12:45, Room N39, Sraffa 13 (3rd\nfloor)\n# Day Date Time Room Topic\n1 Monday 07-Sep 10:15 - 12:45 N39 Intro + Python\nrecap\n2 Friday 11-Sep 10:15 - 12:45 N39 Pandas\nDataFrames\n3 Monday 14-Sep 10:15 - 12:45 N39 Pandas:\nsubset, add,\nremove data\n4 Monday 21-Sep 10:15 - 12:45 N39 Pandas:\ncleaning data,\nmissing\n5 Friday 25-Sep 10:15 - 11:45 N39 Pandas:\ngrouping data\n6 Monday 28-Sep 10:15 - 12:45 N39 Pandas:\nmerging data\n7 Friday 02-Oct 10:15 - 12:45 N39 Pandas:\nworking with\ntext\n8 Monday 05-Oct 10:15 - 12:45 N39 Nature of\neconometric\ndata\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 2/9\n\n[Pagina 3]\nSYLLABUS 2026/2027\n9 Friday 09-Oct 10:15 - 12:45 N39 Descriptive\nAnalysis\n10 Monday 12-Oct 10:15 - 12:45 N39 Linear\nregression\nmodel (1)\n11 Friday 16-Oct 10:15 - 12:45 N39 Linear\nregression\nmodel (2)\n12 Friday 30-Oct 10:15 - 12:45 N39 Hypothesis\ntesting\n13 Monday 02-Nov 10:15 - 12:45 N39 Further\nspecification\nissues\n14 Friday 06-Nov 10:15 - 12:45 N39 Binary\ndependent\nvariables\n15 Monday 09-Nov 10:15 - 12:45 N39 Data lab* /\nGuest\nspeaker**\n16 Friday 13-Nov 10:15 - 12:45 N39 Data lab* /\nGuest\nspeaker**\n17 Monday 16-Nov 10:15 - 12:45 N39 Data lab* /\nGuest\nspeaker**\n18 Monday 23-Nov 10:15 - 12:45 N39 Data lab* /\nGuest\nspeaker**\n19 Friday 27-Nov 10:15 - 12:45 N39 Final\npresentations\n20 Monday 30-Nov 10:15 - 12:45 N39 Final\npresentations\n21 Friday 04-Dec 10:15 - 12:45 N39 Final\npresentations\nClass group 28 — INTENT — Breschi S. / Gagliardi L. — 13:45-16:15, Sraffa 13 (3rd floor)\n# Day Date Time Room Topic\n1 Monday 07-Sep 13:45 - 16:15 N39 Intro + Python\nrecap\n2 Friday 11-Sep 13:45 - 16:15 N37 Pandas\nDataFrames\n3 Monday 14-Sep 13:45 - 16:15 N39 Pandas:\nsubset, add,\nremove data\n4 Friday 18-Sep 13:45 - 16:15 N37 Pandas:\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 3/9\n\n[Pagina 4]\nSYLLABUS 2026/2027\ncleaning data,\nmissing\n5 Monday 21-Sep 13:45 - 16:15 N39 Pandas:\ngrouping data\n6 Monday 28-Sep 13:45 - 16:15 N39 Pandas:\nmerging data\n7 Friday 02-Oct 13:45 - 16:15 N37 Pandas:\nworking with\ntext\n8 Monday 05-Oct 13:45 - 16:15 N39 Nature of\neconometric\ndata\n9 Friday 09-Oct 13:45 - 16:15 N37 Descriptive\nAnalysis\n10 Monday 12-Oct 13:45 - 16:15 N39 Linear\nregression\nmodel (1)\n11 Friday 16-Oct 13:45 - 16:15 N37 Linear\nregression\nmodel (2)\n12 Friday 30-Oct 13:45 - 16:15 N37 Hypothesis\ntesting\n13 Monday 02-Nov 13:45 - 16:15 N39 Further\nspecification\nissues\n14 Friday 06-Nov 13:45 - 16:15 N37 Binary\ndependent\nvariables\n15 Monday 09-Nov 13:45 - 16:15 N39 Data lab* /\nGuest\nspeaker**\n16 Friday 13-Nov 13:45 - 16:15 N37 Data lab* /\nGuest\nspeaker**\n17 Monday 16-Nov 13:45 - 16:15 N12 Data lab* /\nGuest\nspeaker**\n18 Monday 23-Nov 13:45 - 16:15 N39 Data lab* /\nGuest\nspeaker**\n19 Friday 27-Nov 13:45 - 16:15 N37 Final\npresentations\n20 Monday 30-Nov 13:45 - 16:15 N39 Final\npresentations\n21 Friday 04-Dec 13:45 - 16:15 N37 Final\npresentations\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 4/9\n\n[Pagina 5]\nSYLLABUS 2026/2027\nTEACHING METHODS\nSelection:\nLectures\nLectures\nGuest speaker's talks (in class or in distance)\nPractical Exercises\nSoftware-Based Exercises\nIn-class exercises\nData Analysis, Graphic Representations/Calculators\nIndividual works / Assignments\nProject Work\nProject Presentation\nCollaborative Works / Assignments\nReport/essay\nProject work\nProject Presentation\nThe course adopts a hands-on, bootcamp-style approach that combines lectures, coding\nsessions, and applied econometric analysis. Almost every session integrates the explanation of\nconcepts with their direct implementation on real-world data.\nLectures and conceptual Inputs: Introduction to Python for data wrangling and\nvisualization, and to econometric methods (using Stata) for regression analysis and\nhypothesis testing.\nPractical, software-based exercises: In-class coding labs where students learn to\nimport, clean, structure, and analyze data using Python and econometric software.\nGuest speaker seminars: Industry practitioners present applications of data to startup\nfinance, venture capital, and market analysis.\nCollaborative project work: Students work in teams to develop an empirical project\nbased on Pitchbook data (US startups, 2012–2019). Teams identify a research question,\nconstruct a dataset, apply econometric methods, and present results at the end of the\ncourse.\nTeam support and feedback: Dedicated sessions with the teaching assistant to guide\nteams on dataset construction, model selection, and interpretation of results.\nProblem-solving and self-assessment: Instructor-led exercises, mock exams, and\nquizzes to reinforce core techniques and ensure continuous learning.\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 5/9\n\n[Pagina 6]\nSYLLABUS 2026/2027\nThis blended approach ensures that students acquire both the technical skills (Python\nprogramming, econometric modeling) and the applied research experience needed to turn\ncomplex data into actionable business insights.\nASSESSMENT METHODS\nSelected methods: Continuous\nassessment\nPartial exams General exam\nWritten individual\nexam\n(traditional/online)\nx\nOpen and/or closed\nanswers questions\nexam\nx\nCollaborative Works /\nAssignment (report,\nexercise, presentation,\nproject work etc.)\nx\nAssessment of the\nresults\nachieved/outcome\nx\nAttending students\nWritten Exam (60% of final grade): Duration 1.5 hour. Includes both open and\nclosed questions, as well as multiple-choice items. The exam evaluates\nstudents’ understanding of econometric methods, ability to interpret results, and\ncapacity to apply them to business problems.\nGroup Project (40% of final grade): Teams of up to 5 students develop an\nempirical project using Pitchbook data (U.S. startups, 2012–2019). Projects must\nidentify a research question, build and analyze the relevant dataset, and present\nfindings in a slide deck (about 25 minutes). All group members receive the same\ngrade. To be considered “attending,” students must participate in a group and\ndeliver a final presentation. The project grade remains valid for all exam sessions\nin the academic year.\nNon-attending students\nWritten Exam only (100% of final grade): Duration 2.5 hours. Includes open,\nclosed, and multiple-choice questions. Focuses on econometric techniques and\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 6/9\n\n[Pagina 7]\nSYLLABUS 2026/2027\ntheir application to real-world data, with no project component.\nOrganizational details\nGroup self-enrollment is managed via Blackboard.\nProject support sessions are organized with the teaching assistant to guide\nstudents on dataset construction, econometric methods, and interpretation of\nresults.\nMock exams will be distributed during the course to familiarize students with\nexam structure.\nThe written exam is administered on Blackboard with Respondus Lockdown\nBrowser.\nAssessment criteria\nWritten exam: accuracy of answers, clarity of reasoning, and ability to link\nmethods to applications.\nProject: originality and clarity of the research question, appropriateness of\nempirical methods, quality of data analysis, and effectiveness of the\npresentation.\nThe final grade is determined by the weighted average of the written exam and project for\nattending students, and by the written exam only for non-attending students.\nGENAI USE\nThe use of Generative Artificial Intelligence tools by students, solely as support during teaching\nactivities*, is:\nConsentito\nAllowed\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 7/9\n\n[Pagina 8]\nSYLLABUS 2026/2027\nTEACHING MATERIALS\n- INTENT cl. 27\nAttending and non-attending students\nPart I (Python and Data Analysis): Jupyter notebooks distributed in class.\n(Optional textbook) Stephanie Molin (2021). Hands-On Data Analysis with\nPandas. Packt Publishing Limited (chapters, 1-4).\nPart II (Econometrics): Lecture slides and a curated selection of research papers made\navailable in advance through Blackboard.\nHill, R. C., Griffiths, W. E., & Lim, G. C. (2018). Principles of Econometrics. John\nWiley & Sons (selected chapters).\nSharing and access\nAll teaching materials (slides, datasets, Jupyter notebooks, project instructions, and\nreadings) will be distributed via Blackboard.\nAuxiliary files for project work (data dictionary, ER diagram, etc.) are available in the\ndedicated Pitchbook folder on Blackboard.\nSelected bibliographic references are accessible through the Bocconi Library (Course\nReserve).\nHONOR CODE\nBocconi University conceives of education as an ongoing process that stretches across a\nperson’s entire professional life. The University hopes that the entire Bocconi community will\nrespect the values of fairness and correctness associated with it, values which inspire and guide\nthe conduct of all community members as they pursue common objectives and a shared\nmission. Bocconi University is also committed to building a truly inclusive climate based on\ndiversity. With the collaboration of faculty and students, it aims to ensure a safe learning\nenvironment free from any form of discrimination based on race, religion, gender, geography,\nage, disability or sexual orientation, in which there is room for a diversity of approaches and\nwhere discussions are always conducted in a respectful manner. The Bocconi University Honor\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 8/9\n\n[Pagina 9]\nSYLLABUS 2026/2027\nCode is published on the website at http://www.unibocconi.eu/honorcode, we encourage all\nstudents to read it.\nCOURSE ETIQUETTE\nAI Policy\nIn this course you are strongly encouraged to use AI, but always with a clear purpose. Think of\nAI as an extra team member you can question and challenge: use it to test your ideas, explore\ndifferent perspectives, and refine your reasoning. You may find it helpful both when preparing\nyour project and when studying the course material more broadly. In both situations, the goal is\nnot to let AI provide ready-made answers, but to use it as a tool to deepen your understanding\nand strengthen your ability to explain and defend your own reasoning. This will also prepare you\nfor the final exam, which you will complete without access to AI. Whenever you use AI in\npreparing your work, you must include a short note in your document to acknowledge how it\nwas used.\nAggiornato al 24/08/2026 11:35\nPowered by TCPDF (www.tcpdf.org)\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 9/9"}]}, {"id": "ip-law", "name": "Intellectual Property Law for Business", "short": "IP Law", "code": "21070", "color": "#db2777", "professors": "Manderieux · Wennersten · Sekhon", "scope": "Programma completo (nessun parziale). Letture: WIPO Intellectual Property Handbook (capitoli/pagine indicati per lezione). Bonus: certificato EUIPO +1,5, EPO +3 (max 3), scadenza inizio dicembre.", "exam": {"date": "", "label": "Esame scritto (sessione gennaio/febbraio — data da confermare)", "format": "Esame scritto, corretto da 4 correttori; stessa difficoltà a ogni appello."}, "assessment": ["Esame scritto", "Partecipazione attiva", "Bonus certificati EUIPO/EPO (max +3)"], "topics": [{"n": 1, "date": "2026-09-07", "title": "L1 Course introduction: strategic role of IP, WIPO, Paris Convention, TRIPS", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 2, "date": "2026-09-10", "title": "L2 The multifaceted nature of copyright (Berne, WCT, Rome)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 3, "date": "2026-09-11", "title": "L3 Copyright on the Internet: communication to the public, platform liability (DSM art. 17)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 4, "date": "2026-09-15", "title": "L4 Copyright enforcement and remedies; industrial design", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 5, "date": "2026-09-15", "title": "L5 AI and copyright: authorship, training, TDM exceptions", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 6, "date": "2026-09-16", "title": "L6 Industrial design & licensing as a business tool", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 7, "date": "2026-09-17", "title": "L7 Copyright, design, sustainability and new business models", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 8, "date": "2026-09-24", "title": "L8 Trademarks as an innovation tool", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 9, "date": "2026-10-08", "title": "L9 Trademarks I: requirements, distinctiveness, registration routes", "lectures": ["2026-10-08-trademarks-1.md"], "kind": "lesson", "status": "active"}, {"n": 10, "date": "2026-10-09", "title": "L10 Trademarks II: EUTM, Madrid, GIs, classifications (guest: Boss case)", "lectures": ["2026-10-09-guest-boss-case.md"], "kind": "lesson", "status": "active"}, {"n": 11, "date": "2026-10-29", "title": "L11 Patents I: laws, treaties, patentability requirements", "lectures": ["2026- "6 mesi", "12 mesi", "18 mesi", "30 mesi"], "answer": [0], "explain": "Per i brevetti invece è 12 mesi."}, {"type": "mc", "q": "Cos'è il 'central attack' nel sistema di Madrid?", "options": ["Un attacco hacker all'OMPI", "Se il marchio di base nel paese d'origine cade entro i primi 5 anni, cade l'intera registrazione internazionale", "L'opposizione all'EUIPO", "La nullità di un marchio UE"], "answer": [1], "explain": "Madrid: una domanda per ~100 paesi in inglese, francese o spagnolo."}, {"type": "mc", "q": "Quali sono requisiti per la registrazione di un marchio?", "options": ["Distintività", "Novità nella classe", "Non ingannevolezza e non descrittività", "Conformità all'ordine pubblico e al buon costume"], "answer": [0, 1, 2, 3], "explain": "Tutti requisiti sostanziali; i marchi descrittivi rischiano anche la volgarizzazione (genericide, es. Frigidaire)."}, {"type": "open", "q": "Differenza tra marchio e brand. Perché un nome descrittivo è più facile da lanciare ma più debole nel lungo periodo? Usa l'esempio Omnitel/Wind o Orange.", "answer": "Un brand è un marchio con una reputazione: ogni brand poggia su un marchio, ma non ogni marchio è un brand. I nomi descrittivi comunicano subito il prodotto (facili da lanciare) ma hanno protezione debole e rischio di volgarizzazione; i marchi di fantasia/arbitrari (Wind, Orange) sono più distintivi e proteggibili, quindi vincono nel lungo periodo (France Telecom → Orange)."}], "2026-10-09-guest-boss-case.md": [{"type": "mc", "q": "Su quali piani si valuta la somiglianza tra segni nel giudizio di confondibilità?", "options": ["Visivo, fonetico, concettuale", "Solo grafico", "Solo il colore e il font", "Il prezzo dei prodotti"], "answer": [0], "explain": "Si confrontano anche prodotti/servizi e il rischio di confusione per il consumatore medio. Font e colori irrilevanti se c'è il marchio denominativo."}, {"type": "mc", "q": "Com'è finito il caso Hugo Boss vs 'Boss dei Panini'?", "options": ["Rigettato definitivamente", "Rigettato dall'esaminatore, ammesso in appello, la Cassazione ha annullato rinviando, e in rinvio il marchio è stato registrato", "Hugo Boss ha comprato il marchio", "Accordo di coesistenza"], "answer": [1], "explain": "Il consumatore lo legge come 'il re dei panini', non come il brand di moda. I giudici non favoriscono i grandi brand."}, {"type": "open", "q": "Quali rischi comporta un marchio patronimico (basato sul cognome del fondatore)?", "answer": "Reputazione legata al fondatore (es. passato di Hugo Boss come fornitore nel periodo nazista), omonimi che usano lo stesso cognome, e rischio di perdere il diritto di usare il proprio nome quando si vende l'azienda (casi EUIPO di stilisti, es. Jean-Charles de Castelbajac)."}], "2026-10-29-patents-1.md": [{"type": "mc", "q": "Quali sono i requisiti di brevettabilità?", "options": ["Materia brevettabile", "Applicazione industriale", "Novità", "Attività inventiva (non ovvietà)"], "answer": [0, 1, 2, 3], "explain": "La novità si valuta rispetto allo stato dell'arte."}, {"type": "mc", "q": "Quali NON sono brevettabili?", "options": ["Una scoperta (es. un fiore trovato in natura)", "Le regole di un gioco in quanto tali", "Un metodo di fabbricazione di chip", "Un dispositivo per motori meno inquinanti"], "answer": [0, 1], "explain": "Esclusi anche formule matematiche, metodi terapeutici, mere presentazioni di informazioni; in UE varietà animali e vegetali (le piante hanno la privativa varietale)."}, {"type": "mc", "q": "Quale svantaggio ha il segreto industriale rispetto al brevetto?", "options": ["Dura solo 20 anni", "Si perde se il prodotto viene decodificato (reverse engineering)", "Richiede la divulgazione", "Costa di più depositarlo in ogni paese"], "answer": [1], "explain": "Caso Vestas: competitor dell'Est asiatico hanno decifrato i segreti e Vestas è tornata ai brevetti. Il brevetto inverte l'onere della prova."}, {"type": "open", "q": "Il software è brevettabile? Spiega a quali condizioni e quali svantaggi ha per una startup.", "answer": "Sì, se ha applicazione industriale / effetto tecnico: in Europa si brevetta come apparato o metodo che combina software ed effetto tecnico (non il programma 'in quanto tale'); copre più del copyright, che protegge solo l'espressione del codice. Svantaggi: costi per startup e tempi (concessione media ~44 mesi, pubblicazione a 18 mesi): l'app può essere obsoleta prima della concessione."}], "2026-10-30a-patents-2-novelty-pct.md": [{"type": "mc", "q": "Un documento confidenziale viene inviato ai membri di un'associazione di categoria. La novità è distrutta?", "options": ["No, perché era confidenziale", "Sì: qualsiasi possibilità reale di divulgazione conta come divulgazione", "Solo se qualcuno l'ha letto", "Solo negli USA"], "answer": [1], "explain": "Anche documento in biblioteca riservata ai soci, black box sigillata, cablaggio nascosto: novità distrutta. La liceità dell'accesso è irrilevante."}, {"type": "mc", "q": "Nella procedura PCT, quando entra la fase nazionale/regionale?", "options": ["12 mesi", "18 mesi", "28 mesi", "30 mesi"], "answer": [3], "explain": "ISR a 16 mesi, pubblicazione a 18, IPRP a 28, fase nazionale a 30 (dalla data di priorità)."}, {"type": "mc", "q": "Sostituire un materiale leggero generico con l'alluminio implica attività inventiva?", "options": ["Sì, sempre", "No, è ovvio per il tecnico del ramo", "Sì, se l'alluminio è costoso", "Dipende dal paese"], "answer": [1], "explain": "Un'unione di macchine note è ovvia, salvo che interagiscano producendo un effetto inatteso (sinergia)."}, {"type": "mc", "q": "Quali affermazioni sul sistema EPO sono corrette?", "options": ["Copre oltre 40 paesi europei e non è un'istituzione UE", "Dopo la concessione il brevetto europeo classico diventa un fascio di brevetti nazionali da convalidare", "Le lingue ufficiali sono inglese, tedesco e francese", "Il brevetto concesso è automaticamente valido in tutto il mondo"], "answer": [0, 1, 2], "explain": "Esistono 4 sistemi regionali: EPO, Eurasiatico, ARIPO, OAPI."}, {"type": "open", "q": "Un founder deve presentare la sua invenzione a investitori prima di depositare. Cosa gli consigli e perché un NDA non basta?", "answer": "L'NDA vincola solo i firmatari: terzi in buona fede che ottengono l'informazione non sono vincolati e la novità è persa; inoltre chi agisce deve provare la violazione e i danni dipendono dal diritto nazionale. Consiglio: depositare prima (anche per avere la priorità di 12 mesi / poi PCT) oppure divulgare solo caratteristiche parziali (A e B, non A, B, C, D)."}], "2026-10-30b-guest-epo.md": [{"type": "mc", "q": "Entro quanto tempo dalla concessione si può fare opposizione a un brevetto europeo?", "options": ["3 mesi", "6 mesi", "9 mesi", "12 mesi"], "answer": [2], "explain": "Esiti: revoca, modifica o mantenimento; ogni parte può appellare."}, {"type": "mc", "q": "Qual è il rischio principale del brevetto unitario?", "options": ["Costa più del brevetto nazionale", "Una sola invalidazione davanti al UPC fa perdere la protezione in tutti gli stati partecipanti", "Non copre la Germania", "Va tradotto in 24 lingue"], "answer": [1], "explain": "Vantaggi: niente traduzioni/convalide per paese, una sola corte (UPC), sconto se ci si impegna a concedere licenze."}, {"type": "mc", "q": "Cosa serve perché un'invenzione implementata via computer (CII) sia brevettabile all'EPO?", "options": ["Che il codice sia originale", "Un effetto tecnico ulteriore rispetto al normale funzionamento del computer", "Che sia un metodo commerciale innovativo", "Niente, il software è sempre escluso"], "answer": [1], "explain": "Due hurdle + problem-solution approach. Nell'esercizio sullo sconto fedeltà: il metodo commerciale è escluso, il sistema/metodo implementato su computer supera il primo hurdle."}, {"type": "open", "q": "Differenza tra le esclusioni dell'art. 52 EPC e le eccezioni dell'art. 53 EPC, con esempi.", "answer": "Art. 52: non sono invenzioni (in quanto tali) scoperte, teorie scientifiche, metodi matematici, metodi commerciali, programmi per elaboratore 'as such', presentazioni di informazioni. Art. 53: invenzioni che sarebbero tali ma escluse per ragioni di policy: contrarie all'ordine pubblico/buon costume (es. mine antiuomo), varietà vegetali/animali, metodi di trattamento terapeutico/chirurgico/diagnostico."}]}, "lectures": {"2026-10-08-trademarks-1.md": {"file": "2026-10-08-trademarks-1.md", "title": "IP Law 08-10 — Trademarks I (requisiti, distintività, registrazione)", "date": "2026-10-08", "wispr": "https://notes.wisprflow.ai/shared/NDtdbGEU6dJGMO673ojD5Ij_-sniA735CeAs1QTz3os", "body": "Course logistics (attendance, optional EPO/EUIPO certificates for bonus points) and trademark fundamentals: requirements, distinctiveness exercises, and national, Madrid and EU registration routes.\n\n### Attendance and Participation\n- Follow class actively (notes, pre-reading, participating), not just hitting the 75-80% attendance benchmark\n    - Participation points require active participation, not mere presence; show a readable name card\n- Course paced slowly until intermediate exams, then accelerates\n\n### Optional Certificates and Exam\n- **EPO patent certificate gives 3 bonus points, EUIPO trademark one gives 1.5; maximum cashable is 3 total**\n- For EPO, the IP management track is preferred over the entry track; advanced is too sophisticated\n    - Last year 97% of registered students sat the EPO exam and 93% passed\n- Each exam is graded by four correctors; grades are never changed or bargained\n\n### Trademark Requirements\n- Principle of specificity: marks registered per Nice classification class, so 'Star' coexists across sauces, beer, Star Alliance\n    - Bocconi is registered in Class 41 (education)\n- Marks must be distinctive, novel within their class, not misleading, not descriptive, and respect public order and morality\n- Descriptive marks risk genericide: Frigidaire lost its US mark; Nestlé guards Nescafé, partly via Nestea and Nespresso\n- Confusion judged by the target consumer: Alpenroll cancelled after Toblerone survey; for engines the relevant public is professional buyers\n\n### Distinctiveness Exercises\n- Omnitel vs Wind: Wind more distinctive; descriptive names are easier to launch, but strong marks win long term\n    - France Telecom renamed to Orange for the same reason\n- Multi-sector client list: 'Best' rejected (Migros became Anna's Best); letter marks get narrow protection\n- **A brand is a mark with a reputation; every brand rests on a mark, but not all marks are brands**\n- Similarity criteria are conceptual, visual and phonetic; translations (e.g. into Chinese) create grabbing risks\n\n### Registration Routes\n- National route (UIBM via local Chamber of Commerce): mark valid 10 years, renewable indefinitely\n- Paris Convention 1883 gives a six-month priority window to file abroad country by country, costly in time and translations\n- Madrid system: one application for ~100 countries in English, French or Spanish; 673 Swiss francs plus fees per country\n    - **Central attack**: if the base mark in the origin country falls within the first five years, the whole international registration collapses\n- EUTM via EUIPO (Alicante) covers all 27 EU countries in one procedure"}, "2026-10-09-guest-boss-case.md": {"file": "2026-10-09-guest-boss-case.md", "title": "IP Law 09-10 — Guest speaker: Hugo Boss vs \"Boss dei Panini\" (marchi notori)", "date": "2026-10-09", "wispr": "https://notes.wisprflow.ai/shared/xsvIe1LXnVS6ALkIyValilo8TTkgQvRZObNcir5dyRc", "body": "Guest IP litigator walked the class through a well-known trademark case: Hugo Boss opposing a \"Boss dei Panini\" sandwich mark, which ultimately got registered.\n\n### Well-known trademarks and the Boss sign\n- Everyone in class instantly linked \"Boss\" to Hugo Boss, illustrating what a well-known trademark is\n- Practitioners watch two fronts: trademark office filings and actual market use of similar signs\n- Weak points of the mark: Boss is a common dictionary word (employer, also mafia boss in Italy) and a surname\n- Patronymic marks carry risks: founder reputation, shared surnames, and losing your name when selling the company\n    - EUIPO cases of designers who sold their names (e.g. Jean-Charles de Castelbajac)\n\n### Class exercise: Boss vs. Boss dei Panini\n- Application for \"Boss dei Panini\" (the boss of sandwiches) in class 43, where Hugo Boss is also registered\n- Comparison covers signs (visual, phonetic, conceptual), goods/services, and risk of confusion for the average consumer\n- Fonts and colors are irrelevant since Boss is also registered as a word mark\n- Key arguments: descriptive words like \"panini\" carry little weight; \"boss of X\" reads as a common Italian expression\n    - Well-known marks extend protection beyond registered classes, within plausible brand expansion\n\n### Case outcome\n- Examiner rejected the application; appeal reversed it, calling Boss a common, weakly protectable word\n- Supreme Court overturned: well-known and patronymic marks are not weakly distinctive; case sent back on consumer perception\n- On remand the sandwich mark was registered: consumers read it as \"king of sandwiches\", not the fashion brand\n- Lesson: register fights matter because infringers argue everyone uses the sign; big brands are not favored by judges\n\n### Other perspectives\n- At EUIPO, understanding of \"panini\" must be proven with dictionaries and publications\n- Hugo Boss actually runs Boss cafes selling sandwiches, which complicates the confusion argument\n- Companies weigh what really hurts them: blocking registrations matters more than stopping a food truck"}, "2026-10-29-patents-1.md": {"file": "2026-10-29-patents-1.md", "title": "IP Law 29-10 — Patents I (alternative, brevettabilità)", "date": "2026-10-29", "wispr": "https://notes.wisprflow.ai/shared/uxWuFoe2trBnhX1JzBsn5vyaNeM8-syiAgowdteSYhY", "body": "Introduction to patents versus alternatives and a patentable subject matter exercise.\n\n### Logistics and Exam Approach\n- **No midterm by design; goal is passing in January or February**\n- No Gaussian curve; exam difficulty is the same at every session\n- Certificate bonus: 1.5 points for the trademark certificate, up to 3 with the second; deadline early December\n\n### Patents vs Trade Secrets and Alternatives\n- Trade secret: potentially eternal, no disclosure, but lost if reverse engineered; protecting it still costs\n    - Vestas relied on trade secrets, competitors in East Asia cracked them, it moved back to patents\n- Patent drawbacks: disclosure, may be refused after publication, 20-year limit, costly filing in every country\n- Patented medicines need agency approval (3 to 13 years); defense inventions may be kept secret\n- Patent inverts burden of proof, giving more security; alternatives: utility models, design (aesthetic only), competition law, copyright\n\n### Patent Fundamentals and Software\n- A patent is a state-granted property title, a right to exclude others, limited by public interest\n- Software is patentable with industrial applicability / technical effect (US, somewhat in Europe); covers more than copyright's code expression\n- Software patent drawbacks: cost for startups, apps outdated before grant (average 44 months; publication at 18 months)\n- OECD plus China file 95% of applications and hold 99% of valid patents\n\n### Patentability Criteria and Exercise\n- Criteria: **patentable subject matter, industrial applicability, novelty, non-obviousness (inventive step)**\n- Excluded: discoveries, math formulas, games as such, therapeutic methods, human life; EU excludes animal and plant varieties\n    - Plants protected by plant variety rights (18 years); US allows cumulative protection\n- Not patentable: gear display (mere information), registration-date plate, discovered flower, game rules as such\n- Patentable: chip manufacturing method, less polluting engine device, microbiological antibiotic method; a mere juxtaposition without unpredictable effect is not\n    - Software is patented as an apparatus combining software with a technical effect"}, "2026-10-30a-patents-2-novelty-pct.md": {"file": "2026-10-30a-patents-2-novelty-pct.md", "title": "IP Law 30-10 — Patents II (novità, inventive step, EPO, PCT)", "date": "2026-10-30", "wispr": "https://notes.wisprflow.ai/shared/GlkmAE3YcsFJ9gcaP4ww-W7aCHmjWq_wqLvVFgPiE4A", "body": "Patentability criteria: class exercises on novelty and inventive step, then sufficient disclosure, national and regional patent systems (EPO), and the PCT procedure and timeline.\n\n### Novelty Exercises and NDAs\n- Novelty means the claimed combination of features exists in no single prior document or device anywhere.\n- Novelty destroyed in all cases: confidential document sent to trade association members, members-only library document, sealed black box, hidden cable assembly\n    - Any real possibility of disclosure counts as disclosure; legality of access is irrelevant\n- NDAs bind only signatories; good-faith third parties who obtain the info are not bound, so novelty is lost.\n    - Claimant must prove the breach; damages set by national law\n- Practical tip: disclose only partial features (e.g. A and B, not A, B, C, D) to investors or partners.\n\n### Inventive Step\n- Assessed by examiners (person skilled in the art), reviewable via opposition and board of appeal.\n- Aluminium instead of a generic lightweight material: no inventive step, obvious to a person of ordinary skill.\n- Hydraulic motor replacing electric motor: likely no, unless it overcomes a known technical prejudice.\n- Sausage machine joining two known machines: obvious unless they interact to produce an unexpected effect (synergy).\n    - Novelty is often clear-cut; inventive step is a human assessment in about 90% of cases\n\n### Disclosure and National/Regional Systems\n- Sufficient disclosure is a cat-and-mouse game: the state wants maximum disclosure, applicants want minimum.\n- A national patent is territorial and lasts 20 years from filing; **Paris Convention gives 12-month priority for patents** (6 months for trademarks).\n- EPO covers 40+ European countries (not an EU institution); unitary patent covers ~18 EU countries; languages: English, German, French.\n    - About €40,000 for eight countries kept valid for eight years\n    - After grant a classic EP becomes a bundle of national patents needing validation and translation\n- Four regional systems: EPO, Eurasian (Moscow), ARIPO (English-speaking Africa), OAPI (French-speaking Africa, most integrated).\n\n### PCT Procedure\n- PCT allows one application for 160+ countries within the 12-month priority; WIPO only facilitates, granting stays national or regional.\n- **Timeline: ISR (search) at 16 months, publication at 18, IPRP at 28, national/regional phase at 30.**\n    - Withdraw before 18 months to keep the invention secret\n    - Costs only about 1,465 Swiss francs up to the national phase\n- Slowness can be an advantage: applicants get 30 months to test market viability before major spending."}, "2026-10-30b-guest-epo.md": {"file": "2026-10-30b-guest-epo.md", "title": "IP Law 30-10 — Patents III / Guest ex-EPO (Unitary Patent, UPC, CII)", "date": "2026-10-30", "wispr": "https://notes.wisprflow.ai/shared/Y0WMpvM_F28hkGr81jMaeAjiyb9UNaHyTrdPAQqYPOU", "body": "Guest lecture by a former EPO official on the European patent system, the unitary patent and UPC, and patentability of computer-implemented and AI inventions.\n\n### EPO Overview and Figures\n- EPO started in 1973 (EPC); now 40 member states plus extension/validation states, covering a market of 750 million people\n    - Structure: Administrative Council, the Office (executive), and independent Boards of Appeal\n- About 6,000 employees and 4,000 examiners; self-financing, not funded by the EU\n- About 200,000 applications: 42-43% from member states, US 23%, China 10% and growing\n    - Top fields: computer and digital tech; biotech rising\n\n### Grant Procedure\n- Steps: filing, formalities check, search plus European search opinion, publication at about 18 months\n- Third parties can file observations (Article 115) but are not parties to examination\n- Substantive examination ends in grant, refusal or withdrawal; **grant opens a 9-month opposition window**\n    - Opposition outcomes: revocation, amendment, or maintained as is; any party can appeal\n\n### Unitary Patent and UPC\n- Introduced in 2023 to avoid per-country translations, litigation and renewal fees after validation\n- Unified Patent Court gives one ruling for all participating states, harmonizing outcomes\n    - 18 states ratified; Spain, Croatia and Poland have not signed\n- Discount for committing to license (license of right); main risk is losing protection everywhere in one invalidation (central revocation)\n- Around 30% of European patents converted to unitary in recent years\n\n### Computer-Implemented and AI Inventions\n- Article 52 EPC exclusions (e.g. programs \"as such\") differ from Article 53 exceptions (morality/ordre public, therapy methods)\n- CII needs a technical effect beyond normal computer operation; assessed with two hurdles plus problem-solution approach\n- Loyalty-discount exercise: business method excluded; computer system and computer-implemented method pass first hurdle\n- AI complications: inventorship, AI Act, GDPR; **only CII basics are relevant for the exam**"}}, "materials": [{"file": "syllabus-ip-law.pdf", "kind": "reading", "topic": null, "size": 49395, "chars": 14171, "uploadedAt": "2026-11-04T18:17:27.129Z", "text": "[Pagina 1]\nSYLLABUS 2026/2027\n21070 INTELLECTUAL PROPERTY LAW FOR BUSINESS\nClasse impartita in lingua inglese\nPrograms: INTENT (6 crediti - I sem. - OB | 6 cfu - GIUR-02/A)\nClass: 27 (I sem.)\nDepartment: Law\nCourse director: LAURENT MANDERIEUX\nClasse 27\nRUBEN CANO PEREZ\nDepartment of Law\nUniversità Bocconi, Milan, Italy\nruben.canoperez@unibocconi.it\nLAURENT MANDERIEUX\nDepartment of Law\nUniversità Bocconi, Milan, Italy\nlaurent.manderieux@unibocconi.it\nANDREA VALDO MOCCHI\nDepartment of Law\nUniversità Bocconi, Milan, Italy\nandrea.mocchi2@unibocconi.it\nJOE SEKHON\nDepartment of Law\nUniversità Bocconi, Milan, Italy\njoe.sekhon@unibocconi.it\nULRIKA INGA GUNILLA WENNERSTEN\nDepartment of Law\nUniversità Bocconi, Milan, Italy\nulrika.wennersten@unibocconi.it\nAttenzione! Il programma di seguito riportato è da considerarsi valido SOLO per l'anno accademico 2026/2027.\nMISSION\nThe Intellectual Property Law for Business Course aims at providing students with knowledge\nand legal tools to use and exploit innovation and technology as relevant assets for businesses\nin largely internationalized markets. In this sense, the course aims at helping students\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 1/13\n\n[Pagina 2]\nSYLLABUS 2026/2027\nproceeding further in the study of other courses of the Program studied at Bocconi University\nwith a solid background in IP Techniques, something needed to deal with innovation-related\neconomics and management issues.\nCOURSE CONTENT DETAILED - SCHEDULE\n- INTENT cl. 27\n21070 - INTELLECTUAL PROPERTY LAW FOR BUSINESS\nCLASS 27\nCourse Director: Laurent Manderieux\nCourse Instructors: Laurent Manderieux, Ulrika Wennersten, Joe Sekhon\nDate Lesson n° and Program\nSummary\nReadings for attending\nstudents\n07/09/2026\n18:15 – 19:45\n(Manderieux)\nL. 1: Course introduction\nLecture focus\n-Introduction:\no working methods\no the strategic role of IP for\nbussiness\nChapter 1: The Concept of IP,\np. 3-4\nThe World Intellectual\nProperty Organization p. 4-8\nChapter 3: The promotion of\nInnovation, p. 168-171\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 2/13\n\n[Pagina 3]\nSYLLABUS 2026/2027\n+ Research debate 1: purpose\nand method of IP Law\nChapter 5: Paris Convention p.\n241-249\nThe TRIPS Agreement p.\n345-347 (until “General\nPr ag. 8/13\n\n[Pagina 9]\nSYLLABUS 2026/2027\n+ Research debate 5: the law\nand economics of trademarks:\ndo trademarks work?\nTrademarks as an asset for\ninnovative businesses: EUIPO\nat the heart of the international\ntrademark system\n09/10/2026\n14.45 – 16.15\n(Manderieux)\nL. 10: Trademarks II\nLecture focus:\n- Protecting innovative\nproducts in Europe and in the\nworld: the EU Trade Mark and\nthe International Trademark\n(the Alicante and Madrid\nSystems): role and rules of\nregistration systems\nGuest Speaker: Avv. Agata\nSobol Lexsential (30 min\nintro)\n- Trademarks v. geographical\nindications, treaties and\nclassifications\nChapter 2: Geographical\nIndications p. 120-130\nChapter 5: The Madrid\nAgreement p. 287-292\nTreaties on Classification p.\n308-313 (until “The Locarno\nAgreement (…)”)\nFurther materials will be\ndistributed / studied in class\nIII. International systems for the protection of inventions in Europe and in the world\n29/10/2026\n14.45 – 16.15\n(Manderieux)\nL. 11: Patents I\nLecture focus:\n- patents: existing laws,\ntreaties and systems; their\nstrengths and weaknesses\nand their legal and economic\neffects\n- key principles of TM law\n- patent registration substative\nChapter 2: Patents p. 17-34\n(until “Compulsory Licenses”)\nPatent Law Treaty p. 301 -305\nThe TRIPS Agreement p.\n352-354 (“Patents (Section\n5)”)\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 9/13\n\n[Pagina 10]\nSYLLABUS 2026/2027\nrequirements\n+ Research debate 6: IP Law:\nEconomics vs. social\nperception\n30/10/2026\n14.45 – 16.15\n(Manderieux)\nL. 12: Patents II\nLecture focus:\n- introduction on registration\nsystems\n- Patenting abroad:\no the rules of PCT system\n+ Practical exercises on\npatents\nRecent reforms in U.S. patent\nlaw and their international\nimpact\n+ the US Bayh Dole Act\nArticle “A brave new patent\nworld – first to file becomes\nlaw”, Gene Quinn, from\nIPWatchdog, 16 March 2013 –\n(\nhttps://ipwatchdog.com/2013/0\n3/16/a-brave-new-patent-world\n-first-to-file-becomes-law/id=37\n601/#:~:text=President%20Ob\nama%20signs%20the%20AIA,\nObama%20on%20September\n%2016%2C%202011)\nChapter 5: Patent Cooperation\nTreaty p. 276-285 (until\n“Budapest Treaty (…)”)\nFurther materials will be\ndistributed / studied in class\n30/10/2026\n16:30 - 18:00\n(Manderieux)\nL. 13: Patents III\nLecture focus:\n- patenting abroad:\no the European patent\nsystem;\no introduction to the Eurasian\nsystem and the two African\nChapter 6: The Patent Office\np. 369-372, Intergovernmental\nCooperation p. 376-381\nChapter 7: Protection of\nComputer Programs under\nPatents p. 436.\nFurther materials will be\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 10/13\n\n[Pagina 11]\nSYLLABUS 2026/2027\nsystems (ARIPO and\nOAPI);\no patents in China;\n- the protection of computer\nimplemented inventions:\nEurope vs. the world\nGuest Speaker from the\nEuropean Patent Office (30\nmin)\n+ Practical exercises on\npatents\ndistributed / studied in class\n05/11/2026\n14.45 -16.15\n(Manderieux)\nL. 14: The circulation of\nIntellectual Property Rights\n(IPRs) I\nLecture focus:\n- introduction on technology\ntransfer and IPRs as assets\n- licensing\no key principles of licensing\no voluntary licensing vs.\ncompulsory licensing;\n+ Research debate 7: what\ntype of licensing would you\nchoose for your business?\n+ Research debate 8: What is\nthe best patent protection\nstrategy: national, regional or\ninternational?\n+ Research debate 9: Patents\nChapter 3: Licensing and the\nTransfer of Technology p.\n172-178 (until “Negotiation of\nLicensing Agreements”),\n188-193 (from “Types of\nIntellectual Property\nLicenses”), Licensing and the\nTransfer of Technology p.\n178-188 (“Negotiation of\nLicensing Agreements”)\nFurther materials will be\ndistributed / studied in class.\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 11/13\n\n[Pagina 12]\nSYLLABUS 2026/2027\nand data\n06/1 <script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const COURSES = DATA.courses; // ordered list
const byId = Object.fromEntries(COURSES.map((c) => [c.id, c]));
const KIND = { slides: "Slide", notes: "Student notes", case: "Caso", reading: "Lettura", exercises: "Esercizi", other: "Altro" };
const TODAY = new Date().toISOString().slice(0, 10);

// ---------- helpers ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function inline(t) {
  return t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>").replace(/(^|\W)_([^_\n]+)_(?=\W|$)/g, "$1<i>$2</i>");
}
// Piccolo renderer Markdown (titoli, elenchi annidati, grassetto, corsivo, codice) usato se la libreria non è disponibile.
function miniMd(src) {
  const lines = esc(src).split("\n"); let html = "", depth = [], para = [];
  const flushP = () => { if (para.length) { html += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  const closeTo = (n) => { while (depth.length > n) { html += `</li></${depth.pop()}>`; } };
  for (const raw of lines) {
    const h = raw.match(/^(#{1,6})\s+(.*)$/);
    const li = raw.match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
    if (h) { flushP(); closeTo(0); const lv = Math.min(6, h[1].length + 1); html += `<h${lv}>${inline(h[2])}</h${lv}>`; }
    else if (li) {
      flushP();
      const ind = li[1].replace(/\t/g, "    ").length, lvl = ind === 0 ? 1 : Math.max(2, Math.floor(ind / 4) + 1), tag = /\d/.test(li[2]) ? "ol" : "ul";
      if (lvl > depth.length) { while (depth.length < lvl) { html += `<${tag}><li>`; depth.push(tag); } }
      else { closeTo(lvl); html += `</li><li>`; }
      html += inline(li[3]);
    } else if (!raw.trim()) { flushP(); closeTo(0); }
    else if (depth.length) html += " " + inline(raw.trim());
    else para.push(raw.trim());
  }
  flushP(); closeTo(0);
  return html;
}
function md(s) {
  if (window.marked) {
    try { return marked.parse(esc(s).replace(/&gt;/g, ">")); } catch {}
  }
  return miniMd(s || "");
}
function daysUntil(d) {
  if (!d) return null;
  return Math.round((new Date(d + "T00:00:00") - new Date(TODAY + "T00:00:00")) / 86400000);
}
const fmtDate = (d) => (d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "long" }) : "");
const lstore = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- persistent state (db per utente, altrimenti questo browser) ----------
let STATE = { courses: {}, generated: {} };
let storage = "local";
let progressRef = null, genRef = null;
let writing = Promise.resolve();
function cstate(id) {
  const c = (STATE.courses[id] ??= {});
  c.lectures ??= {}; c.topics ??= {};
  return c;
}
function saveProgress() {
  const body = { courses: STATE.courses };
  if (progressRef) writing = writing.then(() => progressRef.set(body)).catch(() => lstore.set("agenda:progress", body));
  else lstore.set("agenda:progress", body);
}
function saveGenerated() {
  const body = { generated: STATE.generated };
  if (genRef) writing = writing.then(() => genRef.set(body)).catch(() => lstore.set("agenda:generated", body));
  else lstore.set("agenda:generated", body);
}
async function initStorage() {
  STATE.courses = lstore.get("agenda:progress", {}).courses || {};
  STATE.generated = lstore.get("agenda:generated", {}).generated || {};
  if (!window.claude) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    progressRef = db.doc("data/users/" + uid + "/progress");
    genRef = db.doc("data/users/" + uid + "/generated");
    const [p, g] = await Promise.all([progressRef.get(), genRef.get()]);
    if (p.exists) STATE.courses = structuredClone(p.data().courses || {});
    else if (Object.keys(STATE.courses).length) saveProgress();
    if (g.exists) STATE.generated = structuredClone(g.data().generated || {});
    storage = "account";
  } catch {
    progressRef = genRef = null;
  }
}

// ---------- progress ----------
function quizFor(c, file) {
  return [...(c.quiz[file] || []), ...((STATE.generated[c.id] || {})[file] || []).map((q) => ({ ...q, generated: true }))];
}
function lectureScore(c, file) {
  const p = cstate(c.id).lectures[file];
  if (!p) return 0;
  const s = p.studied ? 1 : 0;
  return quizFor(c, file).length ? 0.3 * s + 0.7 * (p.bestScore || 0) : s;
}
const counts = (t) => t.status !== "done" && (t.kind === "lesson" || t.kind === "guest");
function topicScore(c, t) {
  if (t.lectures.length) return t.lectures.reduce((s, f) => s + lectureScore(c, f), 0) / t.lectures.length;
  return cstate(c.id).topics[t.n]?.studied ? 1 : 0;
}
function courseStats(c) {
  const ts = c.topics.filter(counts);
  const pct = ts.length ? Math.round((100 * ts.reduce((s, t) => s + topicScore(c, t), 0)) / ts.length) : 0;
  return {
    pct,
    total: ts.length,
    held: ts.filter((t) => t.date && t.date <= TODAY).length,
    recorded: ts.filter((t) => t.lectures.length).length,
    missing: ts.filter((t) => t.date && t.date <= TODAY && !t.lectures.length && !c.materials.some((m) => m.topic === t.n)).length,
    examDate: cstate(c.id).examDate ?? c.exam.date ?? "",
  };
}
function examChip(date) {
  const d = daysUntil(date);
  if (d === null) return `<span class="chip">data esame da definire</span>`;
  if (d < 0) return `<span class="chip">esame passato</span>`;
  return `<span class="chip ${d <= 21 ? "warn" : ""}">esame tra <span class="num">${d}</span> giorni · ${fmtDate(date)}</span>`;
}

// ---------- AI ----------
let SAMPLE = null;
let aiState = "attesa";
async function initAI() {
  if (!window.claude) { aiState = "assente"; return; }
  try { SAMPLE = await claude.use("sample"); } catch { SAMPLE = null; }
  aiState = SAMPLE ? "pronto" : "assente";
}
function aiErr(e) {
  const code = e?.code;
  if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled") { SAMPLE = null; aiState = "negato"; return "Il tutor non ha il permesso di usare Claude in questa pagina. Puoi riattivarlo dal menu Permessi dell'artifact."; }
  if (code === "rate_limited") return "Troppe richieste ravvicinate o limite d'uso raggiunto. Riprova tra poco.";
  if (code === "prompt_too_large") return "Il contesto è troppo lungo per questa richiesta. Prova da una lezione specifica.";
  if (code === "refused") return "Claude ha rifiutato questa richiesta: prova a riformularla.";
  if (code === "cancelled") return "";
  return "Errore temporaneo nel contattare Claude. Riprova.";
}
function courseContext(c, file) {
  const focus = file ? c.topics.find((t) => t.lectures.includes(file)) : null;
  const syl = c.topics.map((t) => `${t.n}. [${t.date || "n.d."}] ${t.title}${t.status === "done" ? " (GIÀ SUPERATO, fuori esame)" : ""}${t.kind !== "lesson" ? ` (${t.kind})` : ""}`).join("\n");
  const lectures = Object.values(c.lectures).map((l) => `<lezione file="${l.file}" titolo="${l.title}" data="${l.date}">\n${l.body}\n</lezione>`).join("\n\n");
  let budget = 150000 - lectures.length;
  const mats = [...c.materials].sort((a, b) => (b.topic === focus?.n) - (a.topic === focus?.n)).filter((m) => {
    if (!m.text || m.text.length > budget) return false;
    budget -= m.text.length; return true;
  }).map((m) => `<materiale file="${m.file}" tipo="${m.kind}" argomento="${m.topic ?? "generale"}">\n${m.text}\n</materiale>`).join("\n\n");
  return `Materia: ${c.name} (${c.code}) — docenti: ${c.professors}
Ambito: ${c.scope}
Esame: ${c.exam.label} — ${c.exam.format}
Valutazione: ${(c.assessment || []).join("; ")}

<syllabus>
${syl}
</syllabus>

<appunti_lezioni fonte="riassunti delle registrazioni Wispr Flow">
${lectures}
</appunti_lezioni>

<materiali_docenti>
${mats || "(nessuno)"}
</materiali_docenti>`;
}
const TUTOR = `Sei il tutor personale di Francesco, studente del master INTENT/EMIT in Bocconi che prepara gli esami.
Rispondi in italiano, mantenendo in inglese i termini tecnici del corso (lezioni ed esame sono in inglese).
Basati prima di tutto sugli appunti e sui materiali qui sotto e indica la fonte (es. "lezione del 29-10", "syllabus"). Se aggiungi conoscenze generali non presenti nel materiale, dillo esplicitamente, così Francesco sa cosa è "da esame".
Le note Wispr sono riassunti automatici: possono contenere nomi trascritti male; se noti incongruenze segnalale.
Spiega con ordine: intuizione, definizione precisa, esempio (meglio dai casi del corso). Per gli esercizi numerici mostra tutti i passaggi. Se sbaglia, correggilo con chiarezza. Quando è utile chiudi con una breve domanda di verifica.`;

function go(course, tab = "appunti", lecture = null) {
  Object.assign(UI, { course, tab, lecture, quizOnlyWrong: false });

  render();

}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (byId[h] && h !== UI.course) go(h); else if (!h && UI.course) go(null); });

function tips() {
  const out = [];
  const stats = COURSES.map((c) => ({ c, st: courseStats(c) }));
  const up = stats.filter((x) => x.st.examDate && daysUntil(x.st.examDate) >= 0).sort((a, b) => daysUntil(a.st.examDate) - daysUntil(b.st.examDate));
  if (up[0]) {
    const { c, st } = up[0]; const d = daysUntil(st.examDate);
    out.push(`<b>${esc(c.short)}</b> è il prossimo esame (tra ${d} giorni): manca il ${100 - st.pct}% del programma, circa ${(Math.max(0, 100 - st.pct) / Math.max(1, d)).toFixed(1)}% al giorno.`);
  }
  const todo = [];
  for (const { c } of stats) for (const t of c.topics) if (counts(t)) for (const f of t.lectures) if (!cstate(c.id).lectures[f]?.studied) todo.push({ c, f });
  const prio = (c) => { const d = daysUntil(courseStats(c).examDate); return d === null || d < 0 ? 9999 : d; };
  todo.sort((a, b) => prio(a.c) - prio(b.c) || a.f.localeCompare(b.f));
  if (todo.length) out.push(`Hai <b>${todo.length}</b> lezioni registrate ancora da segnare come studiate. Inizia da: ${todo.slice(0, 3).map(({ c, f }) => `<button class="linkbtn" data-go="${c.id}|${f}">${esc(c.short)} · ${esc(c.lectures[f].title.replace(/^.*? — /, ""))}</button>`).join(", ")}.`);
  const nodate = stats.filter((x) => !x.st.examDate).map((x) => x.c.short);
  if (nodate.length) out.push(`Imposta la data d'esame di ${nodate.map(esc).join(", ")} nella scheda Programma, così il ritmo giornaliero diventa preciso.`);
  const miss = stats.filter((x) => x.st.missing).map((x) => `${esc(x.c.short)} (${x.st.missing})`);
  if (miss.length) out.push(`Argomenti già fatti in aula senza registrazione né materiali: ${miss.join(", ")}. Manda slide e student notes a Claude in chat per completarli.`);
  out.push("Metodo: leggi gli appunti, fai gli esercizi senza guardare, chiedi al tutor solo gli errori, poi ripeti le domande sbagliate dopo 2-3 giorni.");
  setTimeout(() => app.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => { const [cid, f] = b.dataset.go.split("|"); go(cid, "appunti", f); })));
  return out.map((t) => `<li>${t}</li>`).join("");
}

function indexPanel(c, active, allLabel) {
  const item = (f) => {
    const l = c.lectures[f], p = cstate(c.id).lectures[f] || {};
    return `<button class="item" data-lec="${f}" aria-current="${f === active}">${p.studied ? '<span class="tick">✓</span> ' : ""}${esc(l.title.replace(/^.*? — /, ""))}${p.bestScore != null ? ` <span class="muted small num">${Math.round(p.bestScore * 100)}%</span>` : ""}</button>`;
  };
  const grp = (t) => `<div class="grp label">${t.n ? t.n + ". " : ""}${esc(t.title)}</div>${t.lectures.map(item).join("")}`;
  const withL = c.topics.filter((t) => t.lectures.length);
  const live = withL.filter((t) => t.status !== "done"), done = withL.filter((t) => t.status === "done");
  return `<nav class="panel index">
    ${allLabel ? `<button class="item" data-lec="" aria-current="${!active}">${allLabel}</button>` : ""}
    ${live.map(grp).join("")}
    ${done.length ? `<details ${done.some((t) => t.lectures.includes(active)) ? "open" : ""}><summary class="label">Parziale già superato</summary>${done.map(grp).join("")}</details>` : ""}
  </nav>`;
}

function tutorPanel(c, f) {
  return `<aside class="panel tutor">
