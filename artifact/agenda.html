<style>
/* Layout: an exam ledger — subject rows up top, then a three-column study desk (lecture index · notes · tutor). */
:root {
  --paper: #f5f6f8;
  --sheet: #ffffff;
  --sheet-2: #eef0f4;
  --ink: #161a22;
  --ink-2: #5a6272;
  --rule: #dfe2e8;
  --accent: #2f4fd8;
  --good: #0f8a5f;
  --warn: #b86a00;
  --bad: #c2362f;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1218; --sheet: #171b23; --sheet-2: #20252f; --ink: #e8ebf1; --ink-2: #9aa3b4;
    --rule: #2b313d; --accent: #8ea2ff; --good: #3fc792; --warn: #e9a23b; --bad: #f07a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1218; --sheet: #171b23; --sheet-2: #20252f; --ink: #e8ebf1; --ink-2: #9aa3b4;
  --rule: #2b313d; --accent: #8ea2ff; --good: #3fc792; --warn: #e9a23b; --bad: #f07a72; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1440px; margin: 0 auto; padding-block: 20px 56px; display: grid; gap: 20px; }
a { color: var(--accent); }
button, .btn {
  font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 9px; padding: 7px 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
button:hover, .btn:hover { border-color: var(--accent); }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
button:disabled { opacity: .5; cursor: default; }
textarea, input, select { font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 9px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--sheet-2); color: var(--ink-2); white-space: nowrap; }
.chip.warn { color: var(--warn); } .chip.good { color: var(--good); } .chip.bad { color: var(--bad); }

/* Top */
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 28px; }
.top h1 button { all: unset; cursor: pointer; }
.status { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; }

/* Subject ledger */
.ledger { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.subj {
  display: grid; grid-template-columns: 6px minmax(0, 1.6fr) minmax(140px, 1fr) 110px minmax(0, 1.1fr); gap: 18px; align-items: center;
  padding: 16px 18px 16px 0; border-bottom: 1px solid var(--rule); cursor: pointer; background: none; width: 100%; text-align: left; border-radius: 0; border-left: 0; border-right: 0; border-top: 0;
}
.subj:last-child { border-bottom: 0; }
.subj:hover { background: var(--sheet-2); }
.subj .stripe { align-self: stretch; background: var(--c); border-radius: 0 3px 3px 0; }
.subj .name { min-width: 0; }
.subj .name { display: grid; }
.subj .name b { font-family: var(--font-display); font-size: 18px; display: block; }
.subj .pct { font-family: var(--font-data); font-size: 30px; font-weight: 700; color: var(--c); text-align: right; }
.bar { height: 8px; background: var(--sheet-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.subj .barcell { display: grid; gap: 6px; min-width: 0; }
.subj .exam { display: grid; gap: 4px; justify-items: start; min-width: 0; }
@media (max-width: 860px) {
  .subj { grid-template-columns: 6px minmax(0, 1fr) auto; row-gap: 8px; column-gap: 14px; }
  .subj .stripe { grid-row: 1 / 4; }
  .subj .name { grid-column: 2; grid-row: 1; }
  .subj .pct { grid-column: 3; grid-row: 1; font-size: 26px; }
  .subj .barcell { grid-column: 2 / -1; grid-row: 2; }
  .subj .exam { grid-column: 2 / -1; grid-row: 3; }
}
.today { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px 18px; }
.today ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; }

/* Course head */
.chead { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; border-left: 5px solid var(--c); padding-left: 14px; }
.chead h2 { font-size: 26px; }
.chead .pct { font-family: var(--font-data); font-size: 40px; font-weight: 700; color: var(--c); line-height: 1; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--ink-2); }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--c); font-weight: 600; }

/* Desk */
.desk { display: grid; grid-template-columns: 260px minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 1180px) { .desk { grid-template-columns: 240px minmax(0, 1fr); } .tutor { grid-column: 1 / -1; position: static !important; height: 560px !important; } }
@media (max-width: 760px) { .desk { grid-template-columns: minmax(0, 1fr); } .index { position: static !important; max-height: 280px !important; } }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); min-width: 0; }
.index { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 8px; }
.index .grp { padding: 10px 8px 4px; }
.index button.item { all: unset; display: block; cursor: pointer; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
.index button.item:hover { background: var(--sheet-2); }
.index button.item[aria-current="true"] { background: var(--sheet-2); font-weight: 600; }
.index .tick { color: var(--good); }
.index details summary { cursor: pointer; padding: 10px 8px 4px; }
.notes { padding: 20px 24px; }
.notes .md h3 { font-family: var(--font-body); font-size: 16px; margin: 22px 0 6px; }
.notes .md ul { padding-left: 22px; margin: 4px 0; }
.notes .md li { margin: 3px 0; }
.notes .md p { max-width: 72ch; }
.notes .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.src { background: var(--sheet-2); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.src ul { margin: 6px 0 0; padding-left: 20px; }

.tutor { position: sticky; top: 12px; height: calc(100vh - 24px); min-height: 460px; display: flex; flex-direction: column; overflow: hidden; }
.tutor header { padding: 12px 14px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.log { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 9px 12px; border-radius: 12px; max-width: 96%; overflow-wrap: anywhere; font-size: 14.5px; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { padding-left: 20px; margin: 4px 0; }
.msg table { border-collapse: collapse; display: block; overflow-x: auto; } .msg td, .msg th { border: 1px solid var(--rule); padding: 3px 6px; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--sheet); }
.msg.ai { align-self: flex-start; background: var(--sheet-2); }
.msg.err { background: var(--sheet-2); color: var(--bad); }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { font-size: 13px; padding: 4px 10px; }
.compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--rule); }
.compose textarea { height: 44px; min-height: 44px; }

/* Lists */
.rows { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row .n { font-family: var(--font-data); color: var(--ink-2); text-align: center; }
.row.dim { opacity: .55; }
.row .score { font-family: var(--font-data); font-weight: 700; }
.row .tags { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 6px; vertical-align: middle; }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); }
.linkbtn:hover { text-decoration: underline; }

/* Quiz */
.q { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; }
.q .qt { font-weight: 600; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 9px; cursor: pointer; }
.opt input { width: auto; margin-top: 4px; }
.opt.ok { border-color: var(--good); } .opt.no { border-color: var(--bad); }
.opt.ok::after { content: "✓"; margin-left: auto; color: var(--good); font-weight: 700; }
.opt.no::after { content: "✗"; margin-left: auto; color: var(--bad); font-weight: 700; }
.fb { padding: 9px 12px; border-radius: 9px; background: var(--sheet-2); font-size: 14px; border-left: 4px solid var(--rule); }
.fb.good { border-color: var(--good); } .fb.mid { border-color: var(--warn); } .fb.bad { border-color: var(--bad); }
.fb p { margin: 4px 0; }
.stack { display: grid; gap: 12px; }
.bar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s ease; } }
</style>

llo Scorecard, una competizione molto agguerrita porta a:", "options": ["Un punteggio sopra 1 per il fattore competition", "Un punteggio sotto 1 per il fattore competition", "Nessun effetto, la competizione non è un fattore", "Escludere l'azienda dai comparables"], "answer": [1], "explain": "Ogni fattore va da 0 a 2 (1 = media); più competizione = punteggio più basso."}, {"type": "mc", "q": "Dopo aver assegnato i punteggi Berkus alle 5 categorie, cosa si dovrebbe fare?", "options": ["Sommarli e basta", "Ribilanciare: più generosi dove altre categorie compensano, meno dove un punteggio era debole", "Moltiplicarli per la baseline dei comparables", "Scartare la categoria con punteggio più basso"], "answer": [1], "explain": "Il prof ha suggerito una fase di ribilanciamento dopo lo scoring iniziale."}, {"type": "open", "q": "Calcola l'adjustment factor dello Scorecard con questi punteggi: team 2, opportunity 2, product 1,6, competition 1,2, sales 1,7, funding needs 1,5, other 1,2. Mostra il calcolo.", "answer": "0,30×2 + 0,25×2 + 0,15×1,6 + 0,10×1,2 + 0,10×1,7 + 0,05×1,5 + 0,05×1,2 = 0,60 + 0,50 + 0,24 + 0,12 + 0,17 + 0,075 + 0,06 = 1,765 ≈ 1,76. Con baseline 12M → circa 21,2M."}], "2026-11-03-scorecard-rfs-vc-method.md": [{"type": "mc", "q": "Nella Risk Factor Summation con calibrazione classica, quanto vale ogni punto?", "options": ["100K su baseline 500K", "250K su baseline 2M", "500K su baseline 2,5M", "10% della baseline"], "answer": [1], "explain": "Scala da −2 a +2 per fattore; classicamente 250K per punto su una baseline di 2M. I fattori non rilevanti si mettono a 0."}, {"type": "mc", "q": "Con il VC method: exit value 100M, target multiple 50x. Qual è la post-money valuation massima?", "options": ["50M", "2M", "5M", "0,5M"], "answer": [1], "explain": "Post-money = exit value / target multiple = 100 / 50 = 2M. In alternativa: exit / (1+R)^N."}, {"type": "mc", "q": "Lo Scorecard di Constellation Space dà ~29,6M contro un cap del SAFE di 30M. Cosa si conclude?", "options": ["Il deal è sopravvalutato", "Il deal è sottovalutato", "Il prezzo è in linea: serve almeno un gap del 15-20% per parlare di over/underpricing", "Non si può confrontare una valutazione con un valuation cap"], "answer": [2], "explain": "Differenze piccole rientrano nell'errore del metodo; il prof richiede almeno 15-20% di scostamento."}, {"type": "mc", "q": "Quali criteri usare per scegliere i comparables (deal simili) per la baseline?", "options": ["Stesso settore/spazio", "Stage simile (etichette adiacenti ok)", "Timing recente", "Stessa dimensione del round richiesta dall'azienda valutata"], "answer": [0, 1, 2], "explain": "Si screenano per settore, stage e periodo (es. Constellation: tenuti Vector Nova, AstroLink, Orbital Grid, Stellar Path → baseline 19,75M)."}, {"type": "open", "q": "Perché la slide sui competitor di Constellation Space (Virgin Orbit, Boeing, SpaceX, Blue Origin) è stata definita 'terribile'? Che domanda bisogna sempre porsi sulla competizione?", "answer": "Perché i giganti citati non sono veri competitor diretti di una startup seed: il founder mostra di non conoscere il proprio mercato. Bisogna chiedersi perché un grande player non potrebbe semplicemente copiarti (rischio chiave oggi per le app AI rispetto a OpenAI/Anthropic)."}], "2026-11-04-later-stage-valuation.md": [{"type": "mc", "q": "Qual è la relazione corretta tra Enterprise Value ed Equity Value?", "options": ["EV = equity value + debt − cash", "EV = equity value − debt + cash", "Equity value = EV + debt − cash", "EV = equity value × (1 − DLOM)"], "answer": [0], "explain": "Quindi equity value = EV + cash − debt. Nel caso Organise senza debito conta solo la cassa (+22M)."}, {"type": "mc", "q": "Una SaaS cresce del 50% con FCF margin −10%. Rispetta la Rule of 40?", "options": ["Sì: 50 + (−10) = 40", "No: il FCF è negativo", "No: serve EBITDA positivo", "Sì, ma solo se il gross margin supera il 76%"], "answer": [0], "explain": "Rule of 40 = crescita ricavi % + FCF margin %. Giustifica FCF negativo in fasi di forte investimento in crescita."}, {"type": "mc", "q": "Se applichi multipli da precedent transactions per un investitore che NON acquisisce il controllo, cosa fai col control premium?", "options": ["Lo aggiungi (×1,35)", "Lo togli: i multipli di precedent transactions includono il premio di controllo", "Lo ignori: non influisce", "Lo sostituisci con il DLOM"], "answer": [1], "explain": "Le transazioni precedenti incorporano un premio di controllo (mediana 38%, si assume 35%, range 25-45%): va depurato per una quota di minoranza; si riaggiunge solo se il buyer cerca il controllo."}, {"type": "mc", "q": "Nella calibrazione sul round precedente, perché NON si applica anche un DLOM separato?", "options": ["Perché il DLOM è già incorporato nel fattore di calibrazione", "Perché le aziende later-stage sono liquide", "Perché il DLOM vale solo per le IPO", "Perché il fattore di calibrazione è sempre maggiore di 1"], "answer": [0], "explain": "Il fattore (~0,85) confronta il multiplo implicito del round B con quello dei peer quotati, quindi cattura già sconto di illiquidità e altre differenze. Svantaggio: eventuali bias del round precedente si trascinano."}, {"type": "open", "q": "Calcola la pre-money equity value di Organise con il multiplo di regressione 10,4x, NTM revenue 54M, DLOM 20% e net cash 22M.", "answer": "Pre-money equity = multiplo × revenue × (1 − DLOM) + cash = 10,4 × 54 × 0,8 + 22 = 449,28 + 22 ≈ 471M (vicino ai 450M pre-money proposti nella Series C)."}]}, "lectures": {"2026-09-29-lex07-financing-sources.md": {"file": "2026-09-29-lex07-financing-sources.md", "title": "VC 29-09 (lex 07) — Fonti di finanziamento e ruolo dei VC", "date": "2026-09-29", "wispr": "https://notes.wisprflow.ai/shared/LLih370FIOO1JpyiOVp_SdSVYnUiWcGX0c3zNg-_HHc", "body": "Lecture on venture capital financing: how startups match with banks, angels, VCs, and government funding, why VC selection vs value-add is hard to disentangle, and how European regulation, bankruptcy law, and exit conditions constrain the industry.\n\n### Framing: Supply vs Demand for VC\n- Draghi report highlights that VC scarcity is not only a supply-of-funds problem but also a demand and quality-of-demand problem\n- Comparing tiny startups to mature firms distorts growth measurement; EIF-backed survey found limited measurable effect\n\n### Financing Sources by Novelty and Capital\n- Low novelty, low capital: personal credit and bank loans dominate\n- High novelty: angels and VCs step in because banks reject uncertainty\n- High capital, low novelty: commercial banks; high capital, high novelty: VCs and government (e.g. AI infrastructure)\n- Financing is a matching problem driven by risk, information, control, capital intensity, and follow-on needs\n\n### Bootstrapping, Banks and the 4 Cs\n- Bootstrapping via savings or friends and family is harder in Europe than in the US, so entrepreneurs tend to be older\n- Banks assess the 4 Cs: capacity, collateral, conditions of the economy, and capital invested\n- Banks require ~3 years of financial statements plus personal statements as collateral, incompatible with startup reality\n- Debt contracts limit downside but exclude the upside; startups have negative cash flow, intangible assets, and information asymmetry\n\n### VC Structure and Types\n- VC firms raise from limited partners; general partners typically decide investments, with education and technical knowledge being critical\n- Types: financial/independent VCs (incl. micro/seed), corporate/strategic VCs, public/government VCs, and family offices\n- Strategic VCs may invest to expand market access or to neutralize a competitor by absorbing its R&D\n- Early European VCs were mostly bank-backed, reasoned like banks, and were not active investors\n\n### VC Value-Add, Selection and Syndication\n- VCs contribute expertise, networks, follow-on capital, managerial access, and certification for later bank financing\n    - Risk: even without stealing, VCs can spread ideas across their portfolio, so patenting matters\n- Survey data: VC-backed firms outperform, but this may reflect selection rather than value-add; econometrics needed to separate\n- Strategic advice and networking are the largest reported VC contributions in both startup and expansion stages\n- Syndication motives: better selection early, resolving information asymmetry later, risk sharing, complementary expertise, and navigating cross-border European deals\n\n### Next Steps\n- (Speaker 1) Continue tomorrow with the formal model and the moral hazard discussion"}, "2026-09-30-lex08-european-vc.md": {"file": "2026-09-30-lex08-european-vc.md", "title": "VC 30-09 (lex 08) — VC europeo, selezione, debito vs equity", "date": "2026-09-30", "wispr": "https://notes.wisprflow.ai/shared/F_0BhODx5IdKBqwvHkNcQ9EmQabyUiGqyLqCRGXRPCw", "body": "Lecture on European venture capital: market data, how VCs select and monitor deals, entrepreneur/VC conflicts, and the debt vs equity contract setup leading into a moral hazard model.\n\n### European VC Market Context\n- European VC market at 35.3 billion in 2025, heavily weighted to ICT, vs 320 billion in the US.\n- Europe consumes rather than produces AI, raising dependency concerns vis-à-vis US and China.\n- Bank-based VCs and prudent-man rules on pension funds historically limited risky investment in Europe.\n    - Swedish pension funds are an exception; UK long constrained by prudent man rule.\n- Disappearance of new markets (Nuovo Mercato, Nouveau Marché) removed easy exit routes for small firms.\n\n### Angels vs VCs\n- Angels vary by industry and entrepreneurial experience: financial angels focus on returns, experienced angels add mentoring.\n- Angels can syndicate or create special vehicles to match VC-sized rounds and compete with VCs.\n- European angels typically have less industry/entrepreneurial depth, so are less active in firms.\n\n### How VCs Select and Add Value\n- Gompers et al. (2020) survey of ~1,000 VCs vs Kaplan (2025) with 8,000 deals; VC networks source most deals, 30% self-generated.\n- 47% cite management team as key selection factor; jockey matters early, product/market matter in later rounds.\n- Selection takes ~83 days and ~118 hours of due diligence; success attributed partly to luck (statistically significant).\n- Post-investment: weekly interaction, strategic guidance dominant; investment decisions typically unanimous among GPs.\n\n### Entrepreneur vs VC Conflicts\n- Entrepreneurs want control and shared risk; VCs want financial return, later-round participation, and eventual liquidity via IPO.\n- Contract clauses (voting, board, liquidation, anti-dilution, non-compete) manage conflicts; US non-competes ~16 months vs ~6 in Europe.\n- Moral hazard runs both ways: entrepreneur may slack post-funding, VC may invest passively to deploy LP capital.\n- Replacement of founder by CEO happens via contract clauses that shift voting power to VC when things go badly.\n\n### Debt vs Equity and Modigliani-Miller\n- Debt gives downside protection (paid first, flat payoff); equity gives upside exposure after debt is repaid.\n- Equity incentivizes both entrepreneur and VC to push return above D; debt lenders only want collateral back.\n- Modigliani-Miller: with no market imperfections, capital structure is irrelevant; just maximize expected return.\n- Real markets have taxation, asymmetric information, moral hazard, so asset choice matters, motivating the upcoming model.\n\n### Decisions Made\n- Course model will cover single-source moral hazard only, not double moral hazard, to keep the logic tractable.\n\n### Next Steps\n- (Speaker 1) Send cited AI/VC literature by email to any student who requests it.\n- (Speaker 1) Build a simple single-source moral hazard model with the class next session.\n- (Everyone) Review the VC survey tables independently and bring questions."}, "2026-10-06-moral-hazard-model.md": {"file": "2026-10-06-moral-hazard-model.md", "title": "VC 6-10 — Modello di moral hazard (Holmström-Tirole)", "date": "2026-10-06", "wispr": "https://notes.wisprflow.ai/shared/vPzsI47MPWpcUDY_Q0AxJj3_DW7e0K_pckexYvbi5ok", "body": "Lecture on VC contracting via a single moral hazard model (likely Holmström and Tirole): incentive and investor constraints, why Europe needs more founder assets than the US, and why VC contracts are equity-based.\n\n### Course Admin and Study Approach\n- Class 8 contract lecture notes are released only after class so students work actively and build the model together\n- ChatGPT and lecture notes are fine if used actively; passive study leads to far more mistakes\n- Class 7 graph with inverted entrepreneurial activity axis has been corrected; students should recheck it\n\n### Why VC Contracts Matter\n- Contracts align entrepreneur and VC objectives when moral hazard arises; debt and equity alone cannot do this\n- Contracts must also set monitoring and control, VC effort incentives, return split, and the liquidity event exit\n    - Exit is regulated since a founder or VC leaving right after an IPO sends a bad market signal\n- VC deals are conditional contracting: they must cover all possible outcomes, unlike a standard bank loan\n\n### Single Moral Hazard Model\n- Project costs I; entrepreneur has assets A < I, borrows I − A, protected by limited liability (no collateral)\n- Return R with probability P, else 0; shirking lowers P from PH to PL but gives private benefit B\n    - B and PL are independent and exogenous; higher B only raises the reward needed\n- NPV must be positive only when behaving: PH·R − I > 0, while PL·R − I + B < 0\n- IC constraint: (PH − PL)·R_B ≥ B; IR constraint: PH·R_L ≥ I − A, equality under perfect investor competition\n    - Investor only breaks even, so the entrepreneur captures the full NPV as the price of incentives\n\n### Required Founder Assets and US vs Europe\n- Solving for A: A ≥ I − PH·(R − B/(PH − PL)); higher I needs more A, higher R needs less\n- If PH equals PL, A goes to infinity: investors cannot distinguish behavior, so no one lends\n- Higher B raises required assets; slow courts and opaque, unreliable economies raise B (e.g. Argentina 2001)\n- Explains why US founders get funding with little capital while in Europe it relies on private savings\n    - Example: US students borrowing from banks for MIT tuition, education debt not dischargeable in bankruptcy\n\n### Debt vs Equity\n- With zero payoff on failure, debt and equity are indistinguishable since there is no downside protection\n- If value remains on failure, give the leftover (debt) to the investor and equity to the entrepreneur for upside incentive\n- Under double moral hazard both need upside incentives, so VC contracts are typically all-equity\n\n### Next Steps\n- (Speaker 1) Upload class 8 lecture notes on contract after class\n- (Speaker 1) Post a sample VC contract online to show its complexity\n- (Students) Review the slides on VC selection and governance and send questions by email"}, "2026-10-07-term-sheets-preferred.md": {"file": "2026-10-07-term-sheets-preferred.md", "title": "VC 7-10 — Term sheet, pre/post-money, preferred stock", "date": "2026-10-07", "wispr": "https://notes.wisprflow.ai/shared/RpTByP76vqc3bjBwApcNHAZnGv9XRCr8z79ITiisSAA", "body": "VC lecture recapping the moral hazard financing model, then covering term sheets, pre/post-money valuation, and preferred stock features (liquidation preference, redemption, conversion, participation); a new case session on a CEO dispute began.\n\n### Moral Hazard Model Recap\n- Investor rationality constraint: expected return to lender, PH(R − R_B), must be at least I − A.\n- Required entrepreneur assets rise with project cost and private benefit B, fall with return; PH equal to PL means no one lends.\n    - Weaker, slower courts (Europe vs US) raise B, so Europe demands more collateral\n- With zero payoff on failure, debt vs equity is irrelevant; with leftover value, debt protects the investor.\n- Double moral hazard (entrepreneur and VC both need incentives) points to equity rather than plain debt.\n\n### Term Sheets and Valuation\n- Term sheet is a preliminary agreement; bargaining power shifts with market cycles (VCs held power in the 2008 credit crunch).\n- Post-money = pre-money + investment; example: 8 million pre, 2 million invested, 10 million post, investor share 20%.\n    - Analysts quote post-money; investors think in pre-money then add the investment\n- Differing national laws hinder cross-border VC; EU's proposed '28th regime' and US Delaware incorporation mentioned.\n- Contracts also cover anti-dilution, covenants and conditional terms, and employee terms like 16-month non-competes.\n\n### Preferred Stock Features\n- VCs use preferred stock, paid before common, giving some downside protection without being debt.\n- Liquidation preference multiplier: 95.8% of US deals in Q2 2026 used 1x; higher multiples squeeze founders.\n- Unconditional redemption rights signal strong investor power and can force liquidation; only 5.4% of deals used them.\n- Participating preferred lets investors also share in the founders' residual; 96.4% of deals were non-participating.\n\n### Convertible Preferred Example\n- 2 million at 5 dollars per share gives 400k shares; with 600k existing, investor owns 40%.\n- Convert when 40% of exit value exceeds 2 million, so above 5 million; a 2x multiple shifts the threshold right.\n- Asking for convertibility implies the investor expects post-money of at least 5 million, so pre-money 3 million.\n- Caps can limit conversion upside; these terms push VCs to add value toward higher valuations.\n\n### Course Logistics and New Case Session\n- Remaining slides, anti-dilution and exercises will be covered next week.\n- Separate class started a case on whether to back a CEO accused by the board of hiding information about a consultant.\n\n### Next Steps\n- (Speaker 1) Post lecture notes on preferred stock after finishing the topic next week\n- (Speaker 1) Share a mock exam at the end of the lectures and schedule a class to discuss it\n- (Speaker 1) Possibly post reading material on the EU 28th regime\n- (Students) Read the Harvard Business case contract posted online before next class discussion\n- (Students) Review preferred stock slides and graphs and bring questions next week"}, "2026-10-13-contract-terms.md": {"file": "2026-10-13-contract-terms.md", "title": "VC 13-10 — Clausole contrattuali, SAFE, anti-dilution, staging", "date": "2026-10-13", "wispr": "https://notes.wisprflow.ai/shared/oNaYZjzQS8t5ce-7xH-gffR1y6xi2xYz7j0a5DBecO8", "body": "Lecture on VC contract terms: preferred stock variants, SAFEs and convertible notes, anti-dilution clauses, other term sheet rights, and a stage financing example showing entrepreneurs can sell less equity.\n\n### Preferred Stock Variants\n- Straight preferred is paid first at liquidation (after debt); preferred term = investment × multiplier, plus possible cumulative dividends.\n    - Multiplier was 1 in more than 90% of US cases in Q2 2026; higher in downturns\n- Redeemable preferred (about 5% of deals) lets the VC demand money back, signaling very high VC bargaining power.\n- Convertible preferred: the conversion share S reveals the minimum post-money valuation as I / S; a higher multiplier raises the conversion threshold.\n    - Conversion is irreversible: once converted, there is no going back to preferred\n- Participating preferred keeps PT plus a share of remaining returns, often capped; beyond the cap the investor must convert to common.\n\n### Convertible Notes and SAFEs\n- Convertible notes and SAFEs (simple agreement for future equity) are debt-like, used at pre-seed, giving little control.\n    - Over 90% of pre-seed rounds in Q1 2026 used these; not used 10 years ago\n- SAFE holders usually cannot demand anti-dilution: a 10% stake falls to 8% if a new investor takes 20%.\n\n### Anti-Dilution Clauses\n- Full ratchet resets conversion price to the new issue price, punishing the entrepreneur and signaling strong VC power.\n    - Example: price drops from 1 dollar to 0.5, investor shares double to 2 million, stake above 50%\n- Weighted average multiplies the old price by a ratio below 1; in the example new price is 0.988 and stake falls from 50% to about 49%.\n- Common exam mistake: forgetting to multiply the ratio by the old price when it equals 1.\n\n### Other Term Sheet Rights\n- Covered pay to play, protection provisions, preemption, right of first refusal, tag along, drag along, co-sale, and lock-up periods.\n- Drag along forces all shareholders to sell once the board majority decides, e.g. to liquidate a failing firm and limit liability.\n- Also: information and visitation rights, key man insurance, jurisdiction choice, IP transfer, veto and affirmative rights, registration rights.\n- Control rights: about 47% of US board seats held by VCs, rising above 50% when things go badly.\n\n### Stage Financing and Grandstanding\n- Example needs 30 (10 now, 20 later); good news (prob 2/3) yields 150, bad news yields 150 with prob 1/10, else 0.\n- All money up front: stake is 30/105, about 28.5%; staged: 10% at time 0 plus 13.3% at time 1, total 23.3%.\n    - Staged stakes use conditional expectation on good news, since VC won't fund after bad news\n- Milestones (patent, sales, profit) gate later tranches; staging serves control, signaling, and screening.\n- Young VCs push IPOs early to build reputation: grandstanding.\n\n### Next Steps\n- (Speaker 1) Add a computation for the case where the bad-news payoff is positive\n- (Students) Work through the numerical examples on preferred stock and anti-dilution, emailing questions if stuck"}, "2026-10-14-guest-360-capital.md": {"file": "2026-10-14-guest-360-capital.md", "title": "VC 14-10 — Guest speaker (360 Capital)", "date": "2026-10-14", "wispr": "https://notes.wisprflow.ai/shared/SVRWbzuuhGsM-BEebHB2Wz2-ACR_KCQtUGPIPpGgp44", "body": "Guest lecture by a 360 Capital partner (former student of the course) on her VC career, portfolio deals from HR tech to deep tech, Europe vs US funding gaps, and breaking into VC.\n\n### Course Logistics and Speaker Background\n- Case posted online is not compulsory for the exam but useful for reviewing contractual clauses.\n- Speaker 2 is a former student (graduated 2019), did consulting, joined 360 Capital in 2020, became partner 2 years ago.\n- Core VC skill is sourcing: one company can return the whole fund (power law).\n\n### Portfolio Examples\n- Skillview: AI interview assessment, 6 million seed, founder was 25; SAP just bought competitor Tech Wolf.\n    - HR seen as easiest AI entry point; cybersecurity more critical but slow compliance-heavy sales\n- Thunder: employee benefits on a debit card, Italian copycat of models in France and Spain; copycats still viable in Italy.\n- Cortech (Polimi spin-off) optimizes wearable chip battery life; high risk, high reward, 7 to 10 expert touch points pre-term sheet.\n    - Patents can reveal claims; ring-fenced strategy with decoy patents suggested\n- Other deals: wastewater metal recovery firm (EU CRMA strategic project), Cybercode (AI agent detection), Energy Dome (CO2 energy storage).\n\n### Europe vs US Ecosystem\n- Energy Dome is flipping to the US: next round 300 million is beyond European investors, main clients are abroad.\n- Europe lacks large funds and pension allocation (0.12%); Italian pension funds invest mainly for tax incentives.\n- Average exit value in Europe cited as 51 million; Anthropic Series H rivals all European VC in 2025.\n- Discussed 28th regime, stigma of failure in Italy, and SME mindset limiting founder ambition.\n\n### AI Models and Being a Useful VC\n- Future is choosing models per task; cheaper open or niche models for repetitive work, top models for complex tasks.\n- VC should be hands-on like a doctor: available when founders ask, never dictating decisions.\n\n### Breaking Into VC\n- Interviews focus on motivation, knowledge of the fund's portfolio, opinions on trends, and a live pitch deck case without AI.\n- Recommended reading: TechCrunch, Sifted, MIT Tech Review, Financial Times.\n- Partnership requires personal capital at stake; Speaker 2 took a loan to invest."}, "2026-10-28-state-of-vc-market.md": {"file": "2026-10-28-state-of-vc-market.md", "title": "VC 28-10 — Stato del mercato VC (Q3 2026)", "date": "2026-10-28", "wispr": "https://notes.wisprflow.ai/shared/clzRrQdW8GnCdOhO8UIRAIXtimh7z1WUYXo8VQdMDFI", "body": "First lecture of the second module: course rules, revised syllabus and a new AI exercise tool, then a Q3 2026 state-of-the-market overview covering AI concentration, megarounds, power law, IPO underpricing and bubble debate.\n\n### Course Format and Rules\n- Speaker 1 teaches VC and researches VC and banking through network science, and advises VC funds in New York.\n- Class rules: intervene and ask questions, engage with materials firsthand, and no loitering since attendance is optional.\n- Each content class has slides with exercises, separate solutions, and about 20 pages of PDF notes since there is no textbook.\n\n### Syllabus and Schedule\n- Harder reasoning topics (valuation, instruments) moved earlier; study-heavy topics like fund raising and fund thesis moved closer to the exam.\n- Double class on early-stage valuation: VC method, scorecard, Berkus method, plus exercises.\n- SAFE instruments, with a guest talk by Alessandro Pioli (Primo Ventures) on the New York VC ecosystem.\n    - Then unicorn valuation; exercises and cases; final class for exercises and exam practice\n- **Exam is on December 21st**; exam will not test exact market figures from this lecture.\n\n### AI Exercise Tool\n- Experimental tool built on Claude generates unlimited exercises with step-by-step solutions.\n- Covers VC method, scorecard, term sheets (option pool, liquidation preferences, down rounds) and fund returns.\n\n### State of the VC Market (Q3 2026)\n- Global VC was 171 billion, down 28.5% vs prior quarter but up 43% vs last year; prior quarter boosted by OpenAI and Anthropic rounds.\n- AI takes 64% of funding (82 to 83% year to date), an unprecedented concentration; 27 rounds above 1 billion.\n    - Spray-and-pray still fits AI apps, but megarounds force bigger, more hands-on bets\n    - 'Pre-team' investing in top lab talent before any idea\n- 75% of US capital went to 5% of deals: an extreme power law; data providers differ due to no disclosure mandate in private capital.\n- LPs put more into VC than they get back; 88% of capital goes to experienced managers, signaling uncertainty.\n\n### IPOs, Bubble Debate and Regions\n- A company only receives the IPO primary price; a big day-one jump means underpricing by the bank, not success.\n- Class debated whether a heavily indebted AI cloud company will IPO in November or postpone again.\n- Bubble debate illustrated with Amazon falling to $6 in dot-com crash; Speaker 1 doubts LLMs will be the main AI paradigm.\n- US, Europe and China are similar in size; Israel, fourth, is about 10 times smaller; VC over GDP is a better comparison."}, "2026-10-29a-sourcing-screening.md": {"file": "2026-10-29a-sourcing-screening.md", "title": "VC 29-10 (parte 1) — Deal sourcing, screening, Berkus", "date": "2026-10-29", "wispr": "https://notes.wisprflow.ai/shared/hHIDURvK_6T1lairLDJ7XKG0KVpkYg6S0KBWUnzd7Ac", "body": "Lecture on VC deal sourcing, screening criteria, Italian VC data, and early-stage valuation methods, ending with a scoring exercise on the Endorsi case.\n\n### Deal Sourcing Channels\n- Sourcing is mostly network driven: fellow VCs, known founders, lawyers, accountants, dinners, events, and 'enablers'.\n    - Co-investing builds reciprocity; VCs often back founders again after a well-executed failure (8 out of 10 fail)\n- 2020 paper (data from about 2015-16): about 200 deals seen per 5 considered in California; only 2% sourced quantitatively.\n- Accelerators like Y Combinator act as a certification, but cold outreach still needs referrals to vet founders' business reputation.\n- Speaker passed on an AI sentiment startup after a trusted contact reported the founder scammed a business partner.\n\n### Data Tools and Regional Differences\n- A data-driven fund modeled outliers, not the mean, using LinkedIn hiring and web traffic data.\n    - Limits: gut feeling is hard to quantify; top engineers may not be on LinkedIn\n    - Other tools: SignalFire's Beacon (10 million data sources), Affinity (relationship intelligence)\n- Algorithms shortlist companies, but humans decide; investors are chosen for value add, not just money.\n- Europe is country-based with rising cross-border deals; Latin America is very cross-border and eyes US exits.\n- Continental Europe lacks late-stage capital and IPO routes, so exits rely on acquisitions and CVCs.\n    - Market cap on GDP: UK around 200%, Italy historically 35-38, 47 this year\n\n### Screening and Italian VC Data\n- About half of screening weight is the team; also fit with fund strategy, product, business model thinking, market and TAM.\n    - Checklist: stage, ticket size, industry, geography, opportunity size, key assumptions, competition, management adaptability\n- Italian startup incorporation 'for 1 euro' really takes about a month and costs in stamps, notary and banking hurdles.\n- Italy study: 84 companies out of 120; more public and early-stage VCs, more healthcare focus.\n    - TAM cited by only 1% and business model 2%, since many Italian VCs exit via secondary sales to private equity\n\n### Early-Stage Valuation Methods\n- Four methods covered: Berkus, scorecard, risk factor summation (12 categories), and VC method; results rarely converge.\n- Berkus five categories: sound idea, prototype, management team, strategic relationships, product rollout to market.\n    - Classic version 100K each (500K max); rescaled to 500K each (2.5 million max), as average seed is about 3.5 million\n- Scorecard uses comparables by sub-industry, geography and stage, adjusted by seven factors; finding true comps is hard.\n- Top scores: real willingness to pay, a filed patent, founders with previous exits, pilots and credible go-to-market.\n\n### Endorsi Case Exercise\n- Harvard case (10-12 years old): Endorsi, Australia-based digital endorsements startup, founder relocating to SF.\n- Class scoring: idea 400, prototype well below average, team 300 (two people plus part-time, willing to relocate).\n- Strategic relationships weak: some personal network, but the founders appear desperate for investors."}, "2026-10-29b-berkus-scorecard-cases.md": {"file": "2026-10-29b-berkus-scorecard-cases.md", "title": "VC 29-10 (parte 2) — Casi Berkus e metodo Scorecard", "date": "2026-10-29", "wispr": "https://notes.wisprflow.ai/shared/Xp3BIw1S02_NBtT1kOALdCPaH5IPPtsckAK8tCb6-cE", "body": "Valuation class: startup cases using a 0 to 500 per-category method (Berkus), then the scorecard method with worked examples.\n\n### Per-category valuation method and Arditia Lab case\n- Case slides are old: judge each case in its own era; solutions that came later don't count.\n- Arditia Lab, Boston AI coding agent: idea strong (30 buyer interviews, 70% would pay 6,000 a month).\n    - Prototype 100 to 200 (mock-up only); management near 0 (part-time founder, no co-founders)\n    - Strategic relationships 350 to 400 (listed partner, framework contract); rollout around 250\n- After scoring all categories, rebalance: be more generous where others compensate, less where a score was weak.\n\n### Cobalto System (warehouse robots)\n- Idea about 450: urgent validated problem, but willingness to pay unknown and competition is heavy.\n- Prototype about 450: working product tested, no patent in a competitive, easily copied space.\n- Management 400 to 450: experienced team; open sales role not worrying at angel stage.\n- Strategic relationships 400 (350 to 450 range): partnership signed, no investor ties; rollout 350 to 400 with paid pilots.\n\n### Baby monitoring startup\n- Patented noise detection lets parents monitor babies and compare sleep patterns; free app plus paid subscription and device.\n- Check that the upfront device sale alone covers product, acquisition and fixed costs; subscription is then upside.\n- Scores: idea 500, product 500, team 300 (benefit of doubt), strategic 100, rollout 200 (no sales plan).\n- **Exam questions may have more than one correct answer, and this won't be stated.**\n\n### Scorecard method\n- Step one: average pre-money valuation of comparable local deals (screen by geography, stage) as baseline.\n- Step two: weighted adjustment factor, each category scored 0 to 2 (1 = average).\n    - Team 30%, opportunity size 25%, product/technology 15%, competition 10%, sales 10%, funding needs 5%, other 5%\n    - Fierce competition lowers the score\n- Multiply each score by its weight, sum, then multiply baseline (example: 10 million × 1.5).\n- Follow-on rounds at fast rising valuations (e.g. 330 million to 900 million in months) are a current hype trend.\n\n### Scorecard exercises\n- San Mateo cloud developer tool, serial founders: baseline 6 million, factor 1.68, valuation 10.08 million.\n- Cross-platform app platform: baseline 12 million, factor around 1.76.\n    - Team 2, market about 2, product 1.6, competition 1.2, sales 1.7, funding 1.5, other 1.2\n- Factor summation method is the same idea with more factors (management, stage, reputation, etc.)."}, "2026-11-03-scorecard-rfs-vc-method.md": {"file": "2026-11-03-scorecard-rfs-vc-method.md", "title": "VC 03-11 — Constellation Space, Risk Factor Summation, VC method", "date": "2026-11-03", "wispr": "https://notes.wisprflow.ai/shared/BYUT66-b3LicYSjS2KQlOzTQYNVBW1jyQPf8Jod02cA", "body": "The class valued Constellation Space with the scorecard method (about 29.6 million vs a 30 million cap, so in line), then covered risk factor summation and the VC method.\n\n### Course Materials and Exam\n- Blackboard holds slides, class notes, exercise guidance, cases and an Early stage evaluation practice artifact\n- Extra practitioner materials on instruments (SAFEs, dilution, notes) are for review, not part of Speaker 2's exam part\n- Cases teach how to do valuations; exam may give a deck, email or exercises rather than case-detail questions\n- Scorecard weights: team 30%, opportunity size 25%, product 15%, competition 10%, sales 10%, funding needs 5%, other 5%\n    - **Students often forgot \"other\" in past exams**\n\n### Constellation Space: Comparables and Baseline\n- Company raises 5 million on a SAFE at a 30 million valuation cap, no prior funding, so treated as seed, early 2022\n- Comparables need similar space, stage (adjacent labels fine) and recent timing; average seed deal grew from about 2 million to 3.6 million\n- Kept: Vector Nova, AstroLink, Orbital Grid, Stellar Path. Excluded: Astrohabitat, Deep Orbit Labs, Cosmovoyage, Lunar Forge\n- Average of kept deals gives a baseline of 19.75 million\n\n### Constellation Space: Scoring and Result\n- Scores: team 2, opportunity size 2, product 1.5, competition 0.7, sales 0.5, funding needs 0, other 1\n    - Product: six patents but no launch infrastructure, rockets or DOD approval yet\n    - Funding: no prior raise, no MVP, no letters of intent\n- Competitor slide (Virgin Orbit, Boeing, SpaceX, Blue Origin) called terrible: giants are not real competitors\n- Always ask why a big player would not copy you; now a key risk for AI apps versus OpenAI or Anthropic\n- Adjustment factor 1.5 gives about 29.6 million, in line with the 30 million cap\n    - Need at least a 15-20 percent gap to call a deal over or underpriced\n\n### Risk Factor Summation\n- Scores range from −2 to +2; classic calibration is 250k per point on a 2 million baseline\n- Factors include management, stage of business, technology, competition, sales, funding, manufacturing, legislation or politics, litigation\n- Unneeded factors are simply set to zero\n\n### VC Method\n- Post-money = exit value / (1 + R)^N, or exit value / target multiple\n- Exit value is an educated guess; early stage target multiple around 50x, some VCs want three digits\n- Investment capacity = exit value / target multiple − pre-money; compare against valuation\n\n### Next Steps\n- (Speaker 2) Upload more practice cases to Blackboard\n- (Students) Try the Early stage evaluation practice artifact on Blackboard"}, "2026-11-04-later-stage-valuation.md": {"file": "2026-11-04-later-stage-valuation.md", "title": "VC 04-11 — Valutazione later-stage (multipli, precedent, calibrazione)", "date": "2026-11-04", "wispr": "https://notes.wisprflow.ai/shared/o9gWkBaE5omEok94qW_9YzNV8iMz6-Ycx3iyq3Sh6og", "body": "Later-stage startup valuation: trading multiples, precedent transactions with control premium, and calibrating to the prior round, applied to a fictional Series C case.\n\n### Silicon Valley Origin Story\n- Silicon Valley grew from a 'fluke': Shockley (transistor Nobel winner) set up there to be near his sick mother.\n    - Employees (the 'Traitorous Eight') left over his temper and seeded firms like Intel, AMD\n- Alumni networks (e.g. the PayPal mafia) went on to found or fund Tesla, SpaceX, Uber, Meta.\n\n### Early vs Later Stage Valuation\n- Later stage brings real numbers and listed peers; assumptions and comparables matter more than the formulas.\n- Methods covered: trading multiples, precedent transactions, DCF, and scenario analysis (First Chicago method).\n- Drawbacks: complex capital structures (liquidation preferences, share classes) and illiquidity discounts.\n    - Square case preview: founders got about 0.5% at a roughly 3 billion exit\n- Investors care more about IRR at later stages, when forecasts become meaningful.\n\n### Series C Case and Trading Multiples\n- Fictional vertical software company (Organise): Series B June 2025, 30 million raised at 210 post-money.\n    - Series C: 60 million at 450 pre-money for an 11.8% stake\n    - NTM revenue 54 million, growth 50%, gross margin 76%, net cash 22 million\n- EV = equity value + debt − cash; equity value = EV + cash − debt. With no debt, only cash matters.\n- Rule of 40 (revenue growth + FCF margin) justifies negative FCF (−10) during heavy growth investment.\n- Multiples from 8 peers: median 7.6x, regression on growth 10.4x (R² 74%), growth-adjusted 14.4x.\n    - Pre-money equity = multiple × 54 × (1 − 0.20 DLOM) + 22 cash; DLOM range 15 to 25%\n\n### Precedent Transactions and Control\n- Control premium study (US listed targets, 1980 to 2008): median 38%, average 46%; 35% assumed, range 25 to 45%.\n- Precedent multiples are stripped of control premium; a buyer seeking control would add it back (×1.35).\n- Clean valuation differs from willingness to pay, which adds for rights like liquidation preference, board seat, or top co-investors.\n- Unicorn study of 135 firms: 56% average overvaluation of common shares; 65 worth below 1 billion after adjustment.\n\n### Calibrating to the Prior Round\n- Steps: derive EV implied by the Series B, divide by revenue then, compare to peer multiple, get calibration factor.\n- Apply factor (about 0.85) to the 10.4x regression multiple; no separate DLOM since it is embedded in the factor.\n- Drawback: any bias in the previous round carries into the new valuation.\n- Slide revenue figure was wrong; it should be the NTM revenue forecast as of June 2025."}}, "materials": [{"file": "syllabus-vc.pdf", "kind": "reading", "topic": null, "size": 38602, "chars": 10950, "uploadedAt": "2026-11-04T18:17:26.862Z", "text": "[Pagina 1]\nSYLLABUS 2026/2027\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 1/4\n20453 VENTURE CAPITAL AND VALUATION\nClass taught in English\nPrograms: EMIT (6 crediti - I sem. - OB | 6 cfu - SECS-P/11)\nClass: 28 (I sem.)\nDepartment: Finance\nCourse director: GIMEDE GIGANTE\nClass 28\nINSTRUCTORS\nGIMEDE GIGANTE\nDepartment of Finance, Università Bocconi, Milan, Italy\nEmail to: gimede.gigante@unibocconi.it\nGimede Gigante is Director of the SDA Bocconi Rome Campus and Director of ICE, Innovation and\nCorporate Entrepreneurship, the division that leads research, education, and ecosystem building in\ncorporate innovation, startups, and venture capital. He also serves as Director of the European FS\nTech Hub in Milan. At Università Bocconi, he is a tenured faculty member in the Department of\nFinance and serves as Director of the China MiM Double Degree Program in partnership with\nFudan University. He is also Academic Director of Bocconi Summer School, which welcomes over\n2,000 international students each year. His research focuses on banking, financial innovation, and\ncapital markets. He has held postdoctoral positions at the Stern School of Business, NYU, and\nColumbia Business School, and has published with Palgrave, Routledge, BUP, and Egea. He is\ncurrently Vice President of the Board of Directors of a listed Italian bank and Chairman of the\nAdvisory Board of a leading Italian fintech company. As part of his work in ICE, he regularly\ncollaborates with startups, scaleups, and venture investors across Italy and Europe. He holds a\nPh.D. in Banking & Finance, is a Chartered Accountant and Auditor, and has served in advisory\nroles for both private institutions and public bodies, including the Italian Parliament.\nOffice hours: in presence, Thursday h:18:00, via Roentgen 1, 2nd floor, room E2-05. Reserve your\noffice hours via YOU@B.\nLAURA BOTTAZZI\nIGIER, Università Bocconi, Milan, Italy\nEmail to: laura.bottazzi@unibocconi.it\nLaura Bottazzi is Full Professor of Economics at the University of Bologna. She is a Fellow of\n(IGIER), Bocconi University, the Center for Economic Policy Research (CEPR), London, an affiliate\nof AFFECT, the American Finance Association's Committee for Women in Finance, as well as the\nCommittee on the Status of Women in the Economics Profession (CSWEP).\nShe is an expert in international economics, innovation, venture capital, corporate finance and\nfinancial literacy.\nShe holds a degree in Economic and Social Disciplines from Bocconi University and a Ph.D. in\nEconomics from the Massachusetts Institute of Technology (MIT).\nOffice hours: September to December 2026, in presence Tuesday h:11.00, via Roentgen 1, 4th\nfloor, D10. Reserve your office hours via email. From January 2027: online upon reservation.\nMARTA ZAVA\n\n[Pagina 2]\nSYLLABUS 2026/2027\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 2/4\nDepartment of Finance, Università Bocconi, Milan, Italy\nFinance Area, SDA Bocconi School of Management, Milan, Italy\nEmail to: marta.zava@unibocconi.it\nProf. Marta Zava is Assistant Professor of Practice in Finance at SDA Bocconi School of\nManagement, where she also serves as Director of AI Applications to Finance. She holds a Ph.D.\nawarded with highest honors from Goethe University Frankfurt for a dissertation on venture capital\nand complex systems, which received multiple international prizes, including those of the French\nComplex Systems Society and the European Financial Management Association. She serves as\nan economic expert on venture capital and private capital topics for the Italian Ministry of Economy\nand Finance, CONSOB, and the European Central Bank, among other leading Italian and\nEuropean institutions, and has previously worked at the European Commission and at the ECB.\nShe is co-author of the book The Science of Influencers and Superspreaders (Springer, 2025),\namong several other peer reviewed publications and chapters, and her research on venture capital\nnetworks, financial markets, and artificial intelligence is published and presented internationally.\nShe is an elected board member of the Complex Systems Society and of the Network Science\nSociety.\nOffice hours: online. Reserve your office hour through this link https://cal.com/profzava/office-hour\nTeaching Assistant\nALESSIO ROCCHI\nDepartment of Finance, Università Bocconi, Milan, Italy\nEmail to: alessio.rocchi@unibocconi.it\nAttention! The program below is to be considered valid ONLY for the academic year 2026/2027.\nMISSION\nInnovative technology companies are a key driver of growth in advanced economies. They\nrepresent the most dynamic segment of entrepreneurial activity and make significant contributions\nto job creation, higher living standards, and wealth generation. They also play a crucial role in the\ncontinued growth of large, established firms, which often acquire start-ups to gain access to new\nproducts and technologies.\nA central challenge for entrepreneurs is securing resources they do not directly control, particularly\nfinancial capital. Investors are critical in this process, as funding not only provides liquidity but also\nattracts other essential resources such as skilled labor and specialized assets. These investors\nform the core of the venture capital ecosystem, which has expanded rapidly worldwide over the\npast decade, fueled by the pursuit of high returns in illiquid markets.\nTo successfully raise capital, entrepreneurs must develop a clear understanding of the venture\ncapital landscape and the different types of investors within it, such as VC funds, venture capital\ntrusts (VCTs), small business investment companies (SBICs), business angels, incubators, and\nclub deals.\nThe mission of this course is therefore twofold:\na) to analyze and understand how innovative entrepreneurs secure financing, including financial\ncontracts, company valuation, and the implications for innovation strategy; and\nb) to examine the defining characteristics of venture investors, covering legal considerations,\ntaxation issues, and the key aspects of deal-making.\nCOURSE CONTENT DETAILED - SCHEDULE - EMIT cl.27 & 28\n\n[Pagina 3]\nSYLLABUS 2026/2027\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 3/4\nPart One. Venture Capital: Fundamentals, Clusters, Investors\nInstructor: Gimede Gigante\n1. Course start up: rule of thumbs and general overview\n2. The fundamentals of venture capital: definition and main schemes\n3. Venture Capital Clusters: seed, start-up, and early stage\n4. Venture Capital Investors: Legal framework in Europe for equity investors\n5. Venture Capital Investors: Legal framework for Anglo Saxons Countries: US and UK cases\n6. Venture Capital Investors: Management Fees and Carried Interest, Risk and Return. Fiscal\nframework for equity investors: hands-on perspective\nPart Two. The Economics of VC and Innovation\nInstructor: Laura Bottazzi\n7. Financing Innovation: Angel Investors and VCs\n8. How do VCs choose and how do they affect firms' decisions\n9. The Deal Structure: Contracts and Incentives (I)\n10. The Deal Structure (II)\n11. The Contract: Dermacare\n12. Guest Speaker: a VC\nPart Three. The Venture Capital Life Cycle and Valuation\nInstructor: Marta Zava\n13. VC Trends Outlook 2026\n14. Raising a fund and creating a fund thesis\n15. Deal sourcing and matching investor and company\n16. Venture Capital Networks\n17. Due Diligence and Financial Models\n18. Investing: Valuation Methods I\n19. Investing: Valuation Methods II\n20. Portfolio Company Management and Follow-on Investments\n21. The end: Exits (M&A)\n22. The end: Exits (IPO)\n23. Working in VC: Hiring and Interview Process\n24. Artificial Intelligence applications in VC\nTEACHING METHODS\nSelection:\n• Lectures\n• Guest speaker's talks (in class or in distance)\n• Practical Exercises\no Software-Based Exercises\no In-class exercises\no Data Analysis, Graphic Representations/Calculators\nThe learning experience of this course is mainly based on face-to-face lectures. However, each of\nthe three modules is accompanied by case discussions and presentations by external guest\nspeakers. The use of cases and external speakers aims at better connecting the body of\nknowledge covered in the course with real life examples, typically focused on complex investment\n\n[Pagina 4]\nSYLLABUS 2026/2027\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 4/4\nbanking transactions. The interaction between the instructor and students during the case\ndiscussions and the presentations helps students understand how professionals in the field\napproach a transaction and organize it in a structured process going from the deal origination to\nthe final deal execution. Moreover, the usage of softwares help the students to understand the best\npractices of the financial market as well.\nASSESSMENT METHODS\nSelected methods: Continuous assessment Partial exams General exam\nWritten individual exam (traditional/online) x x\nOpen and/or closed answers questions exam x x\nThe final grade is based on a 50%-50% structure for students attending the two partial exams:\n• 50%: First mid-term exam covering Parts One and Two (MCQs)\n• 50%: Second mid-term exam covering Part Three (MCQs)\nStudents who opt for the general exam will be required to answer questions covering all three parts\nof the course.\nThe exam questions will require students to either discuss specific topics covered during the\ncourse or apply the concepts to numerical exercises and mini-cases. The overall objective of the\nassessment is to evaluate students' ability to collect and organize information and data, and to\napply them in solving real-world problems typically faced by venture capital funds, investors, and\nVC-backed entrepreneurs.\nTEACHING MATERIALS - EMIT cl. 28\n• Slides and ad hoc readings available in the Bboard Platform.\n• Text of case studies available in the Bboard Platform via Bocconi Library's Course Reserves.\n• Softwares and exercises available in the Bboard Platform.\nHONOR CODE\nBocconi University conceives of education as an ongoing process that stretches across a person's\nentire professional life. The University hopes that the entire Bocconi community will respect the\nvalues of fairness and correctness associated with it, values which inspire and guide the conduct of\nall community members as they pursue common objectives and a shared mission. Bocconi\nUniversity is also committed to building a truly inclusive climate based on diversity. With the\ncollaboration of faculty and students, it aims to ensure a safe learning environment free from any\nform of discrimination based on race, religion, gender, geography, age, disability or sexual\norientation, in which there is room for a diversity of approaches and where discussions are always\nconducted in a respectful manner. The Bocconi University Honor Code is published on the website\nat http://www.unibocconi.eu/honorcode, we encourage all students to read it.\nUpdated @ 30/07/2026"}]}, {"id": "emergence", "name": "The Emergence of Entrepreneurial Ventures", "short": "Emergence", "code": "21077", "color": "#0891b2", "professors": "Gutierrez · Valenti Gatto (guest: Colao)", "scope": "Programma completo (16 sessioni). Le sessioni 1-8 non hanno registrazioni Wispr: servono slide/letture.", "exam": {"date": "", "label": "Esame scritto individuale", "format": "Domande aperte e chiuse sui concetti principali (30 punti). Sample questions discusse in classe e su Blackboard."}, "assessment": ["60% esame scritto individuale", "40% group project (memo PDF, max 5 exhibit)", "fino a +1 punto partecipazione"], "topics": [{"n": 1, "date": "2026-09-07", "title": "Introduction. The returns to entrepreneurship", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 2, "date": "2026-09-09", "title": "Entrepreneurial judgment and action: deciding under uncertainty", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 3, "date": "2026-09-14", "title": "Entrepreneurial opportunities (case: Embrace)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 4, "date": "2026-09-16", "title": "Entrepreneurial strategy", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 5, "date": "2026-09-21", "title": "Customers and business models (case: Rent the Runway)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 6, "date": "2026-09-23", "title": "From problem to business model", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 7, "date": "2026-09-28", "title": "Founding teams (case: Ockham)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 8, "date": "2026-09-30", "title": "Co-founders & founder prenups", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 9, "date": "2026-10-05", "title": "Financing entrepreneurial ventures (case: Jibo)", "lectures": ["2026-10-05-entrepreneurial-finance.md"], "kind": "lesson", "status": "active"}, {"n": 10, "date": "2026-10-07", "title": "Scaling and exit (case: Baroo)", "lectures": ["2026-10-07-scaling-baru.md"], "kind": "lesson", "status": "active"}, {"n": 11, "date": "2026-10-14", "title": "The industry and the mindset", "lectures": ["2026-10-14a-how-vc-funds-work.md", "2026-10-14b-comfort-zone.md"], "kind": "lesson", "status": "active"}, {"n": 12, "date": "2026-11-04", "title": "Building before you raise", "lectures": ["2026-11-04a-cost-of-fundraising-pmf.md", "2026-11-04b-fundraising-prep.md"], "kind": "lesson", "status": "active"}, {"n": 13, "date": "2026-11-02", "title": "Guest lecture Colao (I): scale-up strategy", "lectures": ["2026-11-02a-guest-scaleup-strategy.md", "2026-11-02b-guest-growth-paths.md"], "kind": "lesson", "status": "active"}, {"n": 14, "date": "2026-11-11", "title": "Guest lecture Colao (II)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 15, "date": "2026-11-18", "title": "The geography of entrepreneurship", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 16, "date": "2026-11-23", "title": "Social entrepreneurship & wrap up (case: Sababa)", "lectures": [], "kind": "lesson", "status": "active"}], "order": 1, "cfu": 6, "quiz": {"2026-10-05-entrepreneurial-finance.md": [{"type": "mc", "q": "Secondo gli studi citati, qual è la fonte più grande di capitale iniziale delle startup?", "options": ["Venture capital", "Business angels", "Credito formale (prestiti bancari e linee di credito), circa il 40%", "Friends & family"], "answer": [2], "explain": "Insieme ai fondi propri, il debito bancario è la fonte principale; F&F è circa 7 volte più piccolo del credito bancario; VC e angel non sono la fonte principale."}, {"type": "mc", "q": "Nel 'market for lemons' di Akerlof applicato alle startup, qual è la conseguenza dell'asimmetria informativa prima del finanziamento?", "options": ["Moral hazard", "Adverse selection: i progetti buoni escono dal mercato e c'è sottofinanziamento per mancanza di fiducia", "Overfunding", "Signaling perfetto"], "answer": [1], "explain": "Prima del contratto = adverse selection; dopo il finanziamento = moral hazard."}, {"type": "mc", "q": "Quali caratteristiche deve avere un segnale credibile (signaling theory)?", "options": ["Osservabile", "Costoso", "Più costoso per gli imprenditori di bassa qualità", "Gratuito, così tutti possono inviarlo"], "answer": [0, 1, 2], "explain": "Esempi: trattenere equity, costruire un prototipo, clienti paganti, backer credibili."}, {"type": "open", "q": "Confronta principal-agent theory e control theory come risposte ai problemi di finanziamento delle startup, con un esempio di strumento contrattuale per ciascuna.", "answer": "Principal-agent: allinea gli incentivi legando i payoff ai risultati (equity, vesting legato a soglie/milestone). Control theory: poiché i contratti perfetti sono impossibili (contratti incompleti), l'investitore si prende diritti di controllo: board seat, diritti di voto, staging dell'investimento."}, {"type": "open", "q": "Pro e contro del bootstrapping. Cita almeno una tecnica e un esempio.", "answer": "Pro: controllo totale, disciplina; il 70% dei fallimenti è attribuito a mancanza di cassa, quindi la gestione del cash è centrale. Contro: crescita più lenta, difficile dove servono 50-60M e velocità. Tecniche: owner financing, ciclo di cassa (meno magazzino e crediti, più debiti verso fornitori), lean assets, sussidi. Esempio: Spanx, bootstrapped 2000-2021, 100% di proprietà, >1 miliardo."}], "2026-10-07-scaling-baru.md": [{"type": "mc", "q": "Cosa significa 'scaling' nella definizione vista a lezione?", "options": ["Qualsiasi crescita dei ricavi", "Crescita eccezionale in cui l'output cresce più velocemente degli input", "Aprire nuove sedi", "Raccogliere un round Series A"], "answer": [1], "explain": "Per questo le catene di ristoranti scalano male. OCSE: fast growth = 20% annuo per 3 anni."}, {"type": "mc", "q": "Secondo Penrose, cosa limita la crescita di un'impresa?", "options": ["Il capitale disponibile", "L'attenzione manageriale finita, perché i nuovi assunti vanno formati su cultura e processi taciti", "La domanda di mercato", "La regolamentazione"], "answer": [1], "explain": "Per questo assumere 5 manager insieme non aiuta: formarli consuma il tempo di leadership rimasto (caso Baroo, estate 2016)."}, {"type": "mc", "q": "Cos'è l'imprinting organizzativo?", "options": ["Il logo dell'azienda", "Le scelte iniziali dei founder che diventano regole, routine e gerarchie raramente riviste", "La cultura importata da un acquirente", "La strategia di marketing iniziale"], "answer": [1], "explain": "Studio Stanford su 200 startup: il blueprint del founder predice l'organizzazione meglio di quello del CEO attuale."}, {"type": "open", "q": "Nel caso Baroo, individua due esempi di imprinting che sono diventati problemi con la crescita e spiega come l'azienda ha provato a formalizzare, con quali costi.", "answer": "Esempi: contratti orari dei dipendenti; partnership con edifici di lusso che avvantaggiavano gli edifici e non Baroo (concierge senza incentivi che promuovevano competitor); app di booking off-the-shelf abbandonata; eventi sociali contrattuali e servizio luxury onerosi in nuove città. Formalizzazione: hotline 24/7 esternalizzata e scheduling → perdita di personalizzazione, lavoratori sovraccarichi, cultura passata da passione per gli animali a 'lavoro'. Evidenza: formalizzazione correlata al successo (ventures internet USA) e esperimento India (+10% sopravvivenza)."}], "2026-10-14a-how-vc-funds-work.md": [{"type": "mc", "q": "Nel modello '2 and 20', cosa rappresentano i due numeri?", "options": ["2% di carry e 20% di management fee", "2% annuo di management fee sugli AUM e 20% di carried interest sui profitti dopo restituzione capitale + hurdle", "2 anni di investimento e 20 di durata", "2 partner e 20 investimenti"], "answer": [1], "explain": "La fee copre le operazioni; il carry si incassa solo dopo aver restituito agli LP il capitale più l'hurdle rate."}, {"type": "mc", "q": "In un fondo seed classico, come si divide il capitale?", "options": ["100% nuovi investimenti", "55-60% nuovi investimenti, 40-45% follow-on nei vincitori", "20% nuovi investimenti, 80% follow-on", "50% VC, 50% debito"], "answer": [1], "explain": "I follow-on sono dove i fondi guadagnano di più, da cui la spinta verso crescita a 'hockey stick'."}, {"type": "mc", "q": "A che sconto si vendono tipicamente le quote secondarie?", "options": ["0%", "15-20%", "50%", "Premio del 20%"], "answer": [1], "explain": "Le secondarie sono una forma di exit; il relatore ha fatto due exit secondarie a 4,5-5,5x per mancanza di capitale follow-on."}, {"type": "open", "q": "Chi sono gli LP di un fondo VC e perché i fondi pensione italiani investono raramente in VC?", "answer": "LP: istituzionali (es. Cassa Depositi e Prestiti), fondi pensione, family office, corporate (che cercano tecnologia e target di acquisizione). I fondi pensione italiani investono poco per il quadro fiscale e per lo scarso track record di exit in Italia."}], "2026-10-14b-comfort-zone.md": [{"type": "mc", "q": "Cosa rappresenta la frase di Robert Capa 'If your pictures aren't good enough, you're not close enough' per un founder?", "options": ["Investire in tecnologia migliore", "Stare vicino al proprio mercato e ai clienti", "Assumere fotografi per il marketing", "Evitare i rischi"], "answer": [1], "explain": "Lezione: avvicinarsi, prendere rischi ragionevoli ed espandere continuamente la comfort zone."}, {"type": "open", "q": "Quali lezioni per i founder si traggono dalla parte 'mindset' della lezione? Citane almeno tre.", "answer": "La comfort zone deve crescere ogni giorno: diventare 'comfortable with being uncomfortable'; le mezze misure raramente costruiscono grandi aziende (co-founder senza side gig); il rischio cresce con ciò che metti in gioco; la foto è la punta dell'iceberg della preparazione; bilanciare umiltà e sicurezza senza diventare arroganti; spingersi oltre il disagio (es. candidature che sembrano fuori portata) paga."}], "2026-11-02a-guest-scaleup-strategy.md": [{"type": "mc", "q": "Come si calcola la Rule of 40 citata da Colao per le aziende growth stage?", "options": ["Crescita ricavi % + EBITDA margin %", "Crescita ricavi % × margine lordo", "EBITDA / ricavi > 40%", "Numero di dipendenti / ricavi"], "answer": [0], "explain": "Il caso (SaaS da 100M, break-even, crescita 10-15%) ha una 'rule of 15': va sistemato."}, {"type": "mc", "q": "Quale rischio principale del caso SaaS di internal communication è stato discusso (bear view)?", "options": ["Che Microsoft aggiunga la funzione o la offra gratis, come successo a Zoom", "Che i ricavi siano troppo alti", "Che i founder vendano troppo presto", "Che il prodotto non sia integrato"], "answer": [0], "explain": "Bull view: leader di categoria con founder focalizzati che superano in esecuzione una Microsoft distratta."}, {"type": "open", "q": "Perché startup e scale-up richiedono culture diverse e come andrebbe gestito il conflitto? Usa almeno un esempio della lezione.", "answer": "Startup: avventurieri e risk taker; growth: pianificatori curiosi con business case. Il conflitto sano va accettato mantenendo il DNA. Esempi: Wireless Logic lasciò indipendenti 15 CEO acquisiti → complessità di prodotto, ora centralizza; Vodafone split 70-30 piano comune vs innovazione locale (M-Pesa in Kenya); unità low-cost separata a Milano fallita perché bloccata dalle funzioni corporate."}], "2026-11-02b-guest-growth-paths.md": [{"type": "mc", "q": "Quali sono i tre percorsi di crescita di una scale-up?", "options": ["Nuove geografie, estensioni di prodotto, business adiacenti", "IPO, M&A, debito", "Prezzo, prodotto, promozione", "Seed, Series A, Series B"], "answer": [0], "explain": "Le adiacenze funzionano quando canali o piattaforma tecnologica sono condivisi (Wireless Logic: da IoT a eSIM per viaggi)."}, {"type": "mc", "q": "Perché Doctolib ha faticato in Italia ma ha avuto successo in Germania?", "options": ["Problemi di traduzione", "Medici italiani pagati a quota fissa per paziente e non per visita, studi piccoli, ospedali privati che non condividevano slot", "Concorrenza di Google", "Regolamentazione GDPR solo italiana"], "answer": [1], "explain": "Esempio dei controlli da fare sulla geografia: business model, competitor locali, cultura, canali, regolamentazione."}, {"type": "mc", "q": "Secondo il relatore, quale costo del capitale è tipicamente più alto?", "options": ["Debito (8-9%)", "Ibrido (12-13%)", "Equity (15-20%)", "Sono uguali"], "answer": [2], "explain": "L'equity costa di più ma porta competenze e 'dry powder'."}, {"type": "open", "q": "Perché la valutazione più alta possibile non è sempre la scelta migliore in un round?", "answer": "Va bene solo se è l'ultimo round: se la successiva valutazione è più bassa (down round) si danneggiano le stock option e quindi la capacità di assumere e trattenere talenti, oltre al segnale negativo al mercato."}], "2026-11-04a-cost-of-fundraising-pmf.md": [{"type": "mc", "q": "Quale soglia indica il product-market fit secondo il test citato?", "options": ["Il 10% degli utenti paga", "Circa il 40% degli utenti sarebbe 'molto deluso' se il prodotto sparisse", "NPS sopra 0", "1.000 utenti attivi"], "answer": [1], "explain": "Altre metriche: NPS, traffico organico, retention/churn, utenti paganti, LTV/CAC. Il PMF è temporaneo."}, {"type": "mc", "q": "Nel Net Promoter Score, come si classificano i voti?", "options": ["0-6 detractor, 7-8 passivi/neutri, 9-10 promoter", "0-4 detractor, 5-7 neutri, 8-10 promoter", "0-5 detractor, 6-10 promoter", "Solo 10 è promoter"], "answer": [0], "explain": "NPS = % promoter − % detractor."}, {"type": "mc", "q": "Quale schema di vesting è stato indicato come standard?", "options": ["Tutto subito", "Cliff di 1 anno (25%), poi fino al 100% in 4 anni", "Cliff di 6 mesi, 2 anni totali", "Nessun vesting tra co-founder"], "answer": [1], "explain": "Parte della preparazione del team prima di raccogliere: ruoli e commitment chiari, cap table equa, vesting."}, {"type": "mc", "q": "Quali sono perdite di autonomia FORMALI legate al fundraising?", "options": ["Diritti di veto e protective provisions", "Drag-along/tag-along", "Board seat dalla Series A", "Pressione costante al reporting"], "answer": [0, 1, 2], "explain": "La pressione al reporting, l'obbligo di spendere e il tempo per investor relations sono perdite informali."}, {"type": "open", "q": "Spiega la differenza tra drag-along e tag-along e chi protegge ciascuna clausola.", "answer": "Tag-along: protegge i soci di minoranza, che possono unirsi alla vendita alle stesse condizioni se la maggioranza vende. Drag-along: permette alla maggioranza di obbligare tutti i soci a vendere (exit totale)."}], "2026-11-04b-fundraising-prep.md": [{"type": "mc", "q": "Cosa NON dovrebbe mancare in un one-pager per investitori?", "options": ["Team, mercato, bisogno, prodotto/soluzione, traction, cap table", "Il codice sorgente", "Il business plan dettagliato a 10 anni", "I CV completi di tutti i dipendenti"], "answer": [0], "explain": "Il pitch deck deve essere molto conciso: gli investitori ne vedono migliaia all'anno."}, {"type": "mc", "q": "Perché la data room va preparata PRIMA del fundraising?", "options": ["Perché è obbligatoria per legge", "Perché ritardare i documenti chiave uccide il momentum dell'investitore: va condivisa lo stesso giorno o il successivo", "Perché sostituisce il pitch", "Perché la chiedono solo i fondi pensione"], "answer": [1], "explain": "Contiene contratti, brevetti, financials, pipeline, contratti d'affitto, ben strutturati."}, {"type": "open", "q": "Quale lezione insegna il caso Notion sul rapporto tra utenti, prodotto e fundraising?", "answer": "Notion partì con amici come team e utenti, bruciò ~2M, ricostruì il prodotto in Giappone, poi raccolse 10M (2019), 50M (2020), 275M (2021). Lezione: gli amici danno feedback distorti e non sono il target; prima si risolve un problema per utenti veri e si costruisce il prodotto, poi si raccoglie."}, {"type": "open", "q": "Come è composto il voto di questo corso e cosa vale la partecipazione?", "answer": "60% esame scritto individuale, 40% group project (memo PDF con max 5 exhibit); partecipazione fino a +1 punto bonus secondo il syllabus (in aula si è parlato di 1,5)."}]}, "lectures": {"2026-10-05-entrepreneurial-finance.md": {"file": "2026-10-05-entrepreneurial-finance.md", "title": "The Emergence 5-10 — Finanza imprenditoriale e bootstrapping", "date": "2026-10-05", "wispr": "https://notes.wisprflow.ai/shared/-JB6GT-b3t09eriJZAcDG6qoWUTCvMbNNW1PJ-63Z90", "body": "Entrepreneurial finance lecture on startup funding sources, why startups are hard to finance (information asymmetry, adverse selection, moral hazard), signaling and contracting theories, and bootstrapping, ending with an in-class case exercise.\n\n### Sources of Startup Capital\n- Studies show about 40% of initial capital comes from formal credit: bank loans and credit lines\n    - Own money and bank debt are likely the two largest sources\n- Friends and family funding is about 7 times smaller than bank financing, lower than expected\n- Angels and VCs are not the main source, despite most large companies being VC-funded\n- Equity crowdfunding was illegal in many countries in the 2014 study, so it scored lower then\n\n### Why Startups Are
