<title>Agenda di Sessione</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell (header + scrolling tab rail + single column of panels); notes & quiz open as full-screen "paper" sheets that stay light. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#141B26; --muted:#5A6576; --line:#D9DFE7;
  --accent:#2B50C8; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --danger:#C2362B; --danger-soft:#FBE6E3; --ok:#1C8048; --ok-soft:#E1F3E8; --warn:#A8670C; --warn-soft:#FAF0DC;
  --p-bg:#FBFAF6; --p-sheet:#FFFFFF; --p-ink:#1E2026; --p-muted:#686B74; --p-line:#E7E3D9; --p-accent:#2A47A8; --p-soft:#EEF1FA; --p-hl:#FFEC8A; --p-ok:#1C7A45; --p-bad:#B8322A; --p-warn:#9A5E08;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --sunk:#1C2531; --ink:#E5EAF1; --muted:#97A3B5; --line:#283344;
  --accent:#88A2FF; --accent-ink:#0B1020; --accent-soft:#1F2A46;
  --danger:#F07466; --danger-soft:#3A1C1A; --ok:#55C786; --ok-soft:#16301F; --warn:#E5AE52; --warn-soft:#33270F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --sunk:#1C2531; --ink:#E5EAF1; --muted:#97A3B5; --line:#283344;
  --accent:#88A2FF; --accent-ink:#0B1020; --accent-soft:#1F2A46;
  --danger:#F07466; --danger-soft:#3A1C1A; --ok:#55C786; --ok-soft:#16301F; --warn:#E5AE52; --warn-soft:#33270F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-weight:800;letter-spacing:-.01em;font-size:17px;display:flex;align-items:baseline;gap:8px;min-width:0}
.brand small{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
@media (max-width:520px){.brand small{display:none}}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--danger)}
.coursebar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.coursebar::-webkit-scrollbar{display:none}
.cbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.cbtn .num{color:var(--muted);font-weight:600}
.cbtn:hover{border-color:var(--c)}
.cbtn.on{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:var(--c)}
.clickable{cursor:pointer;transition:border-color .15s}
.clickable:hover{border-color:var(--c)}
.cname{border:0;background:none;padding:0;font:inherit;font-weight:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--c) 50%,transparent);text-underline-offset:3px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:9px 11px 11px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5}
main{padding-block:20px 80px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:14px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.sec-h h1{font-size:24px;letter-spacing:-.02em}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.c{background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block;flex:none}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.tag.review{background:var(--ok-soft);color:var(--ok)}
.tag.quiz{background:var(--warn-soft);color:var(--warn)}
.tag.err{background:var(--danger-soft);color:var(--danger)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f>*{font-weight:400;color:var(--ink)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.list{display:grid;gap:0}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{min-width:0;flex:1}
.li .t b{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0;font-weight:700;font-size:13.5px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:4px 8px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.lv-todo{--lv:var(--muted)}.lv-class{--lv:var(--warn)}.lv-studied{--lv:var(--accent)}.lv-ready{--lv:var(--ok)}
.cd{display:grid;gap:8px;border-left:4px solid var(--c)}
.cd .big{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:200;max-width:calc(100% - 32px)}
.plan-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.plan-item:first-child{border-top:0}
.plan-item.done .pt{text-decoration:line-through;color:var(--muted)}
.ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;font-size:13px;color:var(--accent-ink);margin-top:1px}
.done .ck{background:var(--ok);border-color:var(--ok)}
.pt{flex:1;min-width:0}
.mins{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.scroll-x{overflow-x:auto}
.inline-confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.edit-box{background:var(--sunk);border-radius:8px;padding:12px;display:grid;gap:10px;margin:6px 0 10px}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.offline{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}

/* ---------- Paper sheets (notes reader, quiz, flashcards): always light ---------- */
.paper{color-scheme:light;background:var(--p-bg);color:var(--p-ink);--ink:var(--p-ink);--muted:var(--p-muted);--line:var(--p-line);--surface:var(--p-sheet);--sunk:#F2EFE7;--accent:var(--p-accent);--accent-ink:#fff;--accent-soft:var(--p-soft);--ok:var(--p-ok);--ok-soft:#E3F2E8;--danger:var(--p-bad);--danger-soft:#F9E5E2;--warn:var(--p-warn);--warn-soft:#F8EDD6}
.overlay{position:fixed;inset:0;z-index:100;overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-top{position:sticky;top:0;z-index:5;background:var(--p-bg);border-bottom:1px solid var(--p-line)}
.sheet-top .in{display:flex;align-items:center;gap:6px;padding-block:8px;flex-wrap:wrap}
.sheet-top .ttl{font-weight:700;font-size:14px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:3px;background:var(--p-line)}.prog>i{display:block;height:100%;background:var(--p-accent);width:0}
.tool{border:1px solid transparent;background:none;border-radius:7px;padding:5px 9px;font-size:13px;font-weight:600;color:var(--p-ink);white-space:nowrap}
.tool:hover{background:#EFECE3}.tool.on{background:var(--p-ink);color:#fff}
.rd-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;max-width:1080px;margin:0 auto;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rd-toc{position:sticky;top:70px;align-self:start;font-size:13px;max-height:calc(100vh - 90px);overflow:auto}
.rd-toc a{display:block;color:var(--p-muted);text-decoration:none;padding:4px 0 4px 10px;border-left:2px solid var(--p-line)}
.rd-toc a.cur{color:var(--p-accent);border-left-color:var(--p-accent);font-weight:600}
@media (max-width:860px){.rd-layout{grid-template-columns:minmax(0,1fr)}.rd-toc{display:none}}
article.notes{font-family:var(--nf,var(--f-read));font-size:var(--ns,18px);line-height:1.68;max-width:var(--nw,68ch);min-width:0}
article.notes p{margin:0 0 1em}
article.notes .eyebrow{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--p-muted)}
article.notes h1{font-size:1.9em;line-height:1.15;margin:.25em 0 .5em;letter-spacing:-.015em}
article.notes h2{font-size:1.35em;margin:0;line-height:1.25}
article.notes h3{font-size:1.1em;margin:1.3em 0 .4em}
article.notes .msg{font-size:1.15em;font-style:italic;border-top:2px solid var(--p-ink);border-bottom:1px solid var(--p-line);padding:.7em 0;margin:1.4em 0}
article.notes .msg::before{content:"The message";display:block;font-style:normal;font-family:var(--f-ui);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--p-muted);margin-bottom:.3em}
article.notes .thread{font-family:var(--f-ui);font-size:.82em;background:var(--p-sheet);border:1px solid var(--p-line);border-radius:10px;padding:14px 18px;margin:0 0 1.6em}
article.notes .thread ol{margin:.4em 0 0;padding-left:1.3em}
article.notes .thread li{margin:.25em 0}
article.notes .thread a{color:var(--p-ink);text-decoration:none;font-weight:600}
article.notes .thread span{color:var(--p-muted)}
article.notes details.ch{border-top:1px solid var(--p-line);padding:.2em 0}
article.notes details.ch>summary{cursor:pointer;list-style:none;padding:.8em 0;display:flex;gap:.6em;align-items:baseline}
article.notes details.ch>summary::-webkit-details-marker{display:none}
article.notes details.ch>summary .n{font-family:var(--f-ui);font-size:.7em;font-weight:800;color:var(--p-accent);min-width:1.6em}
article.notes details.ch>summary::after{content:"+";margin-left:auto;font-family:var(--f-ui);color:var(--p-muted)}
article.notes details.ch[open]>summary::after{content:"−"}
article.notes .box{font-size:.93em;border-radius:8px;padding:.85em 1.05em;margin:1.2em 0;background:var(--p-sheet);border:1px solid var(--p-line);border-left:4px solid var(--bx,#888)}
article.notes .box p:last-child{margin-bottom:0}
article.notes .box-t{font-family:var(--f-ui);font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--bx,#888);margin-bottom:.35em}
article.notes .box.def{--bx:#2A47A8}article.notes .box.remember{--bx:#B8322A}article.notes .box.why{--bx:#6B3FA0}
article.notes .box.example{--bx:#1C7A45}article.notes .box.read{--bx:#0E6E80}article.notes .box.exam{--bx:#9A5E08;background:#FFF9EC}
article.notes table{border-collapse:collapse;font-family:var(--f-ui);font-size:.78em;width:100%;margin:1em 0}
article.notes th,article.notes td{border-bottom:1px solid var(--p-line);padding:.5em .6em;text-align:left;vertical-align:top}
article.notes th{background:#F3F0E8}
article.notes .tw{overflow-x:auto}
article.notes figure{margin:1.4em 0}article.notes figure img{border:1px solid var(--p-line);border-radius:6px}
article.notes figcaption{font-size:.85em;color:var(--p-muted);margin-top:.4em}
article.notes code{font-family:var(--f-mono);font-size:.82em;background:#F1EEE6;padding:.08em .35em;border-radius:4px}
article.notes .code{font-family:var(--f-mono);font-size:13.5px;line-height:1.5;background:#F6F4EE;border:1px solid var(--p-line);border-radius:8px;margin:1.2em 0;overflow:hidden}
article.notes .cl{padding:.55em .9em;border-top:1px solid var(--p-line)}
article.notes .cl:first-child{border-top:0}
article.notes .cl pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;color:#1E2026}
article.notes .out{margin-top:.35em;padding:.35em .6em;background:#fff;border-radius:5px;border:1px dashed #D8D2C2;color:#3B3F48}
article.notes .out pre{color:#3B3F48}
article.notes .ty{display:inline-block;font-family:var(--f-ui);font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#E7ECF8;color:#2A47A8;border-radius:4px;padding:0 .45em;margin-bottom:.2em}
article.notes.hide-out .out{filter:blur(6px);cursor:pointer;user-select:none}
article.notes.hide-out .out.peek{filter:none}
article.notes .flow{display:flex;flex-wrap:wrap;gap:.5em;align-items:stretch;font-family:var(--f-ui);font-size:.78em;margin:1.2em 0}
article.notes .flow>div{background:var(--p-sheet);border:1px solid var(--p-line);border-radius:8px;padding:.6em .8em;flex:1 1 140px;position:relative}
article.notes .flow>div b{display:block;color:var(--p-accent)}
article.notes .bars{font-family:var(--f-ui);font-size:.8em;margin:1.2em 0;display:grid;gap:.4em}
article.notes .bars .br{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:.6em;align-items:center}
article.notes .bars .br i{display:block;height:.9em;background:#2A47A8;border-radius:3px}
article.notes .recap{background:var(--p-sheet);border:1px solid var(--p-line);border-radius:10px;padding:1em 1.3em;margin-top:2em}
article.notes .recap h2{margin-bottom:.5em}
article.notes mark.hl{background:var(--p-hl);color:inherit;border-radius:2px;cursor:pointer}
article.notes mark.hl.has-note{box-shadow:inset 0 -2px 0 #C9A400}
article.notes mark.flash{background:#BFD3FF;color:inherit;animation:fl 2.4s ease-out 1}
@keyframes fl{0%{background:#7FA4FF}100%{background:#BFD3FF}}
@media (prefers-reduced-motion:reduce){article.notes mark.flash{animation:none}}
.src-badge{display:inline-flex;font-family:var(--f-ui);font-size:12px;font-weight:700;background:#FBE9D0;color:#8A4D00;border-radius:999px;padding:3px 10px;margin:.3em 0 .6em}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;border-left:1px solid var(--p-line);z-index:110;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.08);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--p-line)}
.drawer .db{flex:1;overflow-y:auto;padding:14px;font-size:14.5px;min-height:0}
.drawer .df{border-top:1px solid var(--p-line);padding:10px 14px;display:flex;gap:8px}
.drawer .df textarea{min-height:42px;flex:1}
.ai{white-space:normal;line-height:1.6}
.ai p{margin:0 0 .7em}
.msg-u{background:#EEF1FA;border-radius:10px;padding:8px 11px;margin:8px 0 8px 30px}
.msg-a{padding:4px 0 8px}
.selpop{position:fixed;z-index:120;display:flex;gap:4px;background:#1E2026;border-radius:8px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.selpop button{background:none;border:0;color:#fff;font-size:13px;font-weight:600;padding:5px 9px;border-radius:5px}
.selpop button:hover{background:#3A3D46}
.hl-note{position:fixed;z-index:120;background:#fff;border:1px solid var(--p-line);border-radius:10px;padding:10px;width:min(320px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.15);display:grid;gap:8px}

/* quiz */
.qz-wrap{max-width:780px;margin:0 auto;padding-block:20px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.segs{display:flex;gap:3px;margin:6px 0 18px}
.segs i{flex:1;height:6px;border-radius:3px;background:#E3DFD4}
.segs i.cur{background:#9AA9D8}.segs i.right{background:var(--p-ok)}.segs i.wrong{background:var(--p-bad)}.segs i.unsure{background:#D9A23A}.segs i.skip{background:#B9B4A8}.segs i.partial{background:#D9A23A}.segs i.ans{background:#6C7AA8}
.qcard{background:#fff;border:1px solid var(--p-line);border-radius:12px;padding:20px}

<script>
"use strict";
/* ===================== utils ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=()=>ymd(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((Date.UTC(...b.split('-').map((v,i)=>i==1?v-1:+v))-Date.UTC(...a.split('-').map((v,i)=>i==1?v-1:+v)))/864e5);
const fmtD=(s,o={day:'numeric',month:'short'})=>s?pd(s).toLocaleDateString('it-IT',o):'—';
const fmtDW=s=>fmtD(s,{weekday:'short',day:'numeric',month:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtMin=m=>m>=60?`${Math.floor(m/60)} h${m%60?' '+m%60+' min':''}`:`${m} min`;
const fmtSec=s=>`${Math.floor(s/60)}:${pad(Math.max(0,s%60|0))}`;
function hashStr(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return (x>>>0).toString(36)}
function txt(html){const d=document.createElement('div');d.innerHTML=html||'';return d.textContent.replace(/\s+/g,' ').trim()}
function md(s){ // tiny, safe markdown for AI answers
  const e=h(s||'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>');
  return e.split(/\n{2,}/).map(b=>{const L=b.split('\n');if(L.every(l=>/^\s*([-•*]|\d+[.)])\s+/.test(l)))return '<ul>'+L.map(l=>'<li>'+l.replace(/^\s*([-•*]|\d+[.)])\s+/,'')+'</li>').join('')+'</ul>';return '<p>'+L.join('<br>')+'</p>'}).join('');
}
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms)}
function math(el){try{window.renderMathInElement&&renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],output:'mathml',throwOnError:false})}catch(e){}}

/* ===================== state ===================== */
const DEF={defaultMinutes:120,baseBlock:25,maxSubjects:3,intervals:[1,3,7],phaseNew:21,phaseReview:7,newMin:45,reviewMin:15,quizMin:15,theme:'system',notesFont:'serif',notesSize:18,notesWidth:68,newCardsPerDay:20,showExcluded:false};
const LV={todo:'Da studiare',class:'Capito in aula',studied:'Studiato',ready:'Pronto'};
const LV_ORDER=['todo','class','studied','ready'];
const WREM={todo:1,class:.7,studied:.35,ready:.1};
const KIND={lesson:'Lezione',guest:'Guest speaker',group:'Lavoro di gruppo'};
const COLS=['courses','lessons','settings','qstate','cardstate','plans','sessions','log','diary','tasks','materials','highlights'];
const S={loaded:false,dbState:'connecting',tab:'panoramica',qcache:{},ncache:{},ui:{}};
COLS.forEach(c=>S[c]={});
let DB=null, SAMPLE=null, ASSETS=null;
const ST=()=>Object.assign({},DEF,S.settings.main||{});

/* ===================== db layer ===================== */
async function initDB(){
  const timer=setTimeout(()=>{if(!S.loaded){S.dbState='slow';S.loaded=true;render()}},10000);
  try{DB=await window.claude?.use?.('db')}catch(e){DB=null}
  if(!DB){clearTimeout(timer);S.dbState='offline';S.loaded=true;render();return}
  const pending=new Set(COLS);
  for(const c of COLS){
    let q=DB.collection(c);
    if(c==='log')q=q.orderBy('at','desc').limit(200);
    q.onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S[c]=m;
      if(pending.delete(c)&&!pending.size){clearTimeout(timer);S.loaded=true;S.dbState='ok'}
      if(!pending.size&&S.dbState!=='ok'){S.dbState='ok'}
      scheduleRender();
    },err=>{console.warn(c,err);pending.delete(c);if(!pending.size){S.loaded=true;clearTimeout(timer)}S.dbState=err.code==='revoked'?'offline':S.dbState;scheduleRender()});
  }
}
function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>v===undefined?null:v))}
async function put(col,id,data){
  (S[col]=S[col]||{})[id]=data;scheduleRender();
  if(!DB)return;
  try{await DB.doc(col+'/'+id).set(clean(data))}catch(e){toast('Salvataggio non riuscito: '+(e.message||e.code))}
}
async function patch(col,id,p){const cur=S[col][id]||{};return put(col,id,Object.assign({},cur,p))}
async function del(col,id){delete S[col][id];scheduleRender();if(DB)try{await DB.doc(col+'/'+id).delete()}catch(e){toast('Eliminazione non riuscita')}}
async function getDoc(col,id){if(!DB)return null;try{const s=await DB.doc(col+'/'+id).get();return s.exists?s.data():null}catch(e){return null}}
async function query(col,field,val){if(!DB)return [];try{const s=await DB.collection(col).where(field,'==',val).limit(1000).get();return s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){return []}}
function log(type,text,courseId){const id=uid();put('log',id,{at:Date.now(),date:TODAY(),type,text,courseId:courseId||null})}

let _rt=null,_pendingRender=false;
function scheduleRender(){clearTimeout(_rt);_rt=setTimeout(()=>{
  const a=document.activeElement;
  if(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){_pendingRender=true;return}
  render();
},60)}
document.addEventListener('focusout',()=>{if(_pendingRender){_pendingRender=false;setTimeout(()=>{const a=document.activeElement;if(!(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();else _pendingRender=true},150)}});

/* ===================== domain ===================== */
const courseList=()=>Object.entries(S.courses).map(([id,c])=>({id,...c})).sort((a,b)=>(a.examDate||'9999').localeCompare(b.examDate||'9999'));
const C=id=>S.courses[id]||{name:'?',color:'#888'};
const cvar=id=>`--c:${h(C(id).color||'#888')}`;
function lessonsOf(cid){return Object.entries(S.lessons).filter(([,l])=>l.courseId===cid).map(([id,l])=>({id,...l})).sort((a,b)=>(a.n||0)-(b.n||0)||(a.date||'').localeCompare(b.date||''))}
const inExam=l=>l.inExam!==false&&l.kind!=='group';
const examLessons=cid=>lessonsOf(cid).filter(inExam);
const L=id=>S.lessons[id];
const lvOf=(l,lv)=>(lv&&lv[l.id]?lv[l.id].level:l.level)||'todo';
function activeFrom(c){const s=c.start||{mode:'now'};
  if(s.mode==='off')return null; if(s.mode==='date')return s.ref||'0000';
  if(s.mode==='after'){const r=S.courses[s.ref];return r&&r.examDate?addDays(r.examDate,1):null}
  return '0000'}
function isActive(cid,date){const c=S.courses[cid];if(!c||!c.examDate)return false;const f=activeFrom(c);return f!==null&&date>=f&&date<=c.examDate}
function phaseOf(c,date){const d=diffDays(date,c.examDate),s=ST();return d>s.phaseNew?'new':d>s.phaseReview?'mix':'review'}
const PHASE={new:'Lezioni nuove',mix:'Nuovo + ripasso',review:'Solo ripasso e quiz'};
function progress(cid,lv){const ls=examLessons(cid);if(!ls.length)return 0;const rem=ls.reduce((s,l)=>s+WREM[lvOf(l,lv)],0);return Math.round((1-rem/ls.length)/(1-WREM.ready)*100)}
function remUnits(cid,lv){return examLessons(cid).reduce((s,l)=>s+WREM[lvOf(l,lv)],0)}
function lastStudied(cid,before){let best=null;for(const p of Object.values(S.plans))if(p.date<before&&(p.items||[]).some(i=>i.courseId===cid&&i.done))if(!best||p.date>best)best=p.date;return best}
const dueQuestions=(date,cid)=>Object.entries(S.qstate).filter(([,s])=>s.due&&s.due<=date&&(!cid||s.courseId===cid)&&isActive(s.courseId,date)).map(([id])=>id);
const dueCards=(date,cid)=>Object.entries(S.cardstate).filter(([,s])=>s.due&&s.due<=date&&(!cid||s.courseId===cid)&&isActive(s.courseId,date)).map(([id])=>id);

function buildPlan(date,minutes,ctx){
  const st=ST(),items=[];let T=minutes;
  ctx.used=ctx.used||new Set();
  if(ctx.pre){
    const q=dueQuestions(date).length,cd=dueCards(date).length;
    const cap=Math.max(10,Math.round(T*.2));let pm=0;
    if(q){const m=Math.max(5,Math.min(cap,Math.ceil(q*1.5/5)*5));items.push({id:'errors',type:'errors',min:m,count:q});pm+=m}
    if(cd){const m=Math.max(5,Math.min(cap,Math.ceil(cd*.4/5)*5));items.push({id:'cards',type:'cards',min:m,count:cd});pm+=m}
    T=Math.max(0,T-pm);
  }
  const cands=Object.keys(S.courses).filter(c=>isActive(c,date)).map(cid=>{
    const c=S.courses[cid],days=Math.max(1,diffDays(date,c.examDate)),rem=remUnits(cid,ctx.lv);
    const last=ctx.hist[cid];let f=1.3;
    if(last){const g=diffDays(last,date);f=g<=1?.8:Math.min(1.8,1+.2*(g-1))}
    return {cid,score:(rem+.5)/days*f,phase:phaseOf(c,date)};
  }).sort((a,b)=>b.score-a.score);
  let sel=cands.slice(0,st.maxSubjects);
  if(!sel.length)return {date,minutes,items};
  const base=st.baseBlock;
  while(sel.length>1&&sel.length*base>T)sel.pop();
  const alloc=sel.map((s,i)=>({...s,min:sel.length===1?T:base+(i===0?T-base*sel.length:0)}));
  for(const a of alloc)items.push(...courseItems(a.cid,a.min,a.phase,date,ctx));
  return {date,minutes,items};
}
function courseItems(cid,M,phase,date,ctx){
  const st=ST(),out=[],lv=ctx.lv;
  const Ls=examLessons(cid).map(l=>Object.assign({},l,lv&&lv[l.id]||{}));
  const avail=l=>!l.date||l.date<=date;
  const due=Ls.filter(l=>l.nextReview&&l.nextReview<=date&&(l.level==='studied'||l.level==='ready')&&!ctx.used.has(l.id));
  const fresh=Ls.filter(l=>(l.level||'todo')==='todo'||l.level==='class').filter(l=>avail(l)&&!ctx.used.has(l.id));
  const extra=Ls.filter(l=>l.level==='studied'&&!ctx.used.has(l.id)&&!due.includes(l)).sort((a,b)=>(a.lastTouched||'').localeCompare(b.lastTouched||''));
  let left=M;
  const add=(type,l,min,extraP={})=>{min=Math.min(Math.round(min),left);if(min<5)return false;out.push({id:uid(),type,courseId:cid,lessonId:l?l.id:null,min,...extraP});left-=min;if(l)ctx.used.add(l.id);return true};
  const newMin=l=>(l.level==='class'?Math.round(st.newMin*.7):st.newMin);
  if(phase==='new'){
    for(const l of due){if(M-left+st.reviewMin>M*.45)break;add('review',l,st.reviewMin)}
    for(const l of fresh){if(left<20)break;add('new',l,newMin(l))}
    for(const l of due){if(left<10)break;if(!ctx.used.has(l.id))add('review',l,st.reviewMin)}
  }else if(phase==='mix'){
    for(const l of due){if(M-left+st.reviewMin>M*.5)break;add('review',l,st.reviewMin)}
    let i=0,j=0,tog=true,guard=0;
    while(left>=10&&guard++<40){
      if(tog&&i<fresh.length)add('new',fresh[i++],newMin(fresh[i-1]));
      else if(j<extra.length)add('review',extra[j++],st.reviewMin);
      else if(i<fresh.length)add('new',fresh[i++],newMin(fresh[i-1]));
      else break; tog=!tog;
    }
  }else{
    add('quiz',null,Math.min(st.quizMin+5,left),{mode:'weak'});
    const R={todo:0,class:1,studied:2,ready:3};
    const pool=Ls.filter(l=>!ctx.used.has(l.id)).sort((a,b)=>R[a.level||'todo']-R[b.level||'todo']||(a.nextReview||'9').localeCompare(b.nextReview||'9')||(a.lastTouched||'').localeCompare(b.lastTouched||''));
    for(const l of pool){if(left<10)break;const first=(l.level||'todo')==='todo'||l.level==='class';add('review',l,first?Math.round(st.newMin*.7):st.reviewMin,first?{first:true}:{})}
  }
  if(left>=10)add('quiz',null,left,{mode:phase==='review'?'mini':'course'});
  else if(left>0&&out.length)out[out.length-1].min+=left;
  return out;
}
function itemEffect(l,type,date){
  const iv=ST().intervals;
  const asNew={level:'studied',rstep:0,nextReview:addDays(date,iv[0]),studiedAt:date,lastTouched:date};
  if(type==='new')return asNew;
  if(type==='review'){
    const lvl=l.level||'todo';
    if(lvl==='todo'||lvl==='class')return asNew;
    if(l.nextReview&&l.nextReview<=date){const step=(l.rstep||0)+1;if(step>=iv.length)return {level:'ready',rstep:step,nextReview:null,lastTouched:date};return {rstep:step,nextReview:addDays(date,iv[step]),lastTouched:date}}
    return {lastTouched:date};
  }
  return null;
}
function lvSnapshot(){const lv={};for(const[id,l]of Object.entries(S.lessons))lv[id]={level:l.level||'todo',rstep:l.rstep||0,nextReview:l.nextReview||null,lastTouched:l.lastTouched||null};return lv}
function histSnapshot(date){const h={};for(const cid of Object.keys(S.courses))h[cid]=lastStudied(cid,date);return h}
function makeTodayPlan(minutes,keepDone){
  const date=TODAY(),prev=S.plans[date];
  const done=keepDone&&prev?(prev.items||[]).filter(i=>i.done):[];
  const used=new Set(done.filter(i=>i.lessonId).map(i=>i.lessonId));
  const doneMin=done.reduce((s,i)=>s+i.min,0);
  const hist=histSnapshot(date);
  const p=buildPlan(date,Math.max(0,minutes-doneMin),{lv:lvSnapshot(),hist,used,pre:true});
  const fresh=p.items.filter(i=>!(i.type==='errors'&&done.some(d=>d.type==='errors'))&&!(i.type==='cards'&&done.some(d=>d.type==='cards')));
  const plan={date,minutes,createdAt:Date.now(),items:[...done,...fresh]};
  put('plans',date,plan);return plan;
}
function simulateWeek(){
  const st=ST(),lv=lvSnapshot(),today=TODAY();const hist=histSnapshot(today);const days=[];
  for(let k=0;k<7;k++){
    const date=addDays(today,k);let items;
    if(k===0&&S.plans[today])items=S.plans[today].items||[];
    else items=buildPlan(date,st.defaultMinutes,{lv,hist,used:new Set(),pre:false}).items;
    const alloc={};
    for(const it of items){if(!it.courseId)continue;alloc[it.courseId]=(alloc[it.courseId]||0)+it.min;
      if(it.lessonId&&!(k===0&&it.done)){const l=lv[it.lessonId];const e=itemEffect(l,it.type,date);if(e)Object.assign(l,e)}
      hist[it.courseId]=date}
    days.push({date,alloc,total:items.reduce((s,i)=>s+i.min,0)});
  }
  return days;
}
function lessonQuizState(lessonId){
  const qs=Object.entries(S.qstate).filter(([,s])=>s.lessonId===lessonId);
  const tot=Object.values(S.qcache).flat().filter(q=>q.lessonId===lessonId).length;
  const ans=qs.filter(([,s])=>s.last&&s.last!=='skip');const right=ans.filter(([,s])=>s.last==='right').length;
  const acc=ans.length?right/ans.length:null;
  const st=!ans.length?0:acc<.5?1:acc<.8?2:3;
  return {answered:ans.length,right,acc,status:st,total:tot};
}
const QST=['Da iniziare','Debole','Quasi','Solida'];
function updateLevelsFromQuiz(lessonIds){
  const date=TODAY();
  for(const id of new Set(lessonIds)){const l=L(id);if(!l)continue;const s=lessonQuizState(id);
    const need=Math.min(5,Math.max(3,s.total||5));
    if(s.answered>=need&&s.acc>=.8&&l.level!=='ready'){patch('lessons',id,{level:'ready',nextReview:null,lastTouched:date});log('level',`${l.title}: Pronto (quiz ${Math.round(s.acc*100)}%)`,l.courseId)}
    else if(s.answered>=3&&s.acc<.5&&l.level==='ready'){patch('lessons',id,{level:'studied',rstep:0,nextReview:addDays(date,1),lastTouched:date});log('level',`${l.title}: torna a Studiato (quiz ${Math.round(s.acc*100)}%)`,l.courseId)}
  }
}
function missingNotes(){const t=TODAY();return Object.entries(S.lessons).map(([id,l])=>({id,...l})).filter(l=>l.kind!=='group'&&(l.inExam!==false||l.kind==='guest')&&l.date&&l.date<=t&&(!l.notes||l.notes==='none')).sort((a,b)=>a.date.localeCompare(b.date))}
const transcriptOnly=()=>Object.entries(S.lessons).map(([id,l])=>({id,...l})).filter(l=>l.notes==='transcript');

/* ===================== views ===================== */
const TABS=[['panoramica','Panoramica'],['piano','Piano di studio'],['materie','Materie'],['appunti','Appunti'],['materiali','Materiali'],['quiz','Quiz'],['flashcard','Flashcard'],['da-caricare','Da caricare'],['diario','Diario e compiti'],['preferenze','Preferenze']];
function renderTabs(){
  const miss=missingNotes().length;
  const cb=$('#coursebar');if(cb)cb.innerHTML=S.loaded?courseList().map(c=>`<button class="cbtn ${S.tab==='materia-'+c.id?'on':''}" data-a="course" data-id="${c.id}" style="${cvar(c.id)}"><span class="sw"></span>${h(c.short||c.name)}<span class="num">${c.examDate&&diffDays(TODAY(),c.examDate)>=0?diffDays(TODAY(),c.examDate)+' gg':''}</span></button>`).join(''):'';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-a="tab" data-k="${k}" ${S.tab===k||(k==='materie'&&S.tab.startsWith('materia-'))?'aria-current="page"':''}>${l}${k==='da-caricare'&&miss?` <span class="badge">${miss}</span>`:''}</button>`).join('');
}
function applyPrefs(){
  const st=ST(),r=document.documentElement;
  if(st.theme==='light'||st.theme==='dark')r.dataset.theme=st.theme;else if(r.dataset.themeOwn){delete r.dataset.theme}
  r.dataset.themeOwn=st.theme!=='system'?'1':'';
  r.style.setProperty('--ns',st.notesSize+'px');r.style.setProperty('--nw',st.notesWidth+'ch');
  r.style.setProperty('--nf',st.notesFont==='sans'?'var(--f-ui)':'var(--f-read)');
}
function render(){
  applyPrefs();
  $('#today-lbl').textContent=fmtD(TODAY(),{weekday:'long',day:'numeric',month:'long'});
  const dot=$('#sync-dot'),lbl=$('#sync-lbl');
  dot.className='dot '+(S.dbState==='ok'?'ok':S.dbState==='connecting'?'':'bad');
  lbl.textContent={ok:'Sincronizzato',connecting:'Connessione…',offline:'Non salvato',slow:'Connessione lenta'}[S.dbState];
  renderTabs();
  const v=$('#view');
  if(!S.loaded){v.innerHTML='<div class="empty">Carico la tua agenda…</div>';return}
  const off=S.dbState==='offline'?'<div class="offline">Il database non è raggiungibile da questa vista: puoi consultare la pagina, ma le modifiche non verranno salvate.</div>':'';
  if(!Object.keys(S.courses).length){v.innerHTML=off+'<div class="empty">Nessun corso ancora. I corsi e le lezioni dei syllabus compariranno qui appena caricati nel database.</div>';return}
  if(S.tab.startsWith('materia-')){const cid=S.tab.slice(8);v.innerHTML=off+vCourse(cid);v.classList.remove('paper','qhome');document.body.style.background='';return}
  const fn={panoramica:vHome,piano:vPlan,materie:vCourses,appunti:vNotes,materiali:vMaterials,quiz:vQuiz,flashcard:vCards,'da-caricare':vMissing,diario:vDiary,preferenze:vPrefs}[S.tab]||vHome;
  v.innerHTML=off+fn();
  if(S.tab==='quiz')v.classList.add('paper','qhome');else v.classList.remove('paper','qhome');
  document.body.style.background=S.tab==='quiz'?'var(--p-bg)':'';
}
function go(tab){S.tab=tab;if(location.hash!=='#'+tab)history.replaceState(null,'','#'+tab);render();window.scrollTo(0,0);if(tab==='quiz'||tab.startsWith('materia-'))loadAllQuestions();if(tab==='flashcard')loadAllNotes()}
const isRoute=k=>TABS.some(t=>t[0]===k)||/^materia-[a-z0-9-]+$/.test(k);

function courseChip(cid){return `<span class="chip c" style="${cvar(cid)}"><span class="sw"></span>${h(C(cid).short||C(cid).name)}</span>`}
function lessonLabel(l){return `L${l.n} · ${h(l.title)}`}

/* ---- Panoramica ---- */
function vHome(){
  const t=TODAY(),cs=courseList();
  const cards=cs.map((c,i)=>{const d=c.examDate?diffDays(t,c.examDate):null;const p=progress(c.id);const act=isActive(c.id,t);
    return `<div class="card cd clickable" style="${cvar(c.id)}" data-a="course" data-id="${c.id}" role="button" tabindex="0" aria-label="Apri ${h(c.name)}">
      <div class="row"><span class="chip">#${i+1} priorità</span>${c.examTentative?'<span class="chip warn">data da confermare</span>':''}${!act?'<span class="chip">fuori dal piano</span>':''}</div>
      <h3>${h(c.name)}</h3>
      <div class="row" style="align-items:baseline"><span class="big num">${d===null?'—':d<0?'✓':d}</span><span class="muted">${d===null?'data non fissata':d<0?'esame passato':d===0?'oggi!':d===1?'giorno · domani':'giorni · '+fmtDW(c.examDate)}</span></div>
      <div class="small muted">${c.examDate&&d>=0?PHASE[phaseOf(c,t)]:''}</div>
      <div class="bar" title="${p}% del programma"><i style="width:${p}%;background:var(--c)"></i></div>
      <div class="small muted num">${p}% del programma · ${examLessons(c.id).filter(l=>l.level==='ready').length}/${examLessons(c.id).length} lezioni pronte</div>
    </div>`}).join('');
  const plan=S.plans[t];
  let planBox;
  if(plan&&plan.items&&plan.items.length){const done=plan.items.filter(i=>i.done);const dm=done.reduce((s,i)=>s+i.min,0);
    planBox=`<div class="row" style="margin-bottom:10px"><span class="big num">${done.length}/${plan.items.length}</span><span class="muted">attività · ${fmtMin(dm)} su ${fmtMin(plan.minutes)}</span></div>${timeBar(plan.items)}
    <div class="list" style="margin-top:8px">${plan.items.filter(i=>!i.done).slice(0,4).map(i=>`<div class="li">${typeTag(i)}<div class="t small">${itemTitle(i)}</div><span class="mins">${i.min}′</span></div>`).join('')||'<div class="li muted">Tutto fatto per oggi.</div>'}</div>`}
  else planBox=`<p class="muted" style="margin-top:0">Il piano di oggi non è ancora stato creato.</p><button class="btn pri" data-a="mkplan">Crea il piano di oggi (${fmtMin(ST().defaultMinutes)})</button>`;
  const miss=missingNotes();
  const missBox=miss.length?`<p style="margin-top:0"><span class="badge">${miss.length}</span> lezioni già fatte senza appunti.</p><div class="list">${miss.slice(-4).reverse().map(l=>`<div class="li">${courseChip(l.courseId)}<div class="t small">${lessonLabel(l)}</div><span class="small muted">${fmtD(l.date)}</span></div>`).join('')}</div><button class="btn sm" data-a="tab" data-k="da-caricare" style="margin-top:8px">Vedi tutte</button>`:'<p class="muted" style="margin:0">Hai mandato gli appunti di tutte le lezioni fatte.</p>';
  const since=Date.now()-7*864e5;
  const news=Object.values(S.log).filter(e=>e.at>=since).sort((a,b)=>b.at-a.at).slice(0,12);
  const tasks=Object.entries(S.tasks).filter(([,x])=>!x.done).sort((a,b)=>(a[1].due||'9').localeCompare(b[1].due||'9')).slice(0,4);
  return `<div class="sec-h"><div><h1>Panoramica</h1><p>Priorità in ordine di data d'esame.</p></div></div>
  <div class="grid g3">${cards}</div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Piano di oggi <span class="sp"></span><button class="btn sm" data-a="tab" data-k="piano">Apri</button></h2>${planBox}</div>
    <div class="card"><h2>Appunti mancanti</h2>${missBox}</div>
    <div class="card"><h2>Novità degli ultimi 7 giorni</h2>${news.length?`<div class="list">${news.map(e=>`<div class="li small">${e.courseId?courseChip(e.courseId):''}<div class="t">${h(e.text)}</div><span class="muted">${fmtD(e.date)}</span></div>`).join('')}</div>`:'<p class="muted" style="margin:0">Niente di nuovo questa settimana.</p>'}</div>
    <div class="card"><h2>Compiti in scadenza <span class="sp"></span><button class="btn sm" data-a="tab" data-k="diario">Tutti</button></h2>${tasks.length?`<div class="list">${tasks.map(([id,x])=>`<div class="li small">${x.courseId?courseChip(x.courseId):''}<div class="t">${h(x.title)}</div><span class="muted">${x.due?fmtD(x.due):''}</span></div>`).join('')}</div>`:'<p class="muted" style="margin:0">Nessun compito aperto.</p>'}</div>
  </div>`;
}
function typeTag(i){return {new:'<span class="tag new">nuovo</span>',review:'<span class="tag review">ripasso</span>',quiz:'<span class="tag quiz">quiz</span>',errors:'<span class="tag err">errori</span>',cards:'<span class="tag quiz">flashcard</span>'}[i.type]||''}
function itemTitle(i){
  if(i.type==='errors')return `<b>Errori dei quiz da rivedere oggi</b> · ${i.count} domande`;
  if(i.type==='cards')return `<b>Flashcard da rivedere oggi</b> · ${i.count} carte`;
  const c=C(i.courseId);
  if(i.type==='quiz')return `${courseChip(i.courseId)} <b>${i.mode==='weak'?'Quiz sui punti deboli':i.mode==='mini'?'Mini-prova a tempo':'Quiz sulla materia'}</b>`;
  const l=L(i.lessonId);if(!l)return courseChip(i.courseId)+' lezione rimossa';
  return `${courseChip(i.courseId)} <b>${lessonLabel(l)}</b>${i.first?' <span class="small muted">· prima lettura</span>':''}${l.notes==='none'||!l.notes?' <span class="small muted">· senza appunti: usa le letture</span>':''}`;
}
function timeBar(items){const tot={};let all=0;for(const i of items){const k=i.courseId||'_';tot[k]=(tot[k]||0)+i.min;all+=i.min}
  if(!all)return '';
  return `<div class="bar" style="height:12px">${Object.entries(tot).map(([k,m])=>`<i title="${h(k==='_'?'Errori e flashcard':C(k).name)} · ${m} min" style="width:${m/all*100}%;background:${k==='_'?'var(--muted)':h(C(k).color)}"></i>`).join('')}</div>
  <div class="row small" style="margin-top:6px">${Object.entries(tot).map(([k,m])=>`<span class="row" style="gap:5px;${k==='_'?'--c:var(--muted)':cvar(k)}"><span class="sw"></span>${h(k==='_'?'Errori/flashcard':C(k).short||C(k).name)} <b class="num">${m}′</b></span>`).join('')}</div>`}

/* ---- Piano ---- */
function vPlan(){
  const t=TODAY(),plan=S.plans[t],st=ST();
  const mins=S.ui.minutes||plan?.minutes||st.defaultMinutes;
  const opts=[];for(let m=30;m<=300;m+=15)opts.push(m);
  const head=`<div class="card"><div class="row"><label class="f" style="flex:1;min-width:220px">Tempo che ho oggi: <b id="min-lbl" style="font-size:16px">${fmtMin(mins)}</b><input type="range" id="min-range" min="30" max="300" step="15" value="${mins}" data-c="minutes" style="width:100%"></label>
    ${plan?`<button class="btn" data-a="recalc">Ricalcola</button>`:`<button class="btn pri" data-a="mkplan">Crea il piano</button>`}</div>
    ${plan&&plan.minutes!==mins?`<p class="small muted" style="margin:6px 0 0">Hai cambiato il tempo: premi Ricalcola per aggiornare il piano (le attività già fatte restano).</p>`:''}</div>`;
  let body;
  if(!plan)body=`<div class="empty">Scegli quanto tempo hai e crea il piano. Resta fisso per tutta la giornata.</div>`;
  else if(!plan.items.length)body=`<div class="empty">Nessuna materia attiva oggi. Controlla "Materie nel piano" qui sotto.</div>`;
  else{
    const pre=plan.items.filter(i=>!i.courseId),rest=plan.items.filter(i=>i.courseId);
    body=`<div class="card"><h2>Piano di ${fmtDW(t)} <span class="sp"></span><span class="small muted num">${fmtMin(plan.items.filter(i=>i.done).reduce((s,i)=>s+i.min,0))} fatti su ${fmtMin(plan.items.reduce((s,i)=>s+i.min,0))}</span></h2>
    ${timeBar(plan.items)}
    ${pre.length?`<h3 style="margin:14px 0 2px" class="small muted">PRIMA DI TUTTO</h3>${pre.map(planRow).join('')}`:''}
    <h3 style="margin:14px 0 2px" class="small muted">PER MATERIA</h3>${rest.map(planRow).join('')}</div>`;
  }
  const week=simulateWeek();
  const weekRows=week.map(d=>`<tr><td class="num" style="white-space:nowrap"><b>${fmtDW(d.date)}</b></td><td><div class="row">${Object.entries(d.alloc).sort((a,b)=>b[1]-a[1]).map(([cid,m])=>`${courseChip(cid)}<span class="num small">${m}′</span>`).join(' ')||'<span class="muted small">—</span>'}</div></td><td class="num">${fmtMin(d.total)}</td></tr>`).join('');
  const phases=courseList().filter(c=>c.examDate&&c.examDate>=t).map(c=>{const ph=phaseOf(c,t);const nx=ph==='new'?['mix',addDays(c.examDate,-st.phaseNew)]:ph==='mix'?['review',addDays(c.examDate,-st.phaseReview)]:null;
    return `<tr><td>${courseChip(c.id)}</td><td>${PHASE[ph]}</td><td>${nx?`${PHASE[nx[0]]} dal <b>${fmtD(nx[1])}</b>`:`esame ${fmtDW(c.examDate)}`}</td></tr>`}).join('');
  const inplan=courseList().map(c=>{const s=c.start||{mode:'now'};const f=activeFrom(c);
    return `<div class="li" style="${cvar(c.id)}"><span class="sw"></span><div class="t"><b>${h(c.name)}</b><div class="small muted">${s.mode==='off'?'Fuori dal piano':f&&f!=='0000'&&f>t?'Entra nel piano dal '+fmtD(f):isActive(c.id,t)?'Nel piano':'Non attivo (esame passato o data mancante)'}</div></div>
    <select data-c="startmode" data-id="${c.id}" aria-label="Quando entra nel piano">
      <option value="now" ${s.mode==='now'?'selected':''}>Da subito</option>
      ${courseList().filter(o=>o.id!==c.id).map(o=>`<option value="after:${o.id}" ${s.mode==='after'&&s.ref===o.id?'selected':''}>Dopo l'esame di ${h(o.short||o.name)}</option>`).join('')}
      <option value="date" ${s.mode==='date'?'selected':''}>Da una data…</option>
      <option value="off" ${s.mode==='off'?'selected':''}>Fuori dal piano</option></select>
    ${s.mode==='date'?`<input type="date" value="${h(s.ref||'')}" data-c="startdate" data-id="${c.id}">`:''}</div>`}).join('');
  return `<div class="sec-h"><div><h1>Piano di studio</h1><p>Prima un blocco per materia attiva, poi il resto alla più urgente. Massimo ${st.maxSubjects} materie al giorno.</p></div></div>
  <div class="grid">${head}${body}
  <div class="grid g2">
   <div class="card"><h2>La settimana</h2><div class="scroll-x"><table class="tbl"><thead><tr><th>Giorno</th><th>Materie</th><th>Tempo</th></tr></thead><tbody>${weekRows}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Stima con ${fmtMin(st.defaultMinutes)} al giorno, supponendo che completi ogni piano.</p></div>
   <div class="card"><h2>Fasi verso l'esame</h2><div class="scroll-x"><table class="tbl"><thead><tr><th>Materia</th><th>Ora</th><th>Prossimo cambio</th></tr></thead><tbody>${phases}</tbody></table></div>
   <p class="small muted" style="margin:8px 0 0">Oltre ${st.phaseNew} giorni: lezioni nuove · da ${st.phaseNew} a ${st.phaseReview}: alterna nuovo e ripasso · ultimi ${st.phaseReview}: solo ripasso e quiz.</p></div>
  </div>
  <div class="card"><h2>Materie nel piano</h2><p class="small muted" style="margin-top:-4px">Prima della data scelta la materia non compare né tra le lezioni né tra gli errori da ripassare.</p><div class="list">${inplan}</div></div>
  </div>`;
}
function planRow(i){
  const actions=i.type==='errors'?`<button class="btn sm" data-a="quiz-start" data-mode="review">Inizia</button>`:i.type==='cards'?`<button class="btn sm" data-a="cards-start">Inizia</button>`:i.type==='quiz'?`<button class="btn sm" data-a="quiz-start" data-mode="${i.mode||'course'}" data-cid="${i.courseId}">Inizia</button>`:i.lessonId?`<button class="btn sm" data-a="read" data-id="${i.lessonId}">Appunti</button>`:'';
  return `<div class="plan-item ${i.done?'done':''}"><button class="ck" data-a="tick" data-id="${i.id}" aria-label="Segna come fatto">${i.done?'✓':''}</button><div class="pt"><div class="row" style="gap:6px">${typeTag(i)}<span>${itemTitle(i)}</span></div></div><span class="mins">${i.min} min</span>${actions}</div>`;
}

/* ---- Materie ---- */
function vCourses(){
  const st=ST();
  return `<div class="sec-h"><div><h1>Materie</h1><p>Livello per lezione: cambialo tu, o si aggiorna con i quiz.</p></div><label class="row small"><input type="checkbox" data-c="showExcluded" ${st.showExcluded?'checked':''}> Mostra lezioni escluse</label></div>
  <div class="grid">${courseList().map(courseBox).join('')}</div>`;
}
function bookBox(cid){
  const books=Object.entries(S.materials).filter(([,m])=>m.courseId===cid&&m.kind==='book').sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));

   ${ASSETS?`<div class="row" style="margin-top:10px"><label class="btn pri sm">+ Carica il libro (PDF)<input type="file" accept="application/pdf" multiple hidden data-c="upload-book" data-id="${cid}"></label><span class="small muted">Max 20 MB per file: se è più grande, dividilo in parti (es. per capitoli) e caricale tutte insieme.</span></div><div id="book-progress-${cid}" class="small" style="margin-top:6px"></div>`:'<p class="small muted">Il caricamento da qui richiede il permesso di modifica della pagina: apri la pagina dal tuo account.</p>'}
  </div>`;
}
function wordBox(cid){
  const docs=Object.entries(S.materials).filter(([,m])=>m.courseId===cid&&m.kind==='word');
  if(!docs.length)return '';
  const stale=m=>{const inc=new Set(m.lessons||[]);const out=new Set();
    lessonsOf(cid).forEach(l=>{if(l.notes&&l.notes!=='none'&&l.kind!=='group'&&m.lessons&&!inc.has(l.id))out.add(l.id)});
    Object.entries(S.log).forEach(([k,e])=>{if(e.type==='notes'&&k.startsWith('notes-')&&(e.at||0)>(m.at||0)){const lid=k.slice(6);if(L(lid)&&L(lid).courseId===cid)out.add(lid)}});
    return [...out].sort((a,b)=>(L(a).n||0)-(L(b).n||0))};
  return `<div class="card" style="${cvar(cid)}"><h2>📄 Appunti in Word <span class="chip">${docs.length}</span></h2><div class="list">${docs.map(([id,m])=>{const st=stale(m);return `<div class="li"><div class="t"><b>${h(m.name)}</b><div class="small muted">${h(m.desc||'')}${m.at?' · aggiornato '+fmtD(new Date(m.at).toISOString().slice(0,10)):''}</div>${st.length?`<div class="small" style="color:var(--danger);font-weight:600;margin-top:3px">⚠ Word da aggiornare: ${st.map(x=>'lezione '+(L(x).n||x)).join(', ')} — scrivimi «aggiorna il Word di ${h(S.courses[cid].name||cid)}»</div>`:'<div class="small" style="color:var(--ok,#2e7d32);margin-top:3px">✓ Allineato agli appunti</div>'}</div><div class="row">${m.pdf?`<a class="btn pri sm" href="${h(m.pdf)}" target="_blank" rel="noopener">Leggi (PDF)</a>`:''}${m.url?`<a class="btn sm" href="${h(m.url)}" target="_blank" rel="noopener">Scarica Word</a>`:''}</div></div>`}).join('')}</div><p class="small muted" style="margin:8px 0 0">Il Word si scarica da GitHub (serve essere collegati al tuo account GitHub).</p></div>`;
}
function vCourse(cid){
  if(!S.courses[cid])return '<div class="empty">Materia non trovata.</div>';
  const c={id:cid,...S.courses[cid]},t=TODAY(),d=c.examDate?diffDays(t,c.examDate):null;
  const ex=examLessons(cid),qs=S.qcache[cid];
  const withNotes=lessonsOf(cid).filter(l=>l.notes&&l.notes!=='none');
  const st=Object.values(S.qstate).filter(s=>s.courseId===cid&&s.last&&s.last!=='skip');const right=st.filter(s=>s.last==='right').length;
  const due=Object.values(S.qstate).filter(s=>s.courseId===cid&&s.due&&s.due<=t).length;
  const mats=Object.values(S.materials).filter(m=>m.courseId===cid);
  const miss=missingNotes().filter(l=>l.courseId===cid).length;
  const head=`<div class="card" style="${cvar(cid)};border-top:4px solid var(--c)">
   <div class="row"><button class="btn sm ghost" data-a="tab" data-k="materie">← Tutte le materie</button></div>
   <h1 style="font-size:24px;letter-spacing:-.02em;margin:6px 0 8px">${h(c.name)}</h1>
   <div class="row small muted">${c.examDate?`Esame <b style="color:var(--ink)">${fmtDW(c.examDate)}</b>`:'Data d\'esame da definire'}${c.examTentative?' <span class="chip warn">da confermare</span>':''}${d!==null&&d>=0?` · <b style="color:var(--ink)" class="num">${d} giorni</b> · ${PHASE[phaseOf(c,t)]}`:''}</div>
   <p class="small" style="margin:6px 0 10px">${h(c.format||'')}</p>
   <div class="grid g3" style="gap:10px;margin-bottom:12px">
     <div><div class="big num">${progress(cid)}%</div><div class="small muted">del programma</div></div>
     <div><div class="big num">${withNotes.length}<span class="muted" style="font-size:16px">/${lessonsOf(cid).filter(l=>l.kind!=='group').length}</span></div><div class="small muted">lezioni con appunti${miss?` · <span style="color:var(--danger)">${miss} da caricare</span>`:''}</div></div>
     <div><div class="big num">${st.length?Math.round(right/st.length*100)+'%':'—'}</div><div class="small muted">risposte giuste ai quiz${qs?' · '+qs.length+' domande':''}</div></div>
   </div>
   <div class="row">
     <button class="btn pri sm" data-a="quiz-start" data-mode="course" data-cid="${cid}" ${qs&&qs.length?'':'disabled'}>Quiz sulla materia</button>
     <button class="btn sm" data-a="quiz-start" data-mode="review" data-cid="${cid}" ${due?'':'disabled'}>Da rivedere (${due})</button>

   ${st.showExcluded&&excl.length?`<details class="fold" data-fold="x${c.id}" ${S.ui['x'+c.id]?'open':''}><summary>Escluse dal programma <span class="chip">${excl.length}</span></summary><div class="list">${excl.map(lessonRow).join('')}</div></details>`:''}

/* ===================== Quiz home ===================== */
async function loadAllQuestions(force){
  const cids=Object.keys(S.courses).filter(c=>force||!S.qcache[c]);
  if(!cids.length)return;
  await Promise.all(cids.map(async c=>{S.qcache[c]=await query('quiz','courseId',c)}));
  if(S.tab==='quiz')render();
}
function ring(pct,color){const r=34,cc=2*Math.PI*r;const v=pct==null?0:pct;
  return `<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="${pct==null?'nessun dato':pct+'% giuste'}"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#E7E3D9" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${h(color)}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${cc*v/100} ${cc}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2026" font-family="Public Sans,sans-serif">${pct==null?'—':pct+'%'}</text></svg>`}
function trend(cid){const ss=Object.values(S.sessions).filter(s=>s.courseId===cid&&s.total).sort((a,b)=>a.at-b.at).slice(-10);
  if(ss.length<2)return `<div class="small muted">Il grafico dell'andamento compare dopo 2 sessioni.</div>`;
  const W=280,H=70,pts=ss.map((s,i)=>[10+i*(W-20)/(ss.length-1),H-8-(s.right/s.total)*(H-18)]);

/* ===================== Quiz runner ===================== */
let QZ=null;
function allQs(){return Object.values(S.qcache).flat()}
function questionsFor(mode,cid,lessonId,ids){
  const t=TODAY();let pool=cid?(S.qcache[cid]||[]):allQs();
  const ok=q=>{const l=L(q.lessonId);return !l||(l.kind!=='group')};
  pool=pool.filter(ok);
  const st=id=>S.qstate[id]||{};
  switch(mode){
    case 'lesson':return pool.filter(q=>q.lessonId===lessonId).sort((a,b)=>(a.order||0)-(b.order||0));
    case 'review':return shuffle(allQs().filter(q=>(!cid||q.courseId===cid)&&st(q.id).due&&st(q.id).due<=t&&(cid||isActive(q.courseId,t))));
    case 'weak':return shuffle(pool.filter(q=>(st(q.id).wrongCount||0)>=2));
    case 'today':return shuffle(allQs().filter(q=>st(q.id).wrongDay===t));
    case 'retry':return ids.map(id=>allQs().find(q=>q.id===id)).filter(Boolean);
    case 'mini':return shuffle(pool.filter(q=>q.type!=='open')).slice(0,10);
    case 'sim':{const c=C(cid);return shuffle(pool).slice(0,c.examQuestions||20)}
    default:return shuffle(pool).slice(0,20);
  }
}
async function startQuiz(mode,cid,lessonId,ids){
  if(!allQs().length||(cid&&!S.qcache[cid]))await loadAllQuestions();
  const list=questionsFor(mode,cid,lessonId,ids);
  if(!list.length){toast('Nessuna domanda disponibile per questa modalità.');return}
  const c=cid?C(cid):{};
  const perQ=Math.max(20,Math.round((c.examMinutes||60)*60/(c.examQuestions||30)));
  QZ={mode,cid,lessonId,list,i:0,ans:{},t0:Date.now(),qt0:Date.now(),stage:'answer',choice:null,text:'',hint:false,
    feedback:!(mode==='mini'||mode==='sim'),perQ:mode==='mini'?perQ:null,limit:mode==='sim'?(c.examMinutes||60)*60:null,ai:{}};
  $('#qz').hidden=false;document.body.style.overflow='hidden';
  clearInterval(QZ.tick);QZ.tick=setInterval(qzTick,1000);
  renderQZ();
}
const MODE_LBL={lesson:'Per lezione',course:'Tutta la materia',review:'Da rivedere',weak:'Punti deboli',mini:'Mini-prova a tempo',sim:"Simulazione d'esame",today:'Errori di oggi',retry:'Rifai quelle da rivedere'};

  else if(QZ.perQ){const left=QZ.perQ-(Date.now()-QZ.qt0)/1000;if(el){el.textContent=fmtSec(left);el.classList.toggle('low',left<10)}if(left<=0){commit('skip');nextQ()}}
  else if(el)el.textContent=fmtSec((Date.now()-QZ.t0)/1000);
}
function segClass(q,i){const a=QZ.ans[q.id];if(i===QZ.i&&QZ.stage!=='end')return 'cur';if(!a)return '';if(!QZ.feedback&&QZ.stage!=='end')return a.res==='skip'?'skip':'ans';return a.res==='right'&&a.sure===false?'unsure':a.res}

      <div class="row">${q.chapter||q.quote?`<button class="btn sm" data-a="qz-reread">Rileggi questo punto della lezione</button>`:''}<span class="sp"></span><button class="btn pri" data-a="qz-next">${QZ.i<QZ.list.length-1?'Prossima':'Vedi i risultati'} <span class="kbd" style="color:inherit;border-color:currentColor">Invio</span></button></div></div>`;
  }

   <div class="qcard"><div class="qtext">${q.q}</div>${body}${fbHTML}</div></div>`;

function openGradeHTML(q,a){
  if(a.res)return `<div class="alert ${a.res==='right'?'ok':a.res==='partial'?'warn':'bad'}">${a.res==='right'?'Giusta':a.res==='partial'?'Parziale':'Sbagliata'}${a.score!=null?` · ${a.score}/10`:''}</div>${a.ai?`<div class="steps ai">${md(a.ai)}</div>`:''}`;

function commit(res,sure){const q=QZ.list[QZ.i];QZ.ans[q.id]={res,sure,choice:QZ.choice,text:QZ.text,secs:Math.round((Date.now()-QZ.qt0)/1000)};if(QZ.feedback&&res!=='pending')recordAnswer(q,res,sure)}
function recordAnswer(q,res,sure){
  const t=TODAY(),iv=ST().intervals;const s=Object.assign({courseId:q.courseId,lessonId:q.lessonId,attempts:0,rightCount:0,wrongCount:0,step:0},S.qstate[q.id]||{});
  s.attempts++;s.lastAt=Date.now();s.lastDate=t;
  if(res==='right'&&sure!==false){s.rightCount++;const wasErr=s.due||['wrong','unsure','partial','skip'].includes(s.last);s.last='right';
    if(wasErr){s.step=(s.step||0)+1;if(s.step>=iv.length){s.due=null;s.step=0}else s.due=addDays(t,iv[s.step])}else s.due=null}
  else if(res==='right'){s.rightCount++;s.last='unsure';s.due=addDays(t,1);s.step=0}
  else if(res==='partial'){s.last='partial';s.due=addDays(t,1);s.step=0}
  else if(res==='skip'){s.last='skip';s.due=addDays(t,1)}
  else{s.wrongCount++;s.last='wrong';s.due=addDays(t,1);s.step=0;s.wrongDay=t;if(sure)s.falseSure=(s.falseSure||0)+1}
  put('qstate',q.id,s);

function nextQ(){if(!QZ)return;if(QZ.i>=QZ.list.length-1){finishQuiz();return}QZ.i++;QZ.stage='answer';QZ.choice=null;QZ.text='';QZ.hint=false;QZ.qt0=Date.now();renderQZ();$('#qz').scrollTo(0,0)}
function finishQuiz(){
  if(!QZ||QZ.stage==='end')return;
  for(const q of QZ.list){if(!QZ.ans[q.id])QZ.ans[q.id]={res:'skip',sure:null}}
  if(!QZ.feedback)for(const q of QZ.list){const a=QZ.ans[q.id];if(a.res!=='pending')recordAnswer(q,a.res,a.sure)}
  QZ.stage='end';QZ.secs=Math.round((Date.now()-QZ.t0)/1000);clearInterval(QZ.tick);
  saveSession();renderQZ();
}
function tally(){const c={right:0,unsure:0,wrong:0,skip:0,partial:0,pending:0};for(const q of QZ.list){const a=QZ.ans[q.id];if(!a)continue;if(a.res==='right'&&a.sure===false)c.unsure++;else{const r=a.res||'pending';c[r]=(c[r]||0)+1}}return c}
function saveSession(){const t=tally(),n=QZ.list.length;const right=t.right+t.unsure;

function findAndWrap(root,needle,mk){
  const nodes=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.parentElement.closest('math,.katex,summary .n,script,style'))continue;nodes.push(n)}
  let flat='';const map=[];let sp=true;
  for(const nd of nodes){const t=nd.nodeValue;for(let i=0;i<t.length;i++){let c=t[i];if(/\s/.test(c)){if(sp)continue;c=' ';sp=true}else sp=false;flat+=c.toLowerCase();map.push([nd,i])}}
  const nd=needle.replace(/\s+/g,' ').trim().toLowerCase();if(!nd)return null;
  let at=flat.indexOf(nd),len=nd.length;
  if(at<0){const pre=nd.slice(0,50);at=flat.indexOf(pre);if(at<0)return null;len=Math.min(nd.length,flat.length-at)}
  const segs=new Map();for(let k=at;k<at+len;k++){const[node,i]=map[k];const s=segs.get(node);if(!s)segs.set(node,[i,i]);else s[1]=i}
  const marks=[];
  for(const[node,[a,b]]of segs){let t=node;if(b+1<t.nodeValue.length)t.splitText(b+1);if(a>0)t=t.splitText(a);if(!t.nodeValue.trim()&&segs.size>1)continue;const m=mk();t.parentNode.insertBefore(m,t);m.appendChild(t);marks.push(m)}
  return marks.length?marks:null;
}

    t.value='';}
  else if(c==='upload'){const f=t.files[0];if(!f||!ASSETS)return;const l=L(id);toast('Carico '+f.name+'…',8000);
    try{const r=await ASSETS.upload(f);const kind=/pdf/i.test(f.type)?(/slide/i.test(f.name)?'slides':'pdf'):/text|vtt|srt/i.test(f.type)||/trascri|transcript/i.test(f.name)?'transcript':/presentation|ppt/i.test(f.type+f.name)?'slides':'other';
      put('materials',uid(),{lessonId:id,courseId:l.courseId,name:f.name,kind,assetId:r.id,url:r.url,at:Date.now()});log('material',`Materiale caricato: ${f.name} (L${l.n})`,l.courseId);toast('Caricato.')}
    catch(err){toast('Caricamento non riuscito: '+(err.message||err.code))}}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click();return}
  if(e.target.closest('input,textarea,select'))return;
  if(QZ&&!$('#qz').hidden){const k=e.key.toLowerCase();
    if(QZ.stage==='answer'){const q=QZ.list[QZ.i];
      if(q.type!=='open'&&'abcdefg'.includes(k)&&k.length===1&&'abcdefg'.indexOf(k)<(q.options||[]).length){QZ.choice='abcdefg'.indexOf(k);renderQZ();e.preventDefault()}
      else if(e.key==='Enter'&&QZ.choice!=null){qzConfirm(true);e.preventDefault()}
      else if(k==='n'&&QZ.choice!=null){qzConfirm(false);e.preventDefault()}
      else if(k==='h'){QZ.hint=true;renderQZ()}}
    else if(QZ.stage==='feedback'&&(e.key==='Enter'||e.key==='ArrowRight')){nextQ();e.preventDefault()}
    return}
  if(FC&&!$('#qz').hidden){if(e.key===' '){e.preventDefault();if(!FC.flip){FC.flip=true;renderFC()}}
    else if(FC.flip&&(e.key==='k'||e.key==='ArrowRight'))fcAnswer(true);else if(FC.flip&&(e.key==='j'||e.key==='ArrowLeft'))fcAnswer(false);return}
  if(e.key==='Escape'){if(!$('#drawer').hidden)closeDrawer();else if(!$('#reader').hidden)ACT['rd-close']()}
});
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(isRoute(k)&&k!==S.tab)go(k)});

/* ===================== boot ===================== */
(function boot(){const k=location.hash.slice(1);if(isRoute(k))S.tab=k;render();
  initDB().then(()=>{if(S.tab==='quiz')loadAllQuestions();if(S.tab==='flashcard')loadAllNotes()});
  window.claude?.use?.('sample').then(s=>{SAMPLE=s;}).catch(()=>{});
  window.claude?.use?.('assets').then(a=>{ASSETS=a;if(S.tab==='materiali')render()}).catch(()=>{});
})();
</script>
