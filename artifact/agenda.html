 Hard to Finance\n- Startups lack collateral; banks will not lend against lines of code\n- High uncertainty makes risk hard to price, so higher interest rates cannot simply offset it\n- Information asymmetry: founders know far more about quality and effort than outsiders\n- Confident founders may prefer debt to keep equity and control, a strategic choice\n\n### Adverse Selection and Moral Hazard\n- Market for lemons (Akerlof): buyer values cars at 10,000 or 5,000, pays 7,500\n    - Good sellers exit, leaving only lemons; founders face the same dynamic before funding\n- Result is underfunding caused by lack of trust, not lack of money\n- Moral hazard after funding: founders may chase vision, lifestyle, or visibility over investor interests\n\n### Signaling and Contracting Theories\n- Valid signals must be observable, costly, and costlier for low-quality entrepreneurs\n    - Examples: keeping equity, building a prototype, paying customers, credible backers\n- Principal agent theory ties incentives to outcomes, e.g. equity and vesting based on thresholds\n- Control theory: since perfect contracts are impossible, investors take board seats, votes, and stage investment\n\n### Bootstrapping\n- Cluster analysis identifies six bootstrapping types, including owner financing, cash cycle, lean assets, subsidies\n    - Shorten cash conversion cycle: less inventory and receivables, more payables\n- Pros: total control and discipline; 70% of entrepreneurial firm failures are attributed to lack of cash\n- Cons: slower growth, hard to raise 50 to 60 million where speed matters\n- Counterexample: Spanx bootstrapped 2000 to 2021, 100% owned, worth over 1 billion"}, "2026-10-07-scaling-baru.md": {"file": "2026-10-07-scaling-baru.md", "title": "The Emergence 7-10 — Scaling, imprinting, Penrose (caso Baru)", "date": "2026-10-07", "wispr": "https://notes.wisprflow.ai/shared/E7farTSbzoLR25hPgzICFhcAvkvqPw0-w0PUZbA1Cew", "body": "Lecture on why scaling ventures is hard: founder imprinting, managerial attention limits (Penrose), and the need to formalize during growth, applied to the Baru pet-services case.\n\n### Defining Scaling\n- Scaling means exceptional growth, ideally output growing faster than inputs; restaurant chains scale poorly.\n- Scaling is a strategic choice; many founders avoid it to keep control.\n    - Only about 3.5% of ~700,000 new US firms grow to large size\n    - OECD: fast growth is 20% yearly over 3 years\n- Class poll: about 66% chose a consolidation year, about 17% expansion; challenges named included hiring and market demand.\n\n### Imprinting and Founder Blueprints\n- Early founding choices become rules, routines and hierarchies that are rarely revisited.\n- Stanford study of 200 tech startups mapped blueprints on attachment, selection, and coordination/control.\n    - Founder blueprint predicts the organization better than current CEO's, though evidence is weak\n    - At 50 employees: 17.1% managers (commitment) vs about 37% (bureaucracy)\n- Study of 167 Silicon Valley startups: founding structure and founder experience strongly predict later executive structure.\n\n### Imprinting in the Baru Case\n- Hourly employee contracts worked early but caused problems once demand grew.\n- Luxury building partnerships benefited buildings, not Baru; concierges lacked incentives and sometimes promoted competitors.\n- Off-the-shelf booking app fell into disuse; contractual social events and luxury service became burdens in new cities.\n\n### Allocation: Managerial Attention (Penrose)\n- Growth is limited by managers' finite attention, since new hires need training in tacit culture and processes.\n- Baru's scarcest resource by summer 2016 was management attention, worsened by founders' maternity leaves and city differences.\n- Evidence: fast growth predicts slower later growth only with high tacitness or geographic expansion.\n- Hiring five managers at once would not help, as training them consumes remaining leadership time.\n\n### Adaptation: Formalization During Growth\n- US internet ventures 1996 to 2001: formalization and administrative intensity correlated with success (correlational).\n- India field experiment with 100 founders: pairing with a formal-management peer improved performance; survival up 10%.\n- Baru formalized via outsourced 24/7 hotline and scheduling, losing personalization; workers became overworked.\n- Students suggested HR leadership and multi-city hires; culture shifted from pet passion to a job."}, "2026-10-14a-how-vc-funds-work.md": {"file": "2026-10-14a-how-vc-funds-work.md", "title": "The Emergence 14-10 (parte 1) — Come funzionano i fondi VC", "date": "2026-10-14", "wispr": "https://notes.wisprflow.ai/shared/f2rmOsx4UngVCnyvQvFyRLokJjqPrGM3CQ69CL5HOHw", "body": "Lecture on how venture capital funds work (fundraising, management fees, carry, exits, follow-ons, LPs) plus European and Italian VC statistics.\n\n### Networking Events\n- Value of events depends on the quality of the network\n- Slush in Helsinki (November) recommended as a top international VC event\n\n### How VC Funds Work\n- VCs must fundraise from LPs before investing; the speaker is currently raising a new fund and calls it a massive pain\n- Cycle: raise, scout deals, negotiate term sheets, manage portfolio, exit; good funds bring 'smart money', crowdfunding is classic 'dumb money'\n- Exits are a full sale or selling secondary shares; secondaries typically sold at a 15 to 20 percent discount\n    - Speaker's funds had three exits; two secondaries at 4.5x to 5.5x, forced by lack of follow-on capital\n- Seed funds deploy capital in 2 to 3 years; venture or growth funds take 6 to 7 years\n\n### Fund Economics: 2 and 20\n- Management fees of about 2% of AUM per year cover operations; carry is 20% of profits after returning LP capital plus hurdle rate\n- Partners and principals typically put in 1 to 2% of the fund themselves, sometimes via loans, to access carry\n- Classic seed split: 55 to 60 percent new investments, 40 to 45 percent follow-ons into winners\n    - Follow-ons are where funds make most of their money, hence the push for hockey-stick growth\n- Example fund (Partech) grew from about 40 to 500 million AUM with 12 to 13 people to about 3.5 billion with 60 people\n\n### LPs, Deal Flow and Founder Advice\n- LP types: institutional (e.g. Cassa Depositi e Prestiti), pension funds, family offices, corporates seeking tech and acquisition targets\n- Italian pension funds rarely invest in VC due to tax framework and weak exit track record\n- Funds say no 98 to 99% of the time: about 3,000 to 4,000 deals seen, 30 to 40 investments per year\n- Judge VCs by how quickly and clearly they say no; avoid giving away too much equity out of desperation\n\n### European and Italian VC Landscape\n- Europe 2025: 69 billion, 46% below 2021 and 3.4 times smaller than the US; 61% linked to AI/ML\n- Italy 2025: 1.7 billion over 434 rounds, 80% seed and pre-seed, versus UK 10 to 11 billion, France about 8 billion, Spain 3.5 billion\n- Italy 2026: 1.3 billion by end of September, skewed by one 234 million round; expected 1.8 to 1.9 billion\n- International investors in 65% of amount but only 30% of rounds; Italy needs stronger deal flow to attract them"}, "2026-10-14b-comfort-zone.md": {"file": "2026-10-14b-comfort-zone.md", "title": "The Emergence 14-10 (parte 2) — Comfort zone e mindset (Robert Capa)", "date": "2026-10-14", "wispr": "https://notes.wisprflow.ai/shared/4T5ok844gCpXvZNq9Klx-h804rv-drMZmSvYWsM-arY", "body": "Lecture on working inside versus outside the comfort zone, using war photographer Robert Capa as a parallel for founders: get close, take reasonable risks, keep expanding your comfort zone.\n\n### Comfort Zone Basics\n- Comfort zone means low effort, low stress and low risk, but rarely exciting results or career growth\n- Staying comfortable is fine in some life phases, leaving more time for family, health and hobbies\n- Leaving it brings new skills, novelty and earning potential, but also greater risk of loss\n\n### Robert Capa as Case Study\n- Born Endre Friedmann in Budapest, 1913; fled to Paris and reinvented himself as a war photographer\n- D-Day Omaha Beach photo: he landed ahead of soldiers, back to enemy fire, shooting a manual Leica\n- Blurry shots became the book 'Slightly Out of Focus'; the photo is the tip of the iceberg of preparation\n- Died stepping on a landmine minutes after his last photo in Indochina; risk grows with what you put in\n\n### Lessons for Founders\n- 'If your pictures aren't good enough, you're not close enough': stay close to your market\n- Comfort zone should grow daily; aim to become comfortable with being uncomfortable\n- Example: founders handling a lawsuit from driving schools without crumbling\n- Half measures rarely build great companies; co-founders should not have side gigs\n\n### Q&A and Personal Example\n- Pushing past discomfort (e.g. job applications that feel out of reach) always pays off\n- Speaker got a fund principal role by approaching the managing partner right after an LP meeting\n- Most people projecting genius are good at self-presentation; research roles to judge real fit\n- Balance humility and confidence; avoid crossing into cockiness"}, "2026-11-02a-guest-scaleup-strategy.md": {"file": "2026-11-02a-guest-scaleup-strategy.md", "title": "The Emergence 02-11 (guest, parte 1) — Strategia di scale-up", "date": "2026-11-02", "wispr": "https://notes.wisprflow.ai/shared/eKclCcGQVakFTMPjk-IhHGqx3jgH1pla4Vo1rRfeH8Y", "body": "Guest lecture by Vittorio on scaling up growth-stage companies, using a hypothetical 100 million revenue internal-communications SaaS case to debate investment timing, Microsoft and AI risk, organization, and sales.\n\n### Framing: Growth Investing and the Case\n- Speaker drew on consulting, a scale-up that became Vodafone, government, and now growth private equity (not venture).\n    - Agenda: scale-up strategy, organization and team, expansion (geography, product, adjacencies), financing\n- Growth stage: significant revenue (50 to 300-400 million), little debt, a defensible moat, judged by the rule of 40.\n    - Rule of 40 = revenue growth % + EBITDA margin %; rule of 20-25 needs a fix\n- Case: internal-comms SaaS, 10 years old, 2 founders, 700 people, 100 million revenue, break-even, 10-15% growth (rule of 15).\n    - 50% Europe, 40% USA; integrated web, email and app; less than a euro per seat per month\n\n### Timing, Adoption and Moat\n- Key questions: when it will deliver, cost, financing, adoption speed, and whether there is a real moat.\n    - Free-to-premium works for some products, others never monetize if free\n- Growth deals have models and data, but tech evolution and adoption remain uncertain; expert calls often polarized.\n- Examples: level 4 driverless cars, robotaxis likely a mixed human/robot fleet given peak-hour capital cost.\n- Mis-estimated adoption: Spotify underestimated, Duolingo up then down, Revolut, Peloton lost 95%, Match, Zoom lacked a moat.\n    - Competitive disruption: Novo Nordisk vs Eli Lilly, Tesla vs BYD, China in autonomy\n\n### Case Debate: Category Leader vs Microsoft Risk\n- Bull view: integrated product defines the category; focused founders out-execute a distracted Microsoft.\n- Bear view: Microsoft could easily add the feature or give it free, as happened to Zoom.\n- Only about 10-15% of students said they would invest at this stage.\n\n### Organization and Culture in Scale-ups\n- Startup phase needs adventurers and risk takers; growth phase needs curious planners with business cases.\n    - Expect and accept healthy conflict between the two cultures; keep the DNA\n- Wireless Logic left 15 acquired CEOs independent, causing product complexity; now centralizing the product plan.\n- At Vodafone: 70-30 split of common plan vs local innovation; M-Pesa in Kenya.\n    - A separate low-cost brand unit in Milan failed when corporate functions blocked it\n- Sustained scale-up culture is rare; some large firms (Microsoft, Google, JP Morgan) do it reasonably.\n\n### Case Debate: AI, Sales and the Buyer\n- AI split views: better targeted content vs easy replication by customers or cheap competitors.\n    - Survivors: systems of record, and products where building in-house is uneconomic for mid-size firms\n- At under a euro per seat, a 1,000-person firm pays about 8,000 to 12,000 euros per year, so building in-house rarely pays.\n- \"Data must have legs\": analytics matter only with a strong salesforce acting on them.\n- Decision maker unclear: HR favors engagement, IT resists complexity, internal comms may defer to Microsoft."}, "2026-11-02b-guest-growth-paths.md": {"file": "2026-11-02b-guest-growth-paths.md", "title": "The Emergence 02-11 (guest, parte 2) — Percorsi di crescita, funding, exit", "date": "2026-11-02", "wispr": "https://notes.wisprflow.ai/shared/8kn8gE_zdhKXRwfdWGHIE2ok2puICo5x97Qb-kJHqc4", "body": "Guest lecture (part 2) on scale-up growth paths (geography, product, adjacencies), funding choices and exits, using a live SaaS case later revealed as the speaker's own company, plus leadership traits.\n\n### Three Growth Paths and Their Traps\n- Growth options: new geographies, product extensions, or adjacent businesses (e.g. restaurant to hotel)\n- Geography checks: business model, local competitors, hiring/culture, channels, regulation; Europe is often a trap\n- Product extension needs research budget and engineering cost; selling to a new buyer can double commercial cost\n- Adjacencies can destroy value, but work when channels or technology platform are shared\n\n### Portfolio Examples\n- French health-booking firm (likely Doctolib) struggled in Italy, succeeded in Germany\n    - Italian doctors paid fixed per patient, not per appointment; small practices; private hospitals refused to share slots\n- Phone refurbisher (Back Market) moving into e-bikes added repair and logistics complexity, limited success\n- Wireless Logic moved from IoT to travel eSIMs: same core competence and channel, very successful\n\n### Class Debate on the SaaS Case\n- Ideas: improve product and sales funnel; expand to Southeast Asia, Latin America, Africa at low cost\n- Software travels at near zero cost, but sales channels, agents and commissions are not free\n- Adding HR or task management risks competing with SAP and Microsoft and doing many things poorly\n- Internal comms consulting seen as promising since process is not proprietary; custom builds don't scale (compared to Celonis)\n\n### Funding Rounds and Exits\n- Highest valuation is fine only for a last round; a later down round hurts stock-option hiring\n- Few large vs many small investors: control and network vs governance complexity; no single right answer\n- Cost of capital: equity 15-20%, debt 8-9%, hybrid 12-13%; equity buys expertise and dry powder\n- Exits: IPO, trade sale, roll-up, leverage, dividends; founder secondary sales signal confidence levels\n\n### Case Reveal and Leadership Traits\n- Case company: Staffbase (CEO Martin Böhringer); the speaker is chairman\n    - Cut staff via AI, consolidator in sector, IPO paused, active in Europe, US, Asia-Pacific\n- Student exit votes: M&A consolidation, sell to Microsoft, fix business structure and sales\n- Successful leaders: product perfectionists, non-dogmatic on strategy, people-focused, medium-term vision\n- Keep 'listening antennas': read widely and spend lots of time with team and partners"}, "2026-11-04a-cost-of-fundraising-pmf.md": {"file": "2026-11-04a-cost-of-fundraising-pmf.md", "title": "The Emergence 04-11 (parte 1) — Costi del fundraising e product-market fit", "date": "2026-11-04", "wispr": "https://notes.wisprflow.ai/shared/RwpoBKa1XI7FgjZK-pXpnpBuYu26g-2cQXNQHayaJDY", "body": "Why fundraising should not be a founder's first priority: updated Italian/European VC figures, costs of raising (dilution, lost autonomy), VC-backed vs bootstrapped, and reaching product-market fit first.\n\n### VC Market Update\n- Italy near 1.7 billion invested by end of October 2026, possibly a first 2 billion euro year\n- Amount invested rising but number of rounds falling as seed-stage companies mature into Series A\n    - Risk: fewer seed rounds may not feed the funnel of future companies\n- Europe's largest 2026 rounds (e.g. Mistral AI, 3 billion euro) dwarfed by US 444 billion euro vs Europe 68, Asia 102\n- Open question: should Europe focus on strengths like robotics, life sciences, deep tech rather than core AI and software?\n\n### The Real Cost of Fundraising\n- Raising money is not a measure of success; Mailchimp, GitHub, Basecamp, Notion grew bootstrapped for years\n- Raising means dilution, and high valuations raise down-round risk at the next round\n- Formal autonomy loss: voting vs equity, veto rights, drag/tag-along, protective provisions on debt, board seats from Series A\n    - Tag-along protects minority investors; drag-along lets majority force a full sale\n    - Speaker's fund: A shares hold all votes; C shares may own 60% with no votes\n- Informal loss: scaling pressure, constant reporting, obligation to spend raised money, time-consuming investor relations\n    - Prefer fewer, larger investors; pre-brief board members so meetings just formalize decisions\n\n### VC-Backed vs Bootstrapped\n- VC-backed firms grow at all costs, burn cash, chase next rounds and plan exits; bootstrapped aim for profit from day one and full control\n    - Example: speaker's fund exited via secondary sale at 30% discount, about 4.5x in three years\n- VCs increasingly also want sustainable business models; good companies succeed either way\n- Banks look for bootstrapped qualities; some VCs now offer venture debt alongside equity\n- Fundraising is slow (about 100 emails per investment), distracts from running the business, and feedback must be filtered systematically\n\n### Before Fundraising: Team and Users\n- Startups begin confused about product, customers and revenue (Dave McClure quote)\n- Team: transparent talks on roles and commitment, fair cap table, vesting (1-year cliff, 25%, then to 100% over 4 years), obsession with execution, focus\n- Users: build something few users love (Sam Altman); use open, unbiased interview questions and iterate quickly with an MVP\n- Loving users become free ambassadors and reveal willingness to pay\n\n### Product-Market Fit and Metrics\n- Product-market fit: about 40% of users would be very disappointed if the product disappeared (Sean Ellis test, cited with Lean Startup)\n- Key metrics: NPS (0-6 detractors, 7-8 neutral/passives, 9-10 promoters), organic traffic, retention/churn, paying users, LTV/CAC\n    - Churned users give the most valuable feedback; indifferent churn is a bad sign\n- Right metrics change by stage, and product-market fit is temporary as markets, laws and competitors shift\n- Building a product differs from building a company; founders must shift from product manager to business manager"}, "2026-11-04b-fundraising-prep.md": {"file": "2026-11-04b-fundraising-prep.md", "title": "The Emergence 04-11 (parte 2) — Preparare il fundraising, casi Notion/Patreon", "date": "2026-11-04", "wispr": "https://notes.wisprflow.ai/shared/dqOmmYAD0j9C97DW-R4s62h8X1M_MDYhtX4AA_D8PDM", "body": "Fundraising preparation (investor updates, pitch deck, one-pager, data room, pitching), followed by a breakout where students presented early-stage histories of Notion, Patreon and others.\n\n### Preparing to Fundraise\n- Send warm contacts a short, regular update (monthly to quarterly) with real milestones: features, clients, key hires.\n    - Signals momentum and organization, helps you land one of the ~10 investor meetings\n- Target funds by sector and stage; sending a software deck to a life science fund wastes everyone's time.\n- Pitch deck must be very concise and clear; investors see thousands each year, so deep homework is needed behind it.\n- Prepare a one-pager: team, market, need, product and solution, traction, cap table.\n\n### Data Room, Momentum and Pitching\n- A data room is a well-structured folder: contracts, patents, financials, pipeline, office leases. Have it ready before fundraising.\n- Delaying key documents kills investor momentum; aim to share the data room the same or next day when asked.\n- Practice the pitch in a mirror, on video, and with honest friends; be confident, not cocky.\n\n### Course Assessment (from side discussion)\n- Group assignment is a PDF memo with up to 5 exhibits, no slides required.\n- **Group work 40%, exam 60%; participation gives up to 1.5 bonus points.**\n\n### Breakout: Company Case Studies\n- Notion: friends as team and users, burned 2 million, rebuilt in Japan, then raised 10 million (2019), 50 million (2020), 275 (2021).\n    - Lesson: friends give biased feedback and are not the target users\n- Patreon (Jack Conte, Sam Yam): grew via YouTube, seed of about 2.5 million after five months; first 40 creators emailed rejected them.\n- Psychology service for expats via Facebook groups: bootstrapped 2019, 150,000 euro in 2020, 17 million in 2023.\n- A coffee chain tested one shop as a lab for seven months, profitable from early shops, later raised from General Atlantic.\n\n### Closing Takeaways\n- Fundraising should not be the first priority; solve a problem, build team, know users and product first.\n- Raising money means giving away equity, autonomy and time.\n- Product market fit is measurable: NPS, retention, churn; track the one number that matters now.\n- Use warm intros and build investor relationships even when not raising."}}, "materials": [{"file": "syllabus-emergence.pdf", "kind": "reading", "topic": null, "size": 241098, "chars": 8551, "uploadedAt": "2026-11-04T18:17:26.941Z", "text": "[Pagina 1]\n21077 – THE EMERGENCE OF ENTREPRENEURIAL\nVENTURES: THEORY AND PRACTICE\nCOURSE SYLLABUS A.Y. 2026-2027\nClass 27\nInstructors: Profs Cédric Gutierrez (cedric.gutierrez@unibocconi.it) and Nico Valenti Gatto\n(nico.valentigatto@unibocconi.it)\nDates Hours Room\nSeptember 7 – November 23 13.45-16.15 (Mon) N37\n10:15-12:45 (Wed) N39\nFor the exact schedule, please see “Schedule / Course Content.”\nFor all teaching material, please see: http://blackboard.unibocconi.it.\nCourse objectives\nEntrepreneurship is one of the major drivers of economic growth, technological innovation,\nand social transformation. This foundational course offers a rigorous, research-based\nunderstanding of entrepreneurship. It addresses a set of core questions: who becomes an\nentrepreneur, and why; how entrepreneurs exercise judgment under uncertainty; how ideas\nbecome opportunities; what strategic choices shape the trajectory of ventures; and how\nventures attract customers, raise resources, grow, and exit.\nThe course deliberately combines theory and practice. Each session reviews the main\ntheoretical traditions and the most relevant recent empirical evidence on a given aspect of\nentrepreneurship and applies them to the discussion of real entrepreneurial cases.\nAs the first entrepreneurship course of the INTENT master, its goal is not to teach you how to\nwrite a detailed business plan but to give you the conceptual foundations and the evidence-\nbased posture you will need to interrogate entrepreneurial decisions throughout the program\nand your career.\nBy the end of the course, you will be able to:\n• explain who becomes a successful entrepreneur, and why;\n• compare frameworks for entrepreneurial action under uncertainty;\n• define entrepreneurial opportunities and explain their drivers and the role of the\nindividual–opportunity nexus;\n• explain the role of entrepreneurial hypotheses and their testing;\n• compare different types of entrepreneurial strategy;\n• describe the key elements of a business model and explain how ventures create and\ncapture value;\n• analyze the dynamics of founding teams, including trade-offs in co-founder choice, role\nallocation, and equity;\n• identify the main sources and stages of entrepreneurial finance and assess their\nimplications for control and growth;\n• identify the drivers, paths, and challenges of venture growth.\n\n[Pagina 2]\nCourse format and style\nThe course leverages a blend of methods aimed at complementing each other and\noptimizing the learning experience:\n• Lectures review the main theoretical traditions and the most relevant recent empirical\nevidence for each topic and use them to test common intuitions about entrepreneurship.\n• Case discussions complement the lectures: most sessions discuss a real\nentrepreneurial situation that students analyze.\n• Guest-speaker talks expose students to the lived experience of accomplished\nentrepreneurs and investors, treated as “living cases” that students interrogate with the\nframeworks learnt in class.\n• A collaborative team assignment lets students put the course’s frameworks into\npractice by evaluating a real start-up on the main dimensions covered in the course.\nCourse materials\nAll course materials will be distributed through Blackboard. The list of readings is provided at\nthe beginning of the course and is available to all students, including non-attending students;\ncopyright-protected readings can be accessed through the University Library’s reserve\nservice. Slides and any additional materials used in class are made available to all students\nthrough Blackboard.\nThere is no single required textbook; a useful companion for several sessions is J. Gans, E.\nScott & S. Stern, Entrepreneurship: Choice and Strategy (W. W. Norton, 2024).\n\n[Pagina 3]\nSchedule / Course Content\nThe instructors reserve the right to change readings and schedule at any time during the\ncourse. The order of classes may also be subject to changes.\nN Date Time Contents Support material Instructor\n1 07-\nSep\n13.45-\n16.15\nIntroduction. The returns to\nentrepreneurship. GUTIERREZ\n2 09-\nSep\n10.15-\n12.45\nEntrepreneurial judgment and action:\ndeciding under uncertainty. GUTIERREZ\n3 14-\nSep\n13.45-\n16.15 Entrepreneurial opportunities. Case study:\nEmbrace GUTIERREZ\n4 16-\nSep\n10.15-\n12.45 Entrepreneurial strategy. GUTIERREZ\n5 21-\nSep\n13.45-\n16.15\nCustomers and business models. Case study:\nRent the Runway GUTIERREZ\n6 23-\nSept\n10.15-\n12.45 From problem to business model. VALENTI\n7 28-\nSept\n13.45-\n16.15 Founding teams. Case study:\nOckham GUTIERREZ\n8 30-\nSept\n10.15-\n12.45 Co-founders & founder prenups. VALENTI\n9 05-\nOct\n13.45-\n16.15 Financing entrepreneurial ventures. Case study:\nJibo GUTIERREZ\n10 07-\nOct\n10.15-\n12.45 Scaling and exit. Case study:\nBaroo GUTIERREZ\n11 12-\nOct\n13.45-\n16.15\nThe industry and the mindset. VALENTI\n12 28-\nOct\n10:15-\n12:45\nBuilding before you raise. VALENTI\n13 04-\nNov\n10.15-\n12.45 COLAO\n14 11-\nNov\n10.15-\n12.45 COLAO\n15 18-\nNov\n10.15-\n12.45\nThe geography of entrepreneurship. GUTIERREZ\n16 23-\nNov\n13.45-\n16.15 Social entrepreneurship & wrap up. Case study:\nSababa GUTIERREZ\n\n[Pagina 4]\nGrading\nThe assessment combines an individual written exam with a collaborative team assignment.\nYour final grade is determined as follows:\nA. Individual written exam 60%\nB. Group project 40%\nC. Class participation up to 1 bonus point\nPoints earned for each component are weighted and summed to obtain a total score for the\ncourse. An overview of each component follows.\nA. Individual written exam (60%)\nThe final exam will include a mix of open- and close-ended questions covering the main\nconcepts discussed in class, for a total of 30 points. Sample questions will be discussed in\nclass and posted on Blackboard.\nB. Group project (40%)\nIn self-formed teams, you evaluate a real start-up on the main dimensions covered in the\ncourse (e.g., opportunity, business model, strategy, founding team, financing, and growth).\nThe assignment tests your ability to apply the theoretical perspectives learnt in the course to\nreal ventures, to critically evaluate entrepreneurial ideas, business models, and strategic\nchoices, and to communicate structured analytical reasoning. The output is a written memo.\nC. Class participation (up to 1 bonus point)\nClass discussion is a central part of the learning experience, and you can earn one bonus\npoint for consistent and high-quality participation.\nNon-attending students\nNon-attending students are evaluated solely on an individual written exam, consisting of\nopen and/or closed questions on the main concepts of the course (slides, cases, and\nreadings), for a total of 30 points.\nCourse office\nDepartment of Management and Technology — Via Röntgen 1, 4th floor.\nStudents should contact the course office only for scheduling and registration problems,\nthrough the Help&Contact procedure in you@B. Please notify the instructors as well.\nYour instructors\nCédric Gutierrez is Professor of Strategic Management at Bocconi University, which he\njoined in September 2017. He received his PhD in Strategy from HEC Paris.\nNico Valenti Gatto is the Chief Executive Officer at Tech Europe Foundation Fund.\nOffice hours\nBoth professors will hold office hours by appointment during the semester.\nPlease send an email to “book” a slot during the office hours along with the focus of the\nmeeting. Office hours can be attended in groups or individually.\n\n[Pagina 5]\nNorms of behavior\nTo have a productive class, we kindly ask you to respect the following:\n• Please limit the use of hand-held devices during class. This policy is based on research\ndocumenting their effect on you and on your classmates.\n• Communicating with the instructors: please do not send the same request to each of us\nseparately. Choose the one whose class it relates to, or cc all of us.\n• Class representative — please use your class rep to share points of concern, confusion,\nand satisfaction; we find it helpful when they gather feedback from the class.\n• Re-grading policy: for any re-grading request, we expect a written memo explaining why\nthe work earned a higher score. If we agree there is cause for re-grading, we will re-\ngrade the whole work, which may change the grades of other parts as well.\nUniversità Bocconi conceives of education as an ongoing process that stretches across a\nperson’s entire professional life and asks the whole community to respect the values of\nfairness and correctness that inspire its shared mission. We encourage all students to read\nthe Bocconi University Honor Code, published at http://www.unibocconi.eu/honorcode."}]}, {"id": "corporate-venturing", "name": "Corporate Venturing and Innovation Strategy", "short": "CV", "code": "21074", "color": "#d97706", "professors": "Verona · Mignini · Corbella", "scope": "Programma completo. Lettura di riferimento: Shane S.A. (capitoli indicati per sessione) + casi HBS.", "exam": {"date": "2026-12-11", "label": "Final written exam (anche 25 gennaio)", "format": "Esame scritto individuale, domande aperte e/o chiuse."}, "assessment": ["30% class participation (di gruppo, cold call)", "20% group work", "50% final written exam"], "topics": [{"n": 1, "date": "2026-09-08", "title": "Industrial Revolutions and Development (Schumpeter, Dosi)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 2, "date": "2026-09-10", "title": "Why Innovation and Corporate Entrepreneurship are crucial (McKinsey, Mokyr, Draghi)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 3, "date": "2026-09-15", "title": "Corporate R&D Strategy (case: Merck & Pfizer; Shane ch.4)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 4, "date": "2026-09-17", "title": "Emergence of Dominant Designs (case: Responding to the Wii?; Abernathy-Utterback; Shane ch.2)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 5, "date": "2026-09-22", "title": "The role of demand: adoption dynamics and lead users (von Hippel; Shane ch.3)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 6, "date": "2026-09-24", "title": "Inertia of te": "2026-11-17", "title": "Group work check", "lectures": [], "kind": "group", "status": "active"}, {"n": 20, "date": "2026-11-24", "title": "Creativity (Raffaelli: Watches)", "lectures": [], "kind": "lesson", "status": "active"}, {"n": 21, "date": "2026-11-26", "title": "Guest speaker", "lectures": [], "kind": "guest", "status": "active"}, {"n": 22, "date": "2026-12-01", "title": "Group work presentations", "lectures": [], "kind": "group", "status": "active"}, {"n": 23, "date": "2026-12-01", "title": "Group work presentations", "lectures": [], "kind": "group", "status": "active"}, {"n": 24, "date": "2026-12-03", "title": "Wrap up and takeaways", "lectures": [], "kind": "lesson", "status": "active"}], "order": 2, "cfu": 6, "quiz": {"2026-10-01-guest-deutsche-bank.md": [{"type": "mc", "q": "Cosa intende Deutsche Bank con 'global housebank'?", "options": ["Una banca che offre solo mutui", "Essere la banca di riferimento del cliente ovunque, consigliandolo in modo proattivo", "Una banca senza filiali", "Una banca centrale"], "answer": [1], "explain": "Si accompagna il cliente dal private banking al corporate banking man mano che l'impresa cresce e si internazionalizza."}, {"type": "mc", "q": "Quali sono le tre raccomandazioni del relatore per gestire il rischio reputazionale?", "options": ["Dire sempre la verità, standard etici massimi, trattare la comunicazione come una professione seria con esperti", "Negare, minimizzare, attendere", "Cambiare nome, logo e sede", "Aumentare i dividendi"], "answer": [0], "explain": "La reputazione è come un castello di carte: lenta da costruire, rapida da distruggere."}, {"type": "open", "q": "Cosa significa 'glocalization'? Spiega con gli esempi Starbucks e Pizza Hut in Cina.", "answer": "Portata globale con forte adattamento locale. Starbucks fallì in Cina esportando un modello standard; Pizza Hut ebbe successo adattando l'offerta ai gusti locali."}], "2026-10-06-snam-ambidexterity.md": [{"type": "mc", "q": "Cos'è l'ambidexterity organizzativa (Tushman & O'Reilly)?", "options": ["Saper usare due tecnologie", "Un'organizzazione duale capace di sfruttare il business esistente (exploitation) ed esplorare il nuovo (exploration) contemporaneamente", "Delocalizzare la produzione", "Avere due CEO"], "answer": [1], "explain": "Serve perché i cambi di paradigma distruggono competenze e disallineano incentivi (es. venditori Kodak contro il digitale)."}, {"type": "mc", "q": "Quali sono le due opzioni per esplorare il nuovo citate nel caso SNAM?", "options": ["'Make' con un'unità di sviluppo separata (es. SNAMTEC, Plenitude) o 'buy' tramite corporate venture/acquisizioni", "Aumentare le tariffe o ridurre i costi", "Quotarsi o delistarsi", "Esternalizzare tutto"], "answer": [0], "explain": "Esempi: IBM EBO, P&G, Amplifon X, Apple-Beats, Microsoft-OpenAI."}, {"type": "mc", "q": "Perché SNAM si è separata da Eni intorno al 2012?", "options": ["Per una crisi finanziaria", "Per la regolazione di unbundling (separazione rete da produzione/vendita)", "Per entrare nel nucleare", "Per volontà degli azionisti esteri"], "answer": [1], "explain": "Analogia con le telecom: contenuti, rete e retail separati."}, {"type": "open", "q": "Quali raccomandazioni strategiche avresti dato al gruppo SNAM dopo lo shock del gas ucraino? Collega la risposta al concetto di ambidexterity.", "answer": "Priorità alla sicurezza: continuare a investire in trasporto, rigassificazione e stoccaggio (vantaggio storico = exploitation); consolidare una rete europea di corridoi; mettere a stadi (milestone) le scommesse su idrogeno e transizione, scalando solo con domanda reale (exploration); sfruttare lo spostamento culturale verso una struttura più piatta e mantenere un'unità separata per l'esplorazione."}], "2026-10-13-amazon-barnes-noble.md": [{"type": "mc", "q": "Perché Bezos scelse i libri come prima categoria?", "options": ["Margini altissimi", "Nessun 'gorilla da 800 libbre' (Borders + B&N ~14%), enorme numero di titoli, prodotti standardizzati", "Era appassionato di letteratura", "I libri non hanno resi"], "answer": [1], "explain": "Modello 'sell all, carry few': 1 milione di titoli listati, ~2.000 in stock; resi ~2%."}, {"type": "mc", "q": "Perché barnesandnoble.com non ha funzionato?", "options": ["Mancanza di fondi", "Tenuto separato per motivi fiscali e poco spinto per paura di cannibalizzazione e per gli incentivi dei manager di negozio", "La tecnologia era vietata", "Amazon aveva un brevetto sull'e-commerce"], "answer": [1], "explain": "Opportunità perse: ritiro in negozio, attaccare Ingram (punto debole di Amazon)."}, {"type": "mc", "q": "Qual è la lezione teorica principale del caso?", "options": ["Le capabilities sono 'sticky': l'ambidexterity da sola non basta, servono dynamic capabilities e agilità (Teece)", "Il first mover vince sempre", "Il prezzo è l'unica leva", "Meglio non innovare"], "answer": [0], "explain": "Collegamento a Teece et al. (dynamic capabilities) e O'Reilly-Tushman."}, {"type": "open", "q": "L'industria del libro pre-internet era 'buona' o 'cattiva'? Argomenta con dati e struttura della filiera.", "answer": "Mercato 26 mld → 33 mld, in crescita, ma margini bassi (wholesaler ~1,5% netto, B&N ~2-2,5%), domanda concentrata in Q4 e difficile da prevedere, 50.000 nuovi titoli l'anno, resi ~30% degli hardcover che raddoppiano i costi di spedizione, editori concentrati (top 20 = 88%), barriere all'entrata alte, concorrenza di TV/film/videogiochi. Verdetto: discreta per i player dominanti, poco attraente per gli altri."}], "2026-10-15-guest-engie.md": [{"type": "mc", "q": "Quali sono i tre obiettivi della transizione energetica secondo la relatrice?", "options": ["Decarbonizzazione, affordability, sicurezza dell'approvvigionamento", "Nucleare, gas, carbone", "Profitto, crescita, dividendi", "Solare, eolico, idroelettrico"], "answer": [0], "explain": "Il cosiddetto trilemma energetico."}, {"type": "mc", "q": "Perché i prezzi dell'energia in Italia sono più alti della media europea?", "options": ["L'Italia importa il 95% del gas e il prezzo dell'elettricità è fissato dal gas", "Troppe rinnovabili", "Tasse sul carbone", "Il nucleare è costoso"], "answer": [0], "explain": "Prezzi strutturalmente 'higher for longer'."}, {"type": "open", "q": "Spiega cos'è un PPA usando il caso Heineken/Ichnusa.", "answer": "Power Purchase Agreement: contratto di fornitura di energia (spesso rinnovabile) a prezzo fisso di lungo periodo. Heineken: ~9 MW di fotovoltaico in Sardegna vicino all'impianto Ichnusa; 45% autoconsumato (on-site) copre il sito; 55% inviato a un sito del nord a prezzo flat per 10 anni (off-site). Match produzione-domanda dal 40% al 75% aggiungendo eolico e storage."}], "2026-10-29-red-bull.md": [{"type": "mc", "q": "Perché Red Bull andò male nei test di gusto iniziali?", "options": ["Il prodotto era davvero cattivo", "Fu testato da solo, mentre l'uso reale era come mixer con superalcolici nei locali", "Il prezzo era troppo alto", "Il packaging era sbagliato"], "answer": [1], "explain": "Lezione: replicare la situazione d'uso reale. Il 98% dei lanci di beni di consumo fallisce."}, {"type": "mc", "q": "Quali leve ha usato Red Bull per evitare lo scontro frontale con Coca-Cola?", "options": ["Canale on-premise (bar, club) con studenti come venditori", "Prezzo super premium (3-4 volte Coca-Cola)", "Sampling nelle università, atleti ed eventi estremi", "Massiccia pubblicità TV nella grande distribuzione"], "answer": [0, 1, 2], "explain": "Strategia di nicchia 'judo/jiu-jitsu': concentrare le forze su un punto debole del competitor più forte."}, {"type": "mc", "q": "Come ha attaccato Monster Red Bull?", "options": ["Lattina 2X allo stesso prezzo di $2, segmento socioeconomico più basso, ampia gamma per conquistare gli scaffali della GDO", "Con un prezzo più alto", "Copiando il canale dei club", "Comprando Red Bull"], "answer": [0], "explain": "Monster ha usato contro Red Bull la stessa logica di nicchia, nel canale (supermercati) dove Red Bull non era."}, {"type": "open", "q": "Quali opzioni aveva Red Bull per rispondere a Monster e quali erano da evitare? Motiva.", "answer": "Buone: restare premium e disciplinata, innovare prodotti, nuovi formati (occasioni d'uso, efficienza di linea), special edition, produrre negli USA per entrare nel retail; acquisire Monster era l'opzione ovvia mancata (Coca-Cola ha preso una quota). Da evitare: entrare nelle cole (mossa 'più stupida') e abbassare i prezzi (guerra di prezzo lose-lose, distruggerebbe il brand)."}], "2026-11-03-tesla.md": [{"type": "mc", "q": "Perché il P/E di 444 di Tesla poteva essere giustificato?", "options": ["Per gli utili correnti", "Solo se Tesla diventa il dominant design: la valutazione riflette pure aspettative", "Per gli asset fisici", "Per i dividendi"], "answer": [1], "explain": "Market cap per auto prodotta ~$300.000 vs case tradizionali. Il dominant design si riconosce solo ex post."}, {"type": "mc", "q": "Quali semplificazioni del business model ha introdotto Tesla?", "options": ["Vendita diretta online senza concessionari", "Prezzo non negoziabile e cancellazione gratuita", "Aggiornamenti software OTA", "Forti investimenti in pubblicità TV"], "answer": [0, 1, 2], "explain": "Poca pubblicità TV: Musk, passaparola e stunt."}, {"type": "mc", "q": "Cosa insegna il Roadster?", "options": ["Successo di marketing ma disastro commerciale: mai fare retrofit di un'auto a combustione, costruire da zero", "Che le auto elettriche non funzionano", "Che il lusso è l'unico mercato", "Che bisogna usare concessionari"], "answer": [0], "explain": "Poi Model S, Model X e Model 3 (35.000$) per attraversare il chasm verso la early majority."}, {"type": "open", "q": "Spiega il concetto di 'crossing the chasm' applicato a Tesla e perché l'open-sourcing dei brevetti è coerente con la strategia.", "answer": "Il chasm (Moore) è il salto tra early adopter e early majority: serve prezzo e prestazioni competitive. Tesla ha cambiato la percezione (auto elettrica non = golf cart) con Roadster e Model S/X premium, poi Model 3 a 35k ha raggiunto la early majority. Aprire i brevetti porta altri produttori sullo standard Tesla, aumentando la probabilità che diventi il dominant design (e superando barriere come infrastruttura di ricarica)."}]}, "lectures": {"2026-10-01-guest-deutsche-bank.md": {"file": "2026-10-01-guest-deutsche-bank.md", "title": "CV 1-10 — Guest speaker Deutsche Bank (housebank e rischio reputazionale)", "date": "2026-10-01", "wispr": "https://notes.wisprflow.ai/shared/Z3Kv2uy4intD1saDZcSQZc_uomXaK-W52PqFb8kByw8", "body": "Deutsche Bank guest lecture on the bank's global housebank strategy, a worked example of a client's banking journey, and hard-won lessons on reputational risk, followed by Q&A on compliance, cyber, fintech, and hiring.\n\n### Global Economic Context & DB Strategy\n- World shifted from US dominance (close to 40% of GDP) to a multipolar setup with China resurgent; Europe still central to trade corridors.\n- Demographics, AI, climate and geopolitical events are reshaping the landscape where DB's strategy begins.\n- DB operates in 80-82 countries, pursuing 'glocalization': global reach with strong local adaptation.\n    - Starbucks failed in China by exporting a standard model; Pizza Hut succeeded by adapting.\n- Italy is DB's second largest European market after Germany, with close to 3,000 employees and a branch network.\n\n### Global Housebank Concept & Client Journey\n- 'Global housebank' means being the client's reference bank everywhere, proactively advising rather than waiting.\n- Illustrative journey of a client and his company: from private banking to corporate banking as the firm grows and internationalises.\n- Expansion needs pull in cross-border payments, FX hedging, credit facilities vetted by Credit Risk Management, and M&A advisory with fiduciary/trust services.\n- Capital markets division builds bespoke securities for sophisticated clients; wealth management handles succession and family continuity.\n\n### Reputation & Reputational Risk\n- Reputation is the collective opinion others hold; fragile like a house of cards, slow to build and quick to destroy.\n- DB case: 2011 sale of EUR 8bn Italian BTPs, Frankfurt HQ tax raid, 2015 first loss, IMF/Fed labelling DB the most systemic risk.\n    - Stock price collapsed, ratings downgraded, bank came close to default.\n- Other cases cited: Theranos/Elizabeth Holmes, Volkswagen emissions, Chiara Ferragni, Burger King's Women's Day post.\n- Three recommendations: always tell the truth, stick to the highest ethical standards, treat communication as a serious profession and get expert help.\n\n### Q&A Highlights\n- EU compliance: post-2015 zero-tolerance helped DB recover but now caps returns.\n- Cyber: the real 'big one' hasn't hit yet; defence requires cross-industry and public-private alliances; most incidents stem from people, not IT.\n- COVID: DB never took government money, relying on its liquidity buffer; bank failures are driven by liquidity, not losses.\n- Fintechs vs big tech: Revolut and similar may be crushed once Apple/Google/Amazon enter.\n\n### Innovation, Growth & Hiring\n- Banking product innovation is limited; most spend goes into smarter delivery and internal tools. Insurance has more room to innovate.\n- Growth strategy varies by division: hire bankers in wealth management, M&A in asset management, capital allocation in investment banking.\n- DB hires for potential (handling complexity in group simulations) and ability to manage change, citing JP Morgan as the benchmark."}, "2026-10-06-snam-ambidexterity.md": {"file": "2026-10-06-snam-ambidexterity.md", "title": "CV 6-10 — Caso SNAM e ambidexterity", "date": "2026-10-06", "wispr": "https://notes.wisprflow.ai/shared/qiBJsTWLTGFi24dlFhg85cPplX52Wy4JHhGTaRMuSF8", "body": "Class discussion of the SNAM case: energy industry structure, SNAM's history and diversification, group strategy recommendations after the Ukraine gas shock, and ambidextrous organization as the key lesson.\n\n### Energy Industry Fundamentals\n- Energy fuels factories (GDP) and households (heating, electricity), so price shocks hit the whole economy.\n- Sources: fossil fuels, nuclear, renewables (wind, hydro, solar), hydrogen, biomethane, carbon capture.\n- Renewables are weather and context dependent and hard to store; Spain and southern Italy suit them better.\n- Fossil infrastructure is centralized and supply-side; emerging sources are decentralized, demand-side, and modular.\n\n### SNAM History and Diversification\n- SNAM grew inside Eni as the gas transport network arm across Italy, Europe, and North Africa.\n- Went public around 2001 and separated from Eni around 2012 due to unbundling regulation.\n    - Analogy: content, network, and retail separated as in telecom (TIM, Vodafone, Fastweb)\n- Diversified via a biomethane subsidiary, Renovit for energy efficiency, hydrogen stakes, and CCS with Eni near Ravenna.\n- SNAMTEC open innovation unit built digital and AI tools, including a digital twin of Italy's network.\n\n### Group Recommendations After the Ukraine Gas Shock\n- Prioritize security: keep investing in transport, regasification, and storage, SNAM's historic advantage.\n- Consolidate a connected European corridor network.\n- Stage hydrogen and other transition bets with milestones; scale only when real demand appears.\n- Leverage the cultural shift to flatter structure and keep a separate unit for exploration.\n\n### Organizational Ambidexterity\n- Paradigm shifts destroy competencies and misalign incentives, as with Kodak's salespeople resisting digital.\n- Tushman and O'Reilly argue for a dual organization exploiting and exploring at once.\n- Two options: 'make' via a separate development unit (SNAMTEC, Plenitude) or 'buy' via corporate venture.\n- Examples: IBM's EBO (Emerging Business Opportunities) unit, Procter & Gamble, Amplifon X, Apple buying Beats, Microsoft and OpenAI.\n\n### Regulation Q&A\n- Regulation gives direction but removes price control and adds bureaucracy; neither purely an advantage nor a cost."}, "2026-10-13-amazon-barnes-noble.md": {"file": "2026-10-13-amazon-barnes-noble.md", "title": "CV 13-10 — Caso Amazon vs Barnes & Noble (dynamic capabilities)", "date": "2026-10-13", "wispr": "https://notes.wisprflow.ai/shared/T4oI5pXWbNUHakgrpkZ8nBb3KzvNLst0fI_2WSdJ2ww", "body": "Class discussion of the Amazon case: groups analyzed the pre-internet book retail industry, Barnes & Noble's capabilities, Amazon's entry strategy and B&N's failed online response, concluding with sticky capabilities and dynamic capabilities.\n\n### Book Retail Industry: Good or Bad?\n- Market worth 26 billion, expected to reach 33 billion; demand peaks in Q4 and is hard to predict\n    - 50,000 new titles yearly, about a million titles in stock\n- Publishers: about 40,000, but top 20 hold 88% share; author royalties around 10 to 15%\n- Wholesalers (Ingram over 50%, Baker and Taylor) existed to serve small mom-and-pop stores; net margin about 1.5%\n    - Returns around 30% of hardcovers, doubling shipping costs\n- Verdict: decent, growing industry for dominant players, but low margins, high entry barriers and competition from TV, films, video games\n\n### Barnes & Noble's Capabilities\n- Largest US book retailer, about 2.5 billion sales, roughly 2 to 2.5% net margin, superstore format\n- Key capabilities: centralized procurement and warehousing, experiential marketing (cafes, Starbucks, events), IT for logistics\n    - Average purchase $20 vs $10 at independent stores\n- Real estate finance mattered: long-term leases kept invested capital near 600 million instead of $3 billion\n\n### Amazon's Entry Strategy\n- Bezos targeted the internet (web growth about 2,000% per year); books were a way in, chosen from about 20 categories\n- Books fit: no 800-pound gorilla (Borders plus B&N about 14%), huge title count, standardized products\n    - 'Sell all, carry few': list 1 million titles, own about 2,000; return rate about 2%\n- Software-centric firm: 80% of software spend on back office, managers with computer backgrounds, based in Seattle for tech talent\n- Key trick: securing supply from Ingram, a wholesaler in decline seeking new channels\n\n### Barnes & Noble's Reaction and Takeaways\n- barnesandnoble.com was kept separate for tax reasons and underpushed due to cannibalization fears and store manager incentives\n- Missed opportunities: in-store pickup, attacking Ingram as Amazon's weak point\n- **Lesson: capabilities are sticky; ambidexterity alone is not enough, firms need dynamic capabilities and agility** (Teece et al.)\n- Second part of the course, on innovation strategy, starts end of October"}, "2026-10-15-guest-engie.md": {"file": "2026-10-15-guest-engie.md", "title": "CV 15-10 — Guest speaker ENGIE (transizione energetica, PPA)", "date": "2026-10-15", "wispr": "https://notes.wisprflow.ai/shared/1jEwc_iVoUSa118O5kq80Bc739CVncl2L_bR_gbsKdo", "body": "Guest lecture by the CEO of ENGIE Italy on geopolitics, Italy's high energy prices, the energy transition, and PPAs as a concrete solution, followed by Q&A.\n\n### Company Overview\n- French CAC 40 company, moved from coal to gas in the 60s and into renewables in the 90s\n    - Present in 30 countries; 90,000 people, 8.8 billion EBIT, 57 gigawatt installed renewable capacity\n- Energy transition now means three goals: decarbonization, affordability, and security of supply\n- Shifting in the last five years from gas networks to power infrastructure; resilient portfolio seen as key to agility\n- Exiting Belgian nuclear assets to the Belgian state, since nuclear needs huge investment and carries high operational risk\n\n### Geopolitics and Italian Energy Prices\n- Defocusing from North America because the US government changed rules, removing investment stability\n- Italy imports 95% of gas and power is priced by gas, so prices sit well above the European average\n- Prices are now structurally \"higher for longer\", breaking existing business plan assumptions\n- European elections pushing energy toward state control and regulation, which the speaker views negatively\n\n### Strategy: Electrification, Flexibility, Grid\n- Core focus for the next five years: electrification, flexibility (BESS storage), and power grids\n- In Italy, over 500 megawatts of BESS already authorized; medium BESS of 3 to 5 megawatts now possible on site\n- Renewables produced in the south, consumed in the industrial north, so efficient transmission is critical\n    - Spain's six-hour blackout cited as a grid management lesson\n- Gas remains necessary for now; aim is to shift molecules toward green gas such as biomethane\n\n### Decarbonization Trends, Barriers and AI\n- Fit for 55 targets are lagging in every stream; 2025 was the first year emissions rose instead of fell\n- Energy efficiency is underrated; data center waste heat linked to district heating cited as an example\n- AI is already here: managers have AI coaches and finance asked for 9% lower costs from 2029 in the plan\n- Data center growth limited by grid connections and permitting\n\n### PPA Example and Q&A\n- Heineken case: about 9 MW PV in Sardinia near Ichnusa plant, with on-site and offsite PPAs\n    - 45% self-consumed covers the site fully; 55% sent to a northern site at a flat 10-year price\n    - Current 40% production-demand match targeted to reach 75% by adding wind and storage\n- Similar PPAs exist with Amazon and Google for green power at flat prices\n- Speaker expects EU decarbonization targets to be slowed and extended, as happened with automotive"}, "2026-10-29-red-bull.md": {"file": "2026-10-29-red-bull.md", "title": "CV 29-10 — Caso Red Bull (Sustaining Innovation)", "date": "2026-10-29", "wispr": "https://notes.wisprflow.ai/shared/Uv8CIBlJquM_Al_FKG27RpFdu3HFgZsnJ8XXz2uxwUE", "body": "Class discussion of the Red Bull case: how Red Bull beat Coke through a coherent niche strategy, how Monster did the same to Red Bull, and what Red Bull should do next.\n\n### Red Bull Origins and the Failed Taste Test\n- Company founded 1984 with rights to the Asian product except Thailand; launched in Austria in 1987.\n    - 1987 revenues were 1.1 million against 1.4 million spent on advertising\n- Product tested badly because it was tested alone, while real use was as a mixer with spirits in clubs.\n    - Lesson: replicate the real usage situation, or the test is wrong\n- 98% of new consumer goods launches fail; heavy testing often serves management to cover themselves with shareholders.\n    - Tests work for quantifiable products (detergent, paint), poorly for taste or style\n- Broke even in '99; founder's key skill was salesmanship and building trust to keep raising money.\n\n### Red Bull's Coherent Niche Strategy vs Coke\n- Soft drink market was 170 billion in 1995, growing about 1.5% per year, highly concentrated: unattractive for entrants.\n- Levers: sampling to universities, super premium price (3 to 4 times Coke), athletes and extreme events.\n    - Kept producing in Austria to support scarcity and premium image despite shipping costs\n- Focused on on-premise channel (clubs, bars) sold by students: cheaper and more credible than a sales force.\n    - Bars hold few mixers and the channel is minor for Coke, so Coke could not leverage its strength\n- Principle: avoid head-on fights with stronger players (Coke US ad budget 1.6 billion); concentrate force on a weak point (\"judo/jiu-jitsu strategy\").\n\n### Monster's Response to Red Bull\n- Entered California in 2002: 2X the size at the same $2 price, targeting a lower socioeconomic segment.\n- Wide product range needed to win shelf space in supermarkets, the channel Red Bull was not in; third-party US production kept costs competitive.\n- Big players like Coke deprioritize energy drinks when fighting Pepsi; acquisitions fail when buyers meddle in marketing and sales (e.g. Grom).\n- Sales growing slower than volume shows Monster discounting heavily; the category is price sensitive.\n\n### Options for Red Bull\n- Ideas: keep premium and disciplined, innovate products, new formats, special editions, produce in the US to enter retail.\n- Formats drive occasion of use, reduce gaps when product runs out at home, and can improve line efficiency.\n- Entering the cola segment was called the most stupid move; lowering price to fight Monster would destroy the company.\n- Acquiring Monster was the obvious missed option; Coke bought a stake instead.\n\n### Takeaways\n- Tactics matter, but a strong brand value proposition is needed to last; imitation is a menace, not flattery.\n- Price wars are lose-lose; only consumers win.\n- Jiu-jitsu niche strategies can be used against you too; pick moves the bigger competitor struggles to follow."}, "2026-11-03-tesla.md": {"file": "2026-11-03-tesla.md", "title": "CV 03-11 — Caso Tesla (Delivering Innovation)", "date": "2026-11-03", "wispr": "https://notes.wisprflow.ai/shared/nmqE1KxjtunX1nhaPURS83IA-CKJMUurM6GKjBKOPb0", "body": "Tesla case: company valuation methods, how expectations drive Tesla's valuation, its simplified business model, crossing the chasm with Model 3, and a shift toward Optimus humanoids.\n\n### Valuing a Company\n- Two common methods: discounted cash flow and multiples (e.g. 8 to 10x EBITDA for a segment)\n    - Buyers pay below DCF value (e.g. 80 vs 100) to cover risk, since forecasts are rarely right\n- Multiples suit established markets and companies; DCF is hard to apply to new tech startups\n- Calculation is the least important part; what matters is the hypotheses driving the numbers\n    - Key question: how do you actually win 10 market share points, not how to model its P&L impact\n\n### Tesla Valuation Driven by Expectations\n- In 2020 GM, Ford and Chrysler made far more cars yet were worth less than Tesla's market cap\n- Valuation reflects pure expectation: belief that electric is the future and Tesla is a tech/data company\n- Back-of-envelope: Tesla market cap per car produced was almost $300,000\n- P/E of 444 means centuries to recoup; only sustainable if Tesla becomes the dominant design\n\n### Market Barriers and Tesla's Business Model\n- Automotive barriers: capex, production, R&D, logistics, marketing, dealerships and service network\n    - Unlike software, scaling needs full factory capacity\n- Tesla's simplifications: direct online sales, no dealerships, no-haggle and free cancellation, web-centered communication\n    - Little TV advertising; relied on Elon Musk, word of mouth and stunts\n- OTA software updates remove need for dealers to upgrade cars and support vehicle service\n- Open-sourcing patents aims to bring others on board so Tesla becomes the dominant design\n\n### Innovation Strategy and Crossing the Chasm\n- First challenge: change the perception of electric cars as slow, low-range golf carts\n- Roadster was a marketing success but a commercial disaster; lesson: never retrofit an ICE car, build from scratch\n- Crossing the chasm (Moore) needs competitive price and performance: Model S, premium Model X, then Model 3\n- Model 3, starting at 35,000, reached the early majority and democratized electric cars\n\n### Outlook: China, Energy and Optimus\n- Chinese EVs cost less than half of comparable European or US cars\n- Grid and renewable energy shortfalls limit wider EV adoption\n- Tesla dropped a Model 3 production line to build Optimus, using its car data to train the humanoid\n- **Dominant design is only identifiable ex post**; hydrogen, electric and AI still compete\n- Next: November 10th covers Disney's acquisition of Pixar"}}, "materials": [{"file": "syllabus-corporate-venturing.pdf", "kind": "reading", "topic": null, "size": 115121, "chars": 13777, "uploadedAt": "2026-11-04T18:17:27.001Z", "text": "[Pagina 1]\nSYLLABUS 2026/2027\n21074 CORPORATE VENTURING AND INNOVATION\nSTRATEGY\nClasse impartita in lingua inglese\nPrograms: INTENT (6 crediti - I sem. - OB | 6 cfu - ECON-07/A)\nClass: 27 (I sem.)\nDepartment: Management and Technology\nCourse director: GIANMARIO VERONA\nClasse 27\nGIULIA CORBELLA\nDepartment of Management and Technology\nUniversità Bocconi, Milan, Italy\ngiulia.corbella@unibocconi.it\nLUCA MIGNINI\nDepartment of Management and Technology\nUniversità Bocconi, Milan, Italy\nluca.mignini@unibocconi.it\nGIANMARIO VERONA\nDepartment of Management and Technology\nUniversità Bocconi, Milan, Italy\ngianmario.verona@unibocconi.it\nAttenzione! Il programma di seguito riportato è da considerarsi valido SOLO per l'anno accademico 2026/2027.\nMISSION\nThe course develops student’s understanding of how firms use technology and innovation to\nposition themselves strategically, from the perspective of a Director of R&D, Corporate\nDevelopment, and Corporate Venturing. It pays specific attention to the AI transformation which\nis impacting all industries in the recent years. For this purpose, it relies heavily on cases and\nexamples, dealing with firms which have faced the challenges of managing innovation,\ntechnology strategy, and the digital transformation. Students are asked to actively participate in\nclass discussions to confront the implications of technology and innovation on a firm’s strategy\nand to understand actions and reactions by Executives of Business Development when\ntechnology and innovation originate within the firm as well as when they change exogenously\nthe environment where the firm operates.\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 1/12\n\n[Pagina 2]\nSYLLABUS 2026/2027\nCOURSE CONTENT DETAILED - SCHEDULE\n- INTENT cl. 27\nSession Date Topic Material Instructor\n1 8 Sept\n2:45-4:15 pm\nIndustrial\nRevolutions and\nthe emerging AI\nrevolution\nSchumpeter\nJ., The Theory of\nEconomic\nDevelopment\nhttps://cruel.org/b\nooks/hy/shortsch\numpeter/Schump\neterTheoryofEcon\nDev.pdf\nDosi\nG., Research\nPolicy\nhttp://sjbae.pbwor\nks.com/w/file/fetc\nh/38055602/dosi_\n1982.pdf\nVERONA &\nMIGNINI\n2 10 Sept\n4:30-6:00 pm\nFrom Theory to\nPractice: Why\nInnovation and\nCorporate\nEntrepreneurship\nare Crucial\nMcKinsey Report\nhttps://www.mcki\nnsey.com/capabili\nties/tech-and-ai/o\nur-insights/tech-fo\nrward/state-of-ai-t\nrust-in-2026-shifti\nng-to-the-agentic-\nera\nMokyr J., Vickers\nC., and Ziebarth\nN.L., Journal of\nEconomic\nPerspectives\nhttps://pubs.aeaw\neb.org/doi/pdfplus\n/10.1257/jep.29.3.\n31\nDraghi M., The\nVERONA\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 2/12\n\n[Pagina 3]\nSYLLABUS 2026/2027\nfuture of\nEuropean\ncompetitiveness\nhttps://commissio\nn.europa.eu/docu\nment/download/9\n7e481fd-2dc3-41\n2d-be4c-f152a82\n32961_en?filena\nme=The%20futur\ne%20of%20Euro\npean%20competit\niveness%20_%20\nA%20competitive\nness%20strategy\n%20for%20Europ\ne.pdf\n3 15 Sept\n2:45-4:15 pm\nCorporate R&D Strategy in the\ntwenty-first\ncentury\npharmaceutical\nindustry: Merck &\nCo. and Pfizer\nInc.\n[HBS 9707509]\nArora A. et\nal., Strategic\nManagement\nJournal\nhttps://sms.onlinel\nibrary.wiley.com/d\noi/full/10.1002/sm\nj.2693\nShane S.A.,\nChapter 4\nVERONA\n4 17 Sept\n4:30-6:00 pm\nEmergence of\nDominant\nDesigns\nResponding to\nthe Wii?\n[HBS 9709448]\nVERONA\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 3/12\n\n[Pagina 4]\nSYLLABUS 2026/2027\nAbernathy W.J.\nand Utterback\nJ.M., MIT Review\nhttps://teaching.u\np.edu/bus580/bps\n/Abernathy%20an\nd%20Utterback%\n2C%201978.pdf\nShane S.A.,\nChapter 2\n5 22 Sept\n2:45-4:15 pm\nThe role of\ndemand:\nAdoption\ndynamics and\nLead Users\nVon Hippel\nE., Democratizing\nInnovation\nhttps://web.mit.ed\nu/evhippel/www/b\nooks/DI/DemocIn\nn.pdf\nShane S.A.,\nChapter 3\nVERONA\n6 24 Sept\n4:30-6:00 pm\nInertia of\ncompetences,\norganizations,\nand industrial\nsystems\nKodak and the\ndigital revolution\n(A)\n[HBS 9705448]\nChristensen\nC.M., The\nInnovator’s\nDilemma\nhttps://rudyct.com\n/InovBis/The%20I\nnnovator’s%20Di\nlemma%20(Clayt\non%20M.%20Chr\nistensen)2000.pdf\nVERONA\n7 29 Sept\n2:45-4:15 pm\nGroup work kick-\noff\nMIGNINI\n8 1 Oct Guest Speaker* VERONA\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 4/12\n\n[Pagina 5]\nSYLLABUS 2026/2027\n8:30-10:00 am\n9 6 Oct\n2:45-4:15 pm\nAmbidexterity and\nCorporate\nventuring and\ndevelopment\nSNAM Case\n[SDA Bocconi]\nTushman M. et\nal., Industrial and\nCorporate\nChange\nhttps://academic.\noup.com/icc/articl\ne-abstract/19/5/1\n331/783939\nVERONA\n10 8 Oct\n4:30-6:00 pm\nGroup work\ncheck\nMIGNINI\n11 13 Oct\n2:45-4:15 pm\nBuilding the agile\norganization\nLeadership\nOnline (A):\nBarnes & Noble\nvs. Amazon.com\n[HBS 9798063]\nTeece D.J. et\nal., Strategic\nManagement\nJournal\nhttps://sms.onlinel\nibrary.wiley.com/d\noi/abs/10.1002/%\n28SICI%291097-\n0266%28199708\n%2918%3A7%3C\n509%3A%3AAID-\nSMJ882%3E3.0.\nCO%3B2-Z\nO’Reilly C.A. and\nTushman\nM., Research in\nOrganizational\nBehavior\nhttps://papers.ssr\nn.com/sol3/paper\ns.cfm?abstract_id\n=978493\nVERONA\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 5/12\n\n[Pagina 6]\nSYLLABUS 2026/2027\n12 15 Oct\n8:30-10:00 am\nGuest Speaker* VERONA\nMid-term break\n13 29 Oct\n4:30-6:00 pm\nSustaining\nInnovation\nRed Bull (A)\n[HBS 9714401]\nShane S.A.,\nChapter 10\nMIGNINI\n14 3 Nov\n2:45-4:15 pm\nDelivering\nInnovation\nTesla, Inc.\n[MH 0067]\nShane S.A.,\nChapter 7\nMIGNINI\n15 5 Nov\n4:30-6:00 pm\nGroup work\ncheck\nMIGNINI\n16 10 Nov\n2:45-4:15 pm\nMake or Buy? The Walt Disney\nCompany\nand Pixar Inc: To\nacquire or not to\nacquire?\n[HBS 9709462]\nShane S.A.,\nChapters 3 and 4\nMIGNINI\n17 12 Nov\n4:30-6:00 pm\nOpen Innovation Lego (A): The\ncrisis\n[HBS 9713478]\nChesbrough\nH.W., Open\nInnovation\nhttps://books.goo\ngle.com/books/ab\nout/Open_Innovat\nion.html?id=4hTR\nWStFhVgC\nMIGNINI\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 6/12\n\n[Pagina 7]\nSYLLABUS 2026/2027\nShane S.A.,\nChapter 14\n18 17 Nov\n2:45-4:15 pm\nMarket creation $19B 4 txt app\nWhatsApp… omg!\n[HBS 9715441]\nShane S.A.,\nChapter 10\nMIGNINI\n19 17 Nov\n4:30-6:00 pm\nGroup work\ncheck\nMIGNINI\n20 24 Nov\n2:45-4:15 pm\nCreativity and\nWatches\nRaffaelli\nR., Administrative\nScience Quarterly\nhttps://www.jstor.\norg/stable/485895\n81\nMIGNINI\n21 26 Nov\n8:30-10:00 am\nGuest Speaker* MIGNINI\n22 1 Dec\n1:00-2:30 pm\nGroup work\npresentations\nVERONA &\nMIGNINI\n23 1 Dec\n2:45-4:15 pm\nGroup work\npresentations\nVERONA &\nMIGNINI\n24 3 Dec\n4:30-6:00 pm\nWrap up and\ntakeaways\nVERONA &\nMIGNINI\n11 Dec\n25 Jan\nFinal Exam\n* Subject to change based on Guest Speaker’s availability.\nTEACHING METHODS\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 7/12\n\n[Pagina 8]\nSYLLABUS 2026/2027\nSelection:\nLectures\nLectures\nGuest speaker's talks (in class or in distance)\nCase Study Analysis\nCollaborative Works / Assignments\nProject work\nProject Presentation\nCompetitions/Hackathons\nThe course is highly interactive, and regular attendance is strongly recommended. Class\ninteraction and participation will be assessed. Students will also complete a graded group\nproject. A final written exam will assess students' overall understanding of the course content.\nThe final grade will be calculated as follows:\nClass participation: 30%\nGroup work: 20%\nFinal written exam: 50%\nASSESSMENT METHODS\nSelected methods: Continuous\nassessment\nPartial exams General exam\nWritten individual\nexam\n(traditional/online)\nx\nOpen and/or closed\nanswers questions\nexam\nx\nCollaborative Works /\nAssignment (report,\nexercise, presentation,\nproject work etc.)\nx\nEvaluation of oral\npresentation in class\n(possible)\nx\nActive class\nparticipation (virtual,\nx\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 8/12\n\n[Pagina 9]\nSYLLABUS 2026/2027\nattendance)\nATTENDING STUDENTS\nThe final grade will be computed as follows:\nClass participation (30%) will be assessed at the group level. Students are expected to\nform their own groups of up to six members. Each group should choose a name and\nappoint a spokesperson, to whom the instructors will address any group-specific\ncommunications. The group’s name and list of members, including the spokesperson,\nshould be submitted by noon on Friday, September 11, via email\nto giulia.corbella@unibocconi.it. The assessment of class participation will be based on\nboth groups’ voluntary contributions and their responses to cold calls during case\ndiscussions.\nThe group work (20%) will test students’ ability to apply the concepts covered in class to\na practical context. Working in self-selected groups, students will analyze how a real-\nworld company has successfully leveraged Corporate Venturing and develop a clear\nunderstanding of the factors underlying its success.\nA final written exam (50%) will evaluate students’ overall understanding of the course\ncontent.\nTo qualify as attending students, students must attend at least 75% of classes (attendance will\nbe recorded at each session) and participate in the group project.\nAttending-student status will remain valid for the December 2026 and January 2027\nexamination sessions.\nNOT-ATTENDING STUDENTS\nThe assessment of non-attending students is based entirely on a final exam. The exam\nevaluates students’ understanding of innovation, technological change and their management,\nas well as their ability to think critically and apply the models covered in the course to business\nsituations involving technology and innovation.\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 9/12\n\n[Pagina 10]\nSYLLABUS 2026/2027\nGENAI USE\nThe use of Generative Artificial Intelligence tools by students, solely as support during teaching\nactivities*, is:\nConsentito solo nei casi esplicitamente dichiarati nelle Modalita' didattiche e/o Metodi di\nvalutazione\nAllowed only in cases explicitly stated in the \"Teaching Methods\" and/or \"Assessment\nMethods\" sections\nTEACHING MATERIALS\n- INTENT cl. 27\nATTENDING STUDENTS\nHandouts distributed throughout the course\nCases:\nStrategy in the twenty-first century pharmaceutical industry: Merck & Co. and\nPfizer Inc. [HBS 9707509]\nResponding to the Wii? [HBS 9709448]\nKodak and the digital revolution (A) [HBS 9705448]\nSNAM Case [SDA Bocconi]\nLeadership Online (A): Barnes & Noble vs. Amazon.com [HBS 9798063]\nRed Bull (A) [HBS 9714401]\nTesla, Inc. [MH0067]\nThe Walt Disney Company and Pixar Inc: To acquire or not to acquire? [HBS\n9709462]\nLego (A): The crisis [HBS 9713478]\n$19B 4 txt app WhatsApp… omg! [HBS 9715441]\nReading:\nO’Reilly C.A. and Tushman M., 2008. Ambidexterity as a dynamic capability:\nResolving the innovator’s dilemma. Research in Organizational Behavior.\nSuggested reading: Shane S.A., 2009. Technology Strategy for Managers and\nEntrepreneurs. Prentice Hall.\nAll the material listed above, except for Shane (2009), constitutes exam material.\n© Università Bocconi | Via Sarfatti 25 | 20136 Milano | Tel. 02.5836.1 Pag. 10/12\n\n[Pagina 11]\nSYLLABUS 2026/2027\nNON-ATTENDING STUDENTS\nShane S.A., 2009. Technology Strategy for Managers and Entrepreneurs. Prentice\nHall. This is in substitution of the handouts for attending students.\nCases:\nStrategy in the twenty-first century pharmaceutical industry: Merck & Co. and\nPfizer Inc. [HBS 9707509]\nResponding to the Wii? [HBS 9709448]\nKodak and the digital revolution (A) [HBS 9705448]\nSNAM Case [SDA Bocconi]\nLeadership Online (A): Barnes & Noble vs. Amazon.com [HBS 9798063]\nRed Bull (A) [HBS 9714401]\nTesla, Inc. [MH0067]\nThe Walt Disney Company and Pixar Inc: To acquire or not to acquire? [HBS\n9709462]\nLego (A): The crisis [HBS 9713478]\n$19B 4 txt app WhatsApp… omg! [HBS 9715441]\nReading:\nO’Reilly C.A. and Tushman M., 2008. Ambidexterity as a dynamic capability:\nResolving the innovator’s dilemma. Research in Organizational Behavior.\nAll the material lis
